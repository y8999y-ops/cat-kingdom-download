// 字太多放不下時（例如右下角有按鈕），字稍微縮小，不會被切掉
function fitSay() {
  const box = $("#say"), t = $("#sayText");
  t.style.fontSize = "";
  let px = parseFloat(getComputedStyle(t).fontSize);
  while (box.scrollHeight > box.clientHeight + 1 && px > 14) { px -= 1; t.style.fontSize = px + "px"; }
}
// 小龍的表情：答對開心（跳一下），答錯想一想（搖一搖）；過一下回到平常
let moodTimer = 0;
function catMood(cls, anim, ms) {
  const c = $("#cat"), s = c.querySelector("svg");
  c.classList.remove("bounce", "sad"); void c.offsetWidth; c.classList.add(anim);
  if (!s) return;
  s.classList.remove("mood-happy", "mood-think"); s.classList.add(cls);
  clearTimeout(moodTimer);
  moodTimer = setTimeout(() => s.classList.remove(cls), ms);
}
function catBounce() { catMood("mood-happy", "bounce", 1800); }
function catSad() { catMood("mood-think", "sad", 2400); }

// ================= 關卡結束與畫面 =================
// 挑戰模式：每錯兩次扣一顆星（老師要求）。錯 0～1 次 3 顆、2～3 次 2 顆、4～5 次 1 顆；錯 6 次愛心用完，要複習再重來
function starsFor(m) { return Math.max(1, 3 - Math.floor(m / 2)); }
function starHtml(n) { return [0, 1, 2].map((i) => ico("star", "star" + (i < n ? "" : " off"))).join(""); }

// 過關畫面的圖卡：和提示的複習小卡一樣用圖，不放大段文字（老師說學生不會看字）
function passCard(name, ang, kind, i, rot = 0, flip = false) {
  const tf = rot || flip ? ` style="transform:rotate(${rot}deg)${flip ? " scaleX(-1)" : ""}"` : "";
  return `<div class="rv"><div${tf}>${miniTri(ang, kind, COLORS[i])}</div>${name ? `<b>${name}</b>` : ""}</div>`;
}
// 全等的圖：一個三角形和轉過、翻過的同一個三角形 → 疊在一起完全疊合（同一個比例畫，看得出來一樣大）
// 老師說以前兩張小圖各自縮放，看起來不像全等。
function congruentSvg() {
  const keep = S;
  S = 100;
  const t = makeTri([90, 30, 60], 1), pts = pointsAttr({ v: t.v });
  S = keep;
  const tri = (col, tf, op = 1) => `<polygon points="${pts}" fill="${col}" fill-opacity="${op}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round" transform="${tf}"/>`;
  return `<svg class="mini-corr cong" viewBox="-75 -75 580 190">` +
    tri("#90caf9", "translate(0,0)") + tri("#ffcc80", "translate(170,0) rotate(120) scale(-1,1)") +
    `<path d="M262 0h50m-14-12l14 12-14 12" fill="none" stroke="#8d6e63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` +
    tri("#90caf9", "translate(410,0)") + tri("#ffcc80", "translate(410,0)", 0.55) +
    `<text x="85" y="104" text-anchor="middle" font-size="22" fill="#4e342e">轉一轉、翻一翻</text>` +
    `<text x="410" y="104" text-anchor="middle" font-size="22" fill="#4e342e">完全疊合</text></svg>`;
}
function passPics(id) {
  if (id === "side") return `<div class="review">${REVIEW.side.map((c, i) => passCard(c[0], c[2], "side", i)).join("")}</div>`;
  if (id === "angle") return `<div class="review">${REVIEW.angle.map((c, i) => passCard(c[0], c[2], "angle", i + 3)).join("")}</div>`;
  if (id === "both1") return `<div class="review two">${passCard("等腰直角三角形", [90, 45, 45], "both", 4)}${passCard("不等邊鈍角三角形", [120, 35, 25], "both", 0)}</div>`;
  if (id === "corr") return `<div class="review one">${corrReviewSvg()}<b>對應點、對應邊、對應角</b></div>`;
  if (id === "both2" || id === "tutorial") return `<div class="review one">${congruentSvg()}</div><p class="pass-cap">能完全疊合，就是<b>全等三角形</b>。</p>`;
  return "";
}

function finishPage(fast) {
  if (pageDone) return;
  pageDone = true;

  if (mode !== "tutorial" && !learn) {   // 學習模式不計分、不存紀錄
    results.push({ title: PAGES[pageIdx].title, stars, mistakes });
    var jarBefore = jarStars();
    addJar(stars);   // 星星存進儲存罐（重玩也會加）
    saveBest(PAGES[pageIdx].id, stars);   // 先算儲存罐再存最佳星星（舊紀錄換算儲存罐時才不會多算）
  }
  catBounce();
  const order = levelList(), at = order.indexOf(pageIdx);
  const nextIdx = at >= 0 && at + 1 < order.length ? order[at + 1] : -1;
  const last = nextIdx < 0;

  setTimeout(() => {
    if (tok !== pageToken) return;
    if (mode === "tutorial") {

      showPanel(`${confetti()}<div class="pass-row"><div class="big-cat happy">${dragonIco("happy")}</div><div class="pass-badge"><svg viewBox="0 0 24 24">${ICONS.check}</svg></div></div>
        <h2>${name} 過關！</h2>

    } else {

        <div class="stars pop">${starHtml(stars)}</div>
        <div class="jar-row small" id="passJar"><span class="jar-box">${jarSvg(jarBefore)}</span><div><b>存進儲存罐</b><span id="jarCount">${jarText(jarBefore)}</span></div></div>

        <button class="btn" id="nextBtn">${last ? "看成績" : "下一關"}</button>
        <button class="btn ghost" id="toMenuBtn">回選單</button>`);
    }
    if (!learn && mode !== "tutorial") flyStarsToJar(jarBefore, stars);   // 星星一顆一顆飛進儲存罐
    const toMenu = $("#toMenuBtn");
    if (toMenu) toMenu.addEventListener("click", showHome);

    if (nextBtn) nextBtn.addEventListener("click", () => {

  }, fast ? 0 : 1200);   // 按「完成」後馬上出來；最後一個答對時，先看一下「答對了」再出來
}

// 過關畫面的動畫：拿到的星星一顆一顆飛進儲存罐，罐子裡的星星跟著變多（老師要求）
function flyStarsToJar(before, n) {
  const tok = pageToken, jar = $("#passJar .jar-box"), cnt = $("#jarCount");
  const stars = [...document.querySelectorAll(".stars.pop .ico.star:not(.off)")].slice(0, n);
  if (!jar || !cnt) return;
  stars.forEach((s, i) => {
    setTimeout(() => {
      if (tok !== pageToken || !document.body.contains(jar)) return;
      const a = s.getBoundingClientRect(), b = jar.getBoundingClientRect();
      const fly = document.createElement("div");
      fly.className = "fly-star";
      fly.innerHTML = ico("star", "star");
      fly.style.left = a.left + "px"; fly.style.top = a.top + "px"; fly.style.fontSize = a.height + "px";
      document.body.appendChild(fly);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      const anim = fly.animate([
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: `translate(${dx * .5}px,${dy * .5 - 60}px) scale(1.15)`, opacity: 1, offset: .5 },
        { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: .9 },
      ], { duration: 750, easing: "ease-in-out" });
      anim.onfinish = () => {
        fly.remove();
        const now = before + i + 1;
        jar.innerHTML = jarSvg(now);
        jar.classList.remove("gulp"); void jar.offsetWidth; jar.classList.add("gulp");
        cnt.textContent = jarText(now);
      };
    }, 1100 + i * 650);   // 星星先彈出來，再一顆一顆飛
  });
}
// 過關動畫：彩色的小三角形和星星從上面飄下來（老師要求加過關動畫；沒有音效）
function confetti() {
  const cols = ["#ff8a80", "#ffd54f", "#81c784", "#4fc3f7", "#ce93d8", "#ffb74d"];
  let s = "";
  for (let i = 0; i < 28; i++) {
    const star = i % 4 === 0;
    s += `<i class="${star ? "cf-star" : "cf-tri"}" style="left:${(Math.random() * 96).toFixed(1)}%;` +
      `animation-delay:${(Math.random() * 0.9).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.4).toFixed(2)}s;` +
      `--c:${cols[i % cols.length]};--r:${Math.round(Math.random() * 720 - 360)}deg"></i>`;
  }
  return `<div class="confetti" aria-hidden="true">${s}</div>`;
}
function showPanel(html, cls) { playing = false; drawHandle(); $("#panel").className = "panel" + (cls ? " " + cls : ""); $("#panel").innerHTML = html; $("#overlay").classList.add("show"); }

function showFinal() {

  const max = results.length * 3;
  const msg = allStars >= max - 1 ? "太厲害了！" : allStars >= max * 0.66 ? "做得很好！" : "再玩一次會更熟練。";

    ${challengeUnlocked() ? `<p><b>挑戰關打開了！</b>回選單就能挑戰。</p>` : ""}
    <button class="btn" id="againBtn">再玩一次</button>

// 挑戰模式不放「練習：轉一轉、翻一翻」（老師要求）
function levelList() { return PAGES.map((pg, i) => i).filter((i) => learn || PAGES[i].mode !== "tutorial"); }
function showHome() {
  if (learn === null) return showModePick();
  clearBoard();
  setTheme();
  say("選一關開始。");

// ================= 星星：挑戰模式每關 3 顆，每錯兩次少一顆 =================
// 學習模式沒有星星；限時挑戰關也沒有（答錯一次就結束）
// 右上角顯示星星（2026-11-06 老師要求把愛心改成星星）：每錯兩次少一顆星，錯 6 次星星扣完，要複習再重來。
// 函式名稱和 #hearts 是舊名稱。
function renderHearts(justLost) {
  const el = $("#hearts");
  if (learn || challenge || mode === "tutorial") { el.innerHTML = ""; return; }
  const left = Math.max(0, LIVES - Math.floor(mistakes / 2));
  const lostNow = justLost && mistakes % 2 === 0;   // 剛好錯第 2、4、6 次，少一顆星
  el.innerHTML = Array.from({ length: LIVES }, (_, i) =>
    ico("star", "star" + (i < left ? "" : " off") + (lostNow && i === left ? " break" : ""))).join("");
}
function loseHeart() {
  combo = 0;   // 連續答對中斷
  catSad();   // 小龍搖一搖
  mistakes++;
  if (learn) return;   // 學習模式：只記次數，不扣星星
  const tok = pageToken;
  if (challenge) {
    // 限時挑戰關：答錯一次就結束（老師要求），馬上跳出結束畫面（老師覺得原本停 1.2 秒太慢）
    playing = false;
    drawHandle();
    setTimeout(() => { if (tok === pageToken) endChallenge("wrong"); }, 250);
    return;
  }
  renderHearts(true);
  if (mistakes < LIVES * 2) return;
  // 星星扣完：先停一下（0.7 秒），讓學生看到答錯的說明，再去複習
  playing = false;
  drawHandle();
  setTimeout(() => { if (tok === pageToken) showReview(); }, 700);
}

// ================= 愛心用完：複習一下再重來 =================
const REVIEW = {
  side: [["正三角形", "三條邊都一樣長", [60, 60, 60]], ["等腰三角形", "有兩條邊一樣長", [80, 50, 50]], ["不等邊三角形", "三條邊都不一樣長", [50, 60, 70]]],
  angle: [["銳角三角形", "三個角都是銳角", [50, 60, 70]], ["直角三角形", "有一個角是直角", [90, 30, 60]], ["鈍角三角形", "有一個角是鈍角", [120, 35, 25]]],
};
// 畫一個小三角形（含記號），借用 marksSvg，所以暫時把 S 換成小圖的大小
function miniTri(angles, kind, color) {
  const keep = S;
  S = 70;
  const t = makeTri(angles, 1);
  const p = { v: t.v, ang: t.ang, sides: t.sides, size: 1, cat: categorize(t.ang) };
  const body = `<polygon points="${pointsAttr(p)}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` + marksSvg(p, kind);
  const xs = t.v.map((q) => q[0] * S), ys = t.v.map((q) => q[1] * S);
  S = keep;
  const pad = 12, x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return `<svg class="mini-tri" viewBox="${x0} ${y0} ${Math.max(...xs) - x0 + pad} ${Math.max(...ys) - y0 + pad}">${body}</svg>`;
}
// 對應的示意圖：A↔D 粉紅圈、AB↔DE 藍線、角 C↔角 F 綠色扇形
function corrReviewSvg() {
  const keep = S;
  S = 70;
  const t = makeTri([50, 60, 70], 1);
  const v = t.v.map(([x, y]) => [x * S, y * S]);
  S = keep;
  const draw = (labels, rot, color) => {
    let g = `<polygon points="${v.map((q) => q.join(",")).join(" ")}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` +
      `<line x1="${v[0][0]}" y1="${v[0][1]}" x2="${v[1][0]}" y2="${v[1][1]}" stroke="${CORR_COL.side}" stroke-width="7" stroke-linecap="round"/>` +
      `<path d="${arcD(v, 2, 18)}" fill="${CORR_COL.angle}" fill-opacity=".5" stroke="${CORR_COL.angle}" stroke-width="3"/>`;
    for (let i = 0; i < 3; i++) {
      const o = norm(v[i]), x = v[i][0] + o[0] * 18, y = v[i][1] + o[1] * 18;
      g += `<g transform="translate(${x},${y}) rotate(${-rot})"><circle r="12" fill="#fff" stroke="${i === 0 ? CORR_COL.point : "#5d4037"}" stroke-width="${i === 0 ? 4 : 2}"/>` +
        `<text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#4e342e">${labels[i]}</text></g>`;
    }
    return `<g transform="rotate(${rot})">${g}</g>`;
  };
  return `<svg class="mini-corr" viewBox="-85 -80 330 160">${draw(["A", "B", "C"], 0, "#ffcc80")}<g transform="translate(160,0)">${draw(["D", "E", "F"], 150, "#b3e5fc")}</g></svg>`;
}
// 複習小卡的內容（愛心用完的複習畫面和提示都用這一份）
function reviewBody() {
  const card = ([name, why, ang], kind, i) =>
    `<div class="rv">${miniTri(ang, kind, COLORS[i])}<b>${name}</b><span>${why}</span></div>`;
  let html = "";
  if (mode === "side" || mode === "both") html += `<div class="review">${REVIEW.side.map((c, i) => card(c, "side", i)).join("")}</div>`;
  if (mode === "angle" || mode === "both") html += `<div class="review">${REVIEW.angle.map((c, i) => card(c, "angle", i + 3)).join("")}</div>`;
  if (mode === "both" && !direct) html += `<p><b>全等三角形</b>：形狀、大小都一樣，可以完全疊合。<br>可以移動、旋轉、翻面來疊疊看。</p>`;
  if (mode === "corr") {
    html += `<div class="review one">${corrReviewSvg()}</div>
      <p>兩個三角形<b>全等</b>時，疊合在一起的點、邊、角，<br>叫做<b>對應點、對應邊、對應角</b>。<br>對應邊一樣長，對應角一樣大。</p>`;
  }
  return html;
}
function showReview() {
  let html = `<div class="big-cat">${ico("book")}</div><h2>星星用完了，先複習一下</h2>` + reviewBody();

// ================= 紀錄：每關最佳星星、挑戰關最佳分數（存在這台平板上） =================
const BEST_KEY = "triangle-best-v1";
const SCORED = PAGES.filter((p) => p.mode !== "tutorial");
function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (_) { return {}; }
}
// 比原本好才存；有存就回傳 true
function saveBest(key, val) {
  try {
    const b = loadBest();
    if (b[key] >= val) return false;
    b[key] = val;
    localStorage.setItem(BEST_KEY, JSON.stringify(b));
    return true;
  } catch (_) { return false; }
}
// 清除紀錄：星星、儲存罐、挑戰紀錄都清掉，老師解鎖也一起關掉，挑戰關會重新上鎖（老師反映清除後挑戰關還是打開的）
function clearBest() { try { localStorage.removeItem(BEST_KEY); } catch (_) {} teacherOpen = false; }
// 老師解鎖只在這次打開網頁時有效；以前版本存在平板上的 teacher 記號，載入時清掉，挑戰關才會重新上鎖

// ---------- 星星儲存罐（老師要求）：挑戰模式每次過關拿到的星星都存進去（重玩也會加），存滿 15 顆就打開挑戰關 ----------
const JAR_GOAL = 15;
function jarStars() {
  const b = loadBest();
  if (b.jar != null) return b.jar;
  return SCORED.reduce((s, p) => s + (b[p.id] || 0), 0);   // 以前的紀錄：先用每關最好的星星當起點
}
function addJar(n) {
  try { const b = loadBest(); b.jar = jarStars() + n; localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (_) {}
}
// 儲存罐的圖：玻璃罐，星星裝到哪裡就塗到哪裡
function jarSvg(n) {
  const k = Math.min(1, n / JAR_GOAL), h = 46 * k;
  return `<svg class="jar" viewBox="0 0 60 70" aria-hidden="true">` +
    `<defs><clipPath id="jarIn"><path d="M12 22c0-4 4-6 4-9h28c0 3 4 5 4 9v36c0 5-4 8-9 8H21c-5 0-9-3-9-8z"/></clipPath></defs>` +
    `<rect x="0" y="${66 - h}" width="60" height="${h + 4}" fill="#ffd54f" clip-path="url(#jarIn)"/>` +
    (k > 0 ? `<path d="M30 ${Math.max(28, 64 - h + 10)}l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#ff8f00"/>` : "") +
    `<path d="M12 22c0-4 4-6 4-9h28c0 3 4 5 4 9v36c0 5-4 8-9 8H21c-5 0-9-3-9-8z" fill="none" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` +
    `<rect x="14" y="4" width="32" height="9" rx="3" fill="#bcaaa4" stroke="#5d4037" stroke-width="3"/>` +
    `<path d="M18 28v22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg>`;
}
// 儲存罐的字：還沒滿顯示「8 / 15 顆」，滿了以後顯示一共存了幾顆
function jarText(n) { return n < JAR_GOAL ? `${n} / ${JAR_GOAL} 顆，存滿就能挑戰` : `一共 ${n} 顆，挑戰關打開了`; }
function jarHtml() {
  const n = jarStars();
  return `<div class="jar-row">${jarSvg(n)}<div><b>星星儲存罐</b><span>${jarText(n)}・可用星星 ${walletStars()} 顆</span></div></div>`;
}
function challengeUnlocked() { return teacherOpen || jarStars() >= JAR_GOAL; }
// ---------- 可用星星和小龍變裝（老師要求：累積的星星可以買小龍的配件、換顏色） ----------
// 儲存罐（jar）只會增加，用來打開挑戰關；買東西花掉的記在 spent，可用星星 = 儲存罐 − 花掉的，所以花星星不會讓挑戰關又鎖起來
function walletStars() { return Math.max(0, jarStars() - (loadBest().spent || 0)); }
function saveDg(fn) { try { const b = loadBest(); fn(b); localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (_) {} }
// 小龍變裝（選模式畫面、挑戰模式首頁都可以進來）：顏色、龍角、龍鬚、眼睛、表情、配件六種。
// 沒有的東西要先問「要不要買」（老師要求），買了就換上；已經有的點一下就換上。
let shopBack = null;
function showShop(tab, back) {
  if (back) shopBack = back;
  const { look, own } = dgState(), wallet = walletStars(), part = DG_PARTS[tab];
  const has = (it) => it.price === 0 || own.includes(it.id);
  const cur = look[tab] || (tab === "acc" ? "none" : DG_DEFAULT[tab]);
  const cells = part.items.map((it) => {
    const on = it.id === cur;
    const tag = on ? "使用中" : has(it) ? "換上" : `${ico("star", "star")} ${it.price}`;
    return `<button class="shop-item${on ? " on" : ""}${!has(it) && it.price > wallet ? " poor" : ""}" data-id="${it.id}">${dragonSvg({ ...look, [tab]: it.id })}<b>${it.name}</b><span>${tag}</span></button>`;
  }).join("");
  const tabs = Object.keys(DG_PARTS).map((k) => `<button class="tab${k === tab ? " on" : ""}" data-tab="${k}">${DG_PARTS[k].name}</button>`).join("");
  showPanel(`<h2>小龍變裝</h2>
    <div class="shop-top"><div class="big-cat">${dragonSvg(look, "happy")}</div><p>可用星星：${ico("star", "star")} <b>${wallet}</b> 顆</p></div>
    <div class="shop-tabs">${tabs}</div>
    <div class="shop-grid">${cells}</div>
    <p class="note" id="shopMsg">挑戰模式過關、挑戰關答對，都可以得到星星。</p>
    <button class="btn" id="shopBackBtn">返回</button>`, "wide");
  for (const b of document.querySelectorAll(".shop-tabs .tab")) b.addEventListener("click", () => showShop(b.dataset.tab));
  for (const b of document.querySelectorAll(".shop-item")) b.addEventListener("click", () => {
    const it = part.items.find((x) => x.id === b.dataset.id);
    const wear = () => { saveDg((d) => { d.dg = { ...(d.dg || {}), [tab]: it.id }; }); $("#cat").innerHTML = dragonIco(); showShop(tab); };
    if (has(it)) return wear();
    if (walletStars() < it.price) { $("#shopMsg").textContent = `還差 ${it.price - walletStars()} 顆星，多玩幾關再來！`; b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); return; }
    // 先問要不要買
    showPanel(`<h2>要買嗎？</h2>
      <div class="big-cat">${dragonSvg({ ...look, [tab]: it.id }, "happy")}</div>
      <p>用 ${ico("star", "star")} <b>${it.price}</b> 顆星買「<b>${it.name}</b>」？<br><span class="note">買了以後還剩 ${walletStars() - it.price} 顆。</span></p>
      <button class="btn" id="buyYes">買！</button>
      <button class="btn ghost" id="buyNo">先不要</button>`);
    $("#buyYes").addEventListener("click", () => { saveDg((d) => { d.spent = (d.spent || 0) + it.price; d.own = [...(d.own || []), it.id]; }); wear(); });
    $("#buyNo").addEventListener("click", () => showShop(tab));
  });
  $("#shopBackBtn").addEventListener("click", () => (shopBack || showHome)());
}

// ================= 挑戰關：限時 60 秒，綜合題型 =================
// 題目一題接一題，輪流出現：以邊分類、以角分類、以邊和角分類、找全等、找對應。答對一題 1 分。
// 答錯一次就結束（老師要求）；分數就是答對幾題。
const CHAL_SEC = 60;
const CHAL_TYPES = ["side", "angle", "both", "pick", "corr"];

function makePiece(tri, id, color) {
  return {
    id, v: tri.v.map((q) => [...q]), ang: tri.ang, sides: tri.sides, size: tri.size, cat: categorize(tri.ang),
    distractor: false, reason: "", state: "free", partner: null, nx: 0.5, ny: 0.5,
    r: 30 * rand(12), s: Math.random() < 0.5 ? 1 : -1, marks: null, color,
  };
}

function startChallenge() {
  pageToken++;
  challenge = true;
  pageIdx = -1;
  mistakes = 0;
  combo = 0;
  pageDone = false;
  selected = null;
  lastAct = Date.now();
  $("#pageLabel").textContent = "挑戰關";
  chal = { end: Date.now() + CHAL_SEC * 1000, score: 0, last: null, over: false, busy: false, n: 0 };
  renderHearts();
  playing = true;
  nextChalTask();
  const tok = pageToken;
  const timer = setInterval(() => {
    if (tok !== pageToken || chal.over) return clearInterval(timer);
    renderChalBar();
    if (Date.now() >= chal.end) endChallenge("time");
  }, 200);
}

function renderChalBar() {
  const ms = Math.max(0, chal.end - Date.now()), left = Math.ceil(ms / 1000);
  $("#progress").innerHTML =
    `<span class="chal-time${left <= 10 ? " hurry" : ""}">${ico("clock")} ${left} 秒</span>` +
    `<span class="chal-bar"><i style="width:${(100 * ms / (CHAL_SEC * 1000)).toFixed(1)}%"></i></span>` +
    `<span class="chal-score">答對 ${chal.score} 題</span>`;
}

function nextChalTask() {
  if (chal.over) return;
  const type = pick(CHAL_TYPES.filter((t) => t !== chal.last));   // 不連續出同一種
  chal.last = type;
  chal.busy = false;
  selected = null;
  mode = type;
  direct = type === "side" || type === "angle" || type === "both";
  if (!toolAvail("ruler")) setTool("ruler", false);   // 直角尺只在和角有關的題目
  if (!toolAvail("mark")) setTool("mark", false);   // 做記號只在找對應
  updateToolButtons();
  buildBins();
  measure();
  if (type === "corr") {
    corr = { round: rand(3) };
    startCorrRound();
  } else if (type === "pick") {
    startPickTask();
  } else {
    // 分類題：一次一個三角形，拖到正確的格子
    const keys = type === "both" ? ALL_KEYS.filter((k) => k !== "equi-acute") : ALL_KEYS;
    grid = { cols: 1, rows: 1 };
    measure();
    const p = makePiece(makeTri(pick(LIB[pick(keys)]), 0.95 + Math.random() * 0.2), "q" + chal.n++, pick(COLORS));
    p.nx = Math.max(100, W - TOOL_W) / 2 / W;
    fitIn(p, 10, 50);
    pieces = [p];
    renderAll();
    updateTools();
    say(`<b>${type === "side" ? "以邊分類" : type === "angle" ? "以角分類" : "以邊和角分類"}</b><br>把三角形拖到下面正確的格子裡。`);
  }
  renderChalBar();
}

// 把三角形等比例放大或縮小（形狀一樣，大小不同）
function scaleTri(t, k) {
  return { v: t.v.map(([x, y]) => [x * k, y * k]), ang: t.ang, sides: t.sides.map((s) => s * k), size: t.size * k };
}

// 找全等：一個虛線框的三角形，另外三個裡只有一個和它全等（另外兩個：大小不同、形狀不同）
// 不是點一下就判斷：要把候選的三角形拖過去疊在虛線框上（可以轉、翻），疊合了才算對（pickDrop()）
function startPickTask() {
  const ang = pick(LIB[pick(ALL_KEYS.filter((k) => k !== "equi-acute"))]);
  const others = ALL_KEYS.flatMap((k) => LIB[k]).filter((a) => angleGap(a, ang) >= 20);   // 形狀要明顯不同
  const size = 0.85 + Math.random() * 0.15, bigger = Math.random() < 0.5;
  const colors = shuffle([...COLORS]);
  // 全等和大小不同的都用同一份形狀，只差旋轉和翻面，才轉得到一樣的方向
  const base = makeTri(ang, size);
  const target = makePiece(base, "k0", colors[0]);
  target.target = true;
  const cands = shuffle([
    Object.assign(makePiece(base, "k1", colors[1]), { answer: true }),
    Object.assign(makePiece(scaleTri(base, bigger ? 1.2 : 0.8), "k2", colors[2]), { why: bigger ? "比較大" : "比較小" }),
    Object.assign(makePiece(makeTri(pick(others), size), "k3", colors[3]), { why: "形狀不一樣" }),
  ]);
  const ans = cands.find((p) => p.answer);
  if (ans.s === target.s && ans.r === target.r) ans.r += 90;   // 一開始不能已經對齊
  pieces = [target, ...cands];
  const availW = Math.max(100, W - TOOL_W);
  const g4 = bestGrid(4), cols = g4.c, rows = g4.r;
  grid = { cols, rows };
  measure();
  pieces.forEach((p, k) => {
    p.nx = ((k % cols) + 0.5) * availW / cols / W;
    p.ny = (Math.floor(k / cols) + 0.5) / rows;
    fitIn(p, 10, 50);
  });
  renderAll();
  updateTools();
  say("哪一個和<b>虛線框</b>的三角形是<b>全等三角形</b>？<br>把它拖過去疊疊看。");
}

// 找全等：放下或轉完時檢查有沒有疊在虛線框上
function pickDrop(p, quiet) {
  if (!playing || chal.over || chal.busy) return;
  const target = pieces.find((q) => q.target);
  // 拖的是虛線框那個時，改看最近的候選
  const a = p.target
    ? pieces.filter((q) => !q.target).sort((x, y) => Math.hypot(x.nx - p.nx, x.ny - p.ny) - Math.hypot(y.nx - p.nx, y.ny - p.ny))[0]
    : p;
  const near = Math.hypot((a.nx - target.nx) * W, (a.ny - target.ny) * H) < 0.6 * Math.max(lenPx(a), lenPx(target));
  if (!near) return;   // 還沒疊上去，不判斷
  lastAct = Date.now();
  if (congruent(a, target)) {
    if (isAligned(a, target)) { flash(a, "pop", 700); chalRight("完全疊合了！這兩個三角形是全等三角形。"); return; }
    if (isAligned(a, target, true)) say("方向對了！再移動一點，讓三個角剛好疊在一起。");
    else if (!quiet) say("這兩個大小、形狀都一樣。<br>再<b>轉一轉</b>或<b>翻面</b>，讓它們對齊。");
    return;
  }
  if (quiet) return;
  // 疊上去比比看不扣愛心（老師要求）：只說明，再把它推開
  flash(a, "shake", 400);
  say("這一個疊不起來呢。<br>再比比看別的。", "think");
  pushAway(a, target);
}

function chalRight(msg) {
  addJar(1);   // 挑戰關答對一題得 1 顆星（老師要求）
  goodStreak();
  chal.score++;
  chal.busy = true;
  renderChalBar();
  say(msg, "good");
  catBounce();
  const tok = pageToken;
  setTimeout(() => { if (tok === pageToken && !chal.over) nextChalTask(); }, 700);
}

function endChallenge(reason) {
  if (chal.over) return;
  chal.over = true;
  pageToken++;   // 停掉計時器和還沒跑完的動作
  playing = false;
  const total = chal.score;
  const before = loadBest().challenge;
  const isNew = saveBest("challenge", total);
  // 最近 5 次的挑戰紀錄（在「挑戰紀錄」裡看）
  try {
    const b = loadBest();
    b.chalHist = [total, ...(b.chalHist || [])].slice(0, 5);
    localStorage.setItem(BEST_KEY, JSON.stringify(b));
  } catch (_) {}
  showPanel(`<div class="big-cat">${ico("clock")}</div><h2>${reason === "time" ? "時間到！" : "挑戰結束！"}</h2>
    <p class="big-score">答對 ${total} 題</p>
    ${total ? `<p>${ico("star", "star")} 得到 <b>${total}</b> 顆星，存進儲存罐！</p>` : ""}
    <p>${isNew ? (before == null ? "這是你的第一個成績！" : "新紀錄！") : `最佳紀錄：答對 ${before} 題`}</p>
    <button class="btn" id="chalAgainBtn">再挑戰一次</button>
    <button class="btn ghost" id="toMenuBtn">回選單</button>`);
  $("#chalAgainBtn").addEventListener("click", () => { hidePanel(); startChallenge(); });
  $("#toMenuBtn").addEventListener("click", showHome);
}

// 看成績：挑戰模式首頁的「看成績」。一般關卡和挑戰關分成兩個畫面（老師要求不要放在同一個畫面）
function showScores() {
  const best = loadBest();
  const rows = SCORED.map((p) => {
    const [num, name] = p.title.split("：");
    return `<tr><td>${num}</td><td>${name}</td><td>${best[p.id] ? starHtml(best[p.id]) : "還沒玩"}</td></tr>`;
  }).join("");
  showPanel(`<div class="big-cat">${ico("trophy")}</div><h2>我的成績</h2>
    <table class="result">${rows}</table>
    ${jarHtml()}
    <p class="note">這是這台平板上每一關最好的成績。</p>
    <button class="btn ghost" id="chalRecBtn">${ico("clock")} 挑戰關紀錄</button>
    <button class="btn" id="toMenuBtn">回選單</button>`, "wide");
  $("#chalRecBtn").addEventListener("click", showChalRecord);
  $("#toMenuBtn").addEventListener("click", showHome);
}
// 挑戰關紀錄：最佳紀錄，和最近 5 次一行一行往下列（新的在上面）
function showChalRecord() {
  const best = loadBest(), hist = best.chalHist || [];
  const body = best.challenge == null ? `<p>${challengeUnlocked() ? "還沒挑戰過。" : "挑戰關還沒打開。"}</p>`
    : `<p class="best-line">最佳紀錄：<b>答對 ${best.challenge} 題</b></p>${hist.length ? `<p class="note">最近幾次（新的在上面）：</p><ul class="chal-list">${hist.map((n) => `<li>答對 ${n} 題</li>`).join("")}</ul>` : ""}`;
  showPanel(`<div class="big-cat">${ico("clock")}</div><h2>挑戰關紀錄</h2>
    ${body}
    <button class="btn" id="backScoreBtn">回我的成績</button>`);
  $("#backScoreBtn").addEventListener("click", showScores);
}

// 遊戲中按選單按鈕：先確認，避免學生不小心按到
$("#menuBtn").addEventListener("click", () => {
  if (!playing || pageDone) return;   // 關卡完成時，完成畫面本身就有「回選單」
  showPanel(`<div class="big-cat">${dragonIco()}</div><h2>要回到選關畫面嗎？</h2>
    <p>這一關還沒做完的部分不會保留。</p>
    <button class="btn" id="keepBtn">繼續玩</button>
    <button class="btn ghost" id="leaveBtn">回選單</button>`);
  $("#keepBtn").addEventListener("click", () => { hidePanel(); playing = true; lastAct = Date.now(); drawHandle(); });
  $("#leaveBtn").addEventListener("click", showHome);
});

// ================= 其他 =================
new ResizeObserver(() => onResize()).observe(board);
function onResize() {
  fitTools();
  if (!pieces.length || (W === board.clientWidth && H === board.clientHeight)) return;
  W = board.clientWidth; H = board.clientHeight;
  // 平板轉方向：如果「出題時的三角形個數」最適合的排法（幾欄幾列）不一樣了，就重新排列，
  // 三角形才不會為了維持原本的排法而變小。
  // 用出題時的個數（grid.n），不是現在剩下的個數：分類掉幾個以後有空位，三角形也不會突然變大（老師要求）。
  const act = pieces.filter((p) => p.state === "free" || p.state === "pair");
  const best = bestGrid(grid.n || grid.cols * grid.rows);
  if (act.length && (best.c !== grid.cols || best.r !== grid.rows)) relayout(act, best);
  else for (const p of act) clampIn(p);   // 其他大小變化（例如格子變高）：三角形大小不變，只拉回桌面內
  if (mode === "corr" && pieces[1]) pieces[1].home = { nx: pieces[1].nx, ny: pieces[1].ny };
  renderAll();
  // 直角尺跟著對準的頂點走；沒對準就拉回桌面內
  keepRulerIn();
  drawRuler();
}
// n 個三角形，選格子最大的排法
function bestGrid(n) {
  const availW = Math.max(100, W - TOOL_W);
  let best = { c: 1, r: 1, cell: 0 };
  for (let c = 1; c <= Math.max(1, n); c++) {
    const r = Math.ceil(n / c), cell = Math.min(availW / c, layH() / r);
    if (cell > best.cell) best = { c, r, cell };
  }
  return best;
}
// 把還在桌面上的三角形照新的排法重新擺好（保留方向和翻面）
function relayout(act, best) {
  const availW = Math.max(100, W - TOOL_W);
  grid = { cols: best.c, rows: best.r, n: grid.n };
  measure();
  const side = mode === "corr" ? 52 : 10;
  const top = mode === "corr" ? 96 : challenge ? 50 : mode === "both" && !direct ? 40 : 10;
  act.forEach((p, k) => {
    p.nx = ((k % best.c) + 0.5) * availW / best.c / W;
    p.ny = (Math.floor(k / best.c) + 0.5) / best.r * layH() / H;
    fitIn(p, side, top);
  });
}
