<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4e0">
<title>疊疊看・三角形分類</title>
<link rel="icon" href="../icon.png">
<style>
  :root {
    --bg: #fff4e0;
    --ink: #4e342e;
    --soft: #8d6e63;
    --card: #ffffff;
    --accent: #ff8f00;
    --good: #2e7d32;
    --bad: #c62828;
    --line: #e0c9a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; touch-action: manipulation; cursor: pointer; }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- 上方：小貓和對話 ---------- */
  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  #cat { font-size: 56px; line-height: 1; flex: none; transition: transform .2s; }
  #cat.bounce { animation: bounce .5s; }
  #say {
    flex: 1; background: var(--card); border: 3px solid var(--line); border-radius: 18px;
    padding: 3px 14px; font-size: clamp(20px, 2.9vw, 28px); line-height: 1.3; height: 156px;
    display: flex; align-items: center; position: relative; overflow: hidden;
  }
  @media (max-width: 600px) {
    #say { font-size: 16px; height: 150px; padding: 4px 10px; line-height: 1.28; }
    #cat { font-size: 36px; }
  }
  #say::before {
    content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px;
    border: 9px solid transparent; border-right-color: var(--line); border-left: 0;
  }
  #say.good { border-color: #81c784; background: #f1f8e9; }
  #say.bad { border-color: #ef9a9a; background: #fff3f3; }
  .topbtns { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  #pageLabel { font-size: 21px; font-weight: bold; color: var(--soft); white-space: nowrap; }
  @media (max-width: 600px) {
    #top { padding: 6px 8px; gap: 8px; }
    #pageLabel { font-size: 12px; font-weight: normal; white-space: normal; max-width: 72px; text-align: right; }
  }
  .topbtns div { display: flex; gap: 6px; }
  .icon-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--line); background: var(--card);
    font-size: 28px; display: grid; place-items: center; padding: 0;
  }
  .icon-btn:active { transform: translateY(2px); background: #fff8e1; }

  /* ---------- 中間：三角形桌面 ---------- */
  #board { flex: 1; position: relative; z-index: 2; min-height: 0; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  .piece polygon.body { stroke: #5d4037; stroke-width: 3; stroke-linejoin: round; fill-opacity: .93; transition: fill-opacity .15s; }
  .piece.sel polygon.body { stroke: var(--accent); stroke-width: 5; }
  .piece.dragging polygon.body { fill-opacity: .5; }
  .piece.pair polygon.body { fill-opacity: .32; }
  /* 配對好的一組：綠色光暈、粗綠框、打勾，和還沒配對的明顯不同 */
  .piece.pair polygon.halo { fill: none; stroke: #66bb6a; stroke-width: 18; stroke-opacity: .45; stroke-linejoin: round; }
  .piece.pair polygon.outline { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: round; }
  .piece.pair polygon.outline2 { fill: none; stroke: #2e7d32; stroke-width: 5; stroke-linejoin: round; }
  .piece .badge circle { fill: #2e7d32; stroke: #fff; stroke-width: 3; }
  .piece .badge text { fill: #fff; font-size: 20px; font-weight: bold; pointer-events: none; }
  /* 閃爍用一圈外框做（iPad Safari 不支援 SVG 上的 CSS filter） */
  .piece polygon.glow { fill: none; stroke: #ffab00; stroke-width: 16; stroke-linejoin: round; opacity: 0; pointer-events: none; }
  .piece.pulse polygon.glow { animation: glow .7s ease-in-out 6; }
  .piece.pop polygon.glow { stroke: #fff176; animation: glow .6s ease-out 1; }
  .piece.shake { animation: shake .4s; }
  /* 找對應 */
  .piece.corr polygon.body { fill-opacity: .6; }
  .lbl text { font-size: 25px; font-weight: bold; fill: #4e342e; pointer-events: none; }
  .ask { animation: ask 1s ease-in-out infinite; }
  .hintmark { opacity: 0; animation: glow .7s ease-in-out 6; pointer-events: none; }
  @keyframes ask { 50% { opacity: .35; } }
  .marks path, .marks line { pointer-events: none; }
  #handle line { pointer-events: none; }
  #handle [data-handle] { cursor: grab; }
  #handle text { pointer-events: none; font-size: 30px; font-weight: bold; }
  @keyframes glow { 50% { opacity: 1; } }
  @keyframes shake { 25% { opacity: .6; } 50% { opacity: 1; } 75% { opacity: .6; } }
  @keyframes bounce { 30% { transform: translateY(-10px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }

  /* 右側工具列 */
  #tools {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 3;
    display: flex; flex-direction: column; gap: 10px;
  }
  #tools button {
    width: 68px; height: 68px; border-radius: 18px; border: 3px solid var(--line); background: var(--card);
    font-size: 30px; display: grid; place-items: center; padding: 0; color: var(--ink);
    box-shadow: 0 3px 0 var(--line);
  }
  #tools button span { font-size: 17px; display: block; margin-top: -4px; }
  #tools button:disabled { opacity: .35; }
  #tools button:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

  /* ---------- 下方：分類籃 ---------- */
  #bins { display: grid; gap: 8px; padding: 8px 12px 12px; position: relative; z-index: 1; }
  #bins:empty { display: none; }
  .bin {
    background: var(--card); border: 3px dashed var(--line); border-radius: 16px; min-height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .bin b { font-size: clamp(20px, 3vw, 28px); }
  .bin small { font-size: clamp(15px, 2.1vw, 19px); color: var(--soft); }
  .bin.over { background: #fff8e1; border-color: var(--accent); border-style: solid; transform: scale(1.04); }
  .bin.ok { animation: binok .6s; }
  .bin.no { animation: binno .4s; }
  .minis { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
  .minis svg { width: 34px; height: 34px; }
  @keyframes binok { 40% { background: #c8e6c9; transform: scale(1.06); } }
  @keyframes binno { 20%, 60% { transform: translateX(-6px); background: #ffcdd2; } 40%, 80% { transform: translateX(6px); } }
  .grid-head { font-size: clamp(18px, 2.8vw, 25px); font-weight: bold; text-align: center; align-self: end; color: var(--soft); }
  .grid-head.row { align-self: center; writing-mode: vertical-rl; letter-spacing: 2px; }
  #bins.both .bin { min-height: 70px; }
  #bins.both .bin b { font-size: clamp(16px, 2.6vw, 24px); }

  /* ---------- 覆蓋畫面 ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(78, 52, 46, .45); z-index: 10;
    display: none; place-items: center; padding: 16px; touch-action: auto;
  }
  #overlay.show { display: grid; }
  .panel {
    background: var(--bg); border-radius: 28px; padding: 24px 28px; max-width: 560px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25); border: 4px solid #fff;
    max-height: 100%; overflow: auto;
  }
  .panel h1 { margin: 4px 0 10px; font-size: clamp(32px, 6vw, 48px); }
  .panel h2 { margin: 4px 0 8px; font-size: clamp(28px, 5vw, 40px); }
  .panel p { font-size: clamp(21px, 3.3vw, 27px); line-height: 1.55; margin: 8px 0; }
  .big-cat { font-size: 72px; line-height: 1; }
  .stars { font-size: 52px; letter-spacing: 6px; margin: 6px 0; }
  .off { filter: grayscale(1); opacity: .3; }
  .btn {
    display: inline-block; margin: 10px 6px 0; padding: 14px 34px; font-size: 29px; font-weight: bold;
    border-radius: 999px; border: none; background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c56000;
  }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .howto { text-align: left; display: inline-block; font-size: clamp(20px, 3.2vw, 25px); line-height: 1.75; margin: 6px 0 10px; }
  .seat { font-size: 23px; margin: 8px 0; }
  .seat input {
    width: 110px; font-size: 28px; padding: 6px 10px; border-radius: 12px; border: 3px solid var(--line);
    text-align: center; touch-action: auto; user-select: text; -webkit-user-select: text;
  }
  table.result { margin: 10px auto; border-collapse: collapse; font-size: 23px; }
  table.result td, table.result th { padding: 6px 12px; border-bottom: 2px solid var(--line); }
  .note { font-size: 18px !important; color: var(--soft); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="cat">🐱</div>
    <div id="say">一起來疊疊看！</div>
    <div class="topbtns">
      <div id="pageLabel"></div>
      <div>
        <button class="icon-btn" id="hintBtn" aria-label="提示">💡</button>
      </div>
    </div>
  </div>
  <div id="board">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="layer"></g><g id="handle"></g></svg>
    <div id="tools">
      <button id="rotL" aria-label="向左轉" disabled>↺<span>轉</span></button>
      <button id="rotR" aria-label="向右轉" disabled>↻<span>轉</span></button>
      <button id="flip" aria-label="翻面" disabled>⇋<span>翻面</span></button>
    </div>
  </div>
  <div id="bins"></div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<noscript>請開啟 JavaScript 才能玩這個遊戲。</noscript>

<script>
"use strict";

// ================= 題庫：三個角的度數 =================
const LIB = {
  "equi-acute": [[60, 60, 60]],
  "iso-acute":  [[40, 70, 70], [50, 65, 65], [80, 50, 50], [30, 75, 75]],
  "iso-right":  [[90, 45, 45]],
  "iso-obtuse": [[110, 35, 35], [120, 30, 30], [130, 25, 25]],
  "sca-acute":  [[50, 60, 70], [45, 65, 70], [40, 65, 75], [55, 48, 77]],
  "sca-right":  [[90, 30, 60], [90, 35, 55], [90, 25, 65]],
  "sca-obtuse": [[110, 40, 30], [120, 35, 25], [105, 45, 30], [130, 30, 20], [115, 25, 40]],
};
const ALL_KEYS = Object.keys(LIB);
const NAME_ANGLE = { acute: "銳角三角形", right: "直角三角形", obtuse: "鈍角三角形" };
const NAME_SIDE = { equi: "正三角形", iso: "等腰三角形", sca: "不等邊三角形" };
const WHY_ANGLE = {
  acute: "三個角都比直角小",
  right: "有一個角是直角",
  obtuse: "有一個角比直角大",
};
const WHY_SIDE = {
  equi: "三條邊都一樣長",
  iso: "有兩條邊一樣長",
  sca: "三條邊都不一樣長",
};
const COLORS = ["#ff8a80", "#ffb74d", "#ffd54f", "#aed581", "#4fc3f7", "#9575cd",
                "#f06292", "#4db6ac", "#bcaaa4", "#90caf9", "#ce93d8", "#dce775"];

// direct：直接把三角形拖進分類籃，不用先配對全等
const PAGES = [
  { mode: "side", direct: true, title: "第 1 關：用「邊」分類" },
  { mode: "angle", direct: true, title: "第 2 關：用「角」分類" },
  { mode: "tutorial", title: "練習：疊疊看" },
  { mode: "both", title: "第 3 關：疊疊看，再分類" },
  { mode: "corr", title: "第 4 關：找對應" },
];

// ================= 小工具 =================
const $ = (s) => document.querySelector(s);
const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const sortNum = (a) => [...a].sort((x, y) => x - y);
const sameAngles = (a, b) => { const x = sortNum(a), y = sortNum(b); return x.every((v, i) => Math.abs(v - y[i]) < 0.5); };
const PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
const ALIGN_TOL = 0.12;   // 疊合門檻：頂點誤差小於邊長的 12%
const ALIGN_DEG = 5;      // 而且方向誤差不超過 5°

// 用三個角和最長邊長度做出三角形（頂點以重心為原點）
function makeTri(angles, size) {
  let a = [...angles];
  const k = rand(3);
  a = [...a.slice(k), ...a.slice(0, k)];
  if (Math.random() < 0.5) a.reverse();
  const [A, B, C] = a.map((d) => d * Math.PI / 180);
  const b = Math.sin(B) / Math.sin(C);
  let v = [[0, 0], [1, 0], [b * Math.cos(A), -b * Math.sin(A)]];
  const sides = [dist(v[1], v[2]), dist(v[0], v[2]), dist(v[0], v[1])];
  const f = size / Math.max(...sides);
  v = v.map((p) => [p[0] * f, p[1] * f]);
  const cx = (v[0][0] + v[1][0] + v[2][0]) / 3, cy = (v[0][1] + v[1][1] + v[2][1]) / 3;
  v = v.map((p) => [p[0] - cx, p[1] - cy]);
  return { v, ang: a, sides: sides.map((s) => s * f), size };
}

function categorize(ang) {
  const m = Math.max(...ang);
  const angle = Math.abs(m - 90) < 0.5 ? "right" : m > 90 ? "obtuse" : "acute";
  const eq = (i, j) => Math.abs(ang[i] - ang[j]) < 0.5;
  const n = (eq(0, 1) ? 1 : 0) + (eq(1, 2) ? 1 : 0) + (eq(0, 2) ? 1 : 0);
  const side = n === 3 ? "equi" : n === 1 ? "iso" : "sca";
  return { angle, side };
}

// ================= 出題 =================
function pickAngles(key, used) {
  const fresh = LIB[key].filter((a) => !used.some((u) => sameAngles(u, a)));
  return pick(fresh.length ? fresh : LIB[key]);
}

function genSpecs(mode, direct) {
  if (mode === "tutorial") return [{ angles: [90, 45, 45], size: 1.15, role: "pair", key: "iso-right" }];
  if (direct) {
    // 每個三角形自己分類，每一類兩個
    const two = (ks) => shuffle([...ks]).slice(0, 2);
    const keys = mode === "side"
      ? ["equi-acute", "equi-acute", ...two(["iso-acute", "iso-right", "iso-obtuse"]), ...two(["sca-acute", "sca-right", "sca-obtuse"])]
      : [...two(["equi-acute", "iso-acute", "sca-acute"]), "iso-right", "sca-right", "iso-obtuse", "sca-obtuse"];
    const sizes = shuffle([0.85, 0.9, 0.95, 1.0, 1.1, 1.2]);
    const used = [];
    return keys.map((key, i) => {
      const angles = pickAngles(key, used);
      used.push(angles);
      return { angles, size: sizes[i], role: "single", key };
    });
  }
  for (let tries = 0; tries < 50; tries++) {
    const keys = shuffle(["iso-acute", "iso-right", "iso-obtuse", "sca-acute", "sca-right", "sca-obtuse"]).slice(0, 5);
    const sizes = shuffle([0.8, 0.9, 1.0, 1.1, 1.2]);
    const used = [];
    const specs = keys.map((key, i) => {
      const angles = pickAngles(key, used);
      used.push(angles);
      return { angles, size: sizes[i], role: "pair", key };
    });
    // 干擾題：看起來很像，但不全等
    const base = pick(specs);
    const alt = LIB[base.key].filter((a) => !used.some((u) => sameAngles(u, a)));
    let d;
    if (Math.random() < 0.5 || !alt.length) {
      const bigger = base.size <= 1.0;
      d = { angles: base.angles, size: bigger ? base.size * 1.25 : base.size * 0.72, role: "distractor", key: base.key,
            reason: `它和另一組的形狀一樣，可是${bigger ? "比較大" : "比較小"}，所以沒有全等的朋友。` };
    } else {
      d = { angles: pick(alt), size: base.size, role: "distractor", key: base.key,
            reason: "它和另一組的大小差不多，可是角度不一樣，所以沒有全等的朋友。" };
    }
    const clash = specs.some((s) => sameAngles(s.angles, d.angles) && Math.abs(s.size - d.size) < 0.05);
    if (!clash) return [...specs, d];
  }
  return [];
}

// ================= 遊戲狀態 =================
let pageIdx = 0, pieces = [], mode = "tutorial", grid = { cols: 1, rows: 1 };
let mistakes = 0, pageStart = 0, gameStart = 0, results = [], seatNo = "";
let selected = null, playing = false, lastAct = 0, pageDone = false;
let direct = false, replay = false, corr = null;
let W = 0, H = 0, S = 60;
const TOOL_W = 100;
const svg = $("#svg"), layer = $("#layer"), board = $("#board"), binsEl = $("#bins");

function startPage(i) {
  pageIdx = i;
  mode = PAGES[i].mode;
  direct = !!PAGES[i].direct;
  mistakes = 0;
  pageDone = false;
  selected = null;
  pageStart = Date.now();
  lastAct = Date.now();
  $("#pageLabel").textContent = PAGES[i].title;
  buildBins();
  measure();
  if (mode === "corr") {
    playing = true;
    corr = { round: 0 };
    startCorrRound();
    return;
  }

  const specs = genSpecs(mode, direct);
  const colors = shuffle([...COLORS]);
  pieces = [];
  let id = 0;
  for (const sp of specs) {
    const tri = makeTri(sp.angles, sp.size);
    const count = sp.role === "pair" ? 2 : 1;
    for (let c = 0; c < count; c++) {
      pieces.push({
        id: "p" + id++, v: tri.v.map((p) => [...p]), ang: tri.ang, sides: tri.sides, size: tri.size,
        cat: categorize(tri.ang), distractor: sp.role === "distractor", reason: sp.reason || "",
        state: "free", partner: null, nx: 0, ny: 0, r: 0, s: 1, marks: null,
      });
    }
  }
  // 方向：每個都轉一個角度、有的翻面；同一組的兩個不能一開始就對齊
  if (mode === "tutorial") {
    pieces[0].r = 0; pieces[1].r = 90;
  } else {
    for (const p of pieces) { p.r = 30 * rand(12); p.s = Math.random() < 0.5 ? 1 : -1; }
    for (let k = 0; k + 1 < pieces.length; k++) {
      const a = pieces[k], b = pieces[k + 1];
      if (!a.distractor && !b.distractor && congruent(a, b) && a.s === b.s && (a.r - b.r) % 360 === 0) b.r += 90;
    }
  }
  shuffle(pieces);
  pieces.forEach((p, k) => { p.color = colors[k % colors.length]; });

  // 擺放：格子加一點亂數
  const n = pieces.length;
  const availW = Math.max(100, W - TOOL_W);
  const cols = Math.max(1, Math.ceil(Math.sqrt(n * availW / Math.max(H, 1))));
  const rows = Math.ceil(n / cols);
  grid = { cols, rows };
  measure();
  const slots = shuffle([...Array(cols * rows).keys()]).slice(0, n);
  pieces.forEach((p, k) => {
    const col = slots[k] % cols, row = Math.floor(slots[k] / cols);
    p.nx = ((col + 0.5 + (Math.random() - 0.5) * 0.15) * availW / cols) / W;
    p.ny = ((row + 0.5 + (Math.random() - 0.5) * 0.15) * H / rows) / H;
    fitIn(p, 6);
  });

  renderAll();
  updateTools();
  if (mode === "tutorial") {
    say("接下來要<b>疊疊看</b>！把一個三角形<b>拖到</b>另一個上面。方向不一樣的話，拖著<b>橘色圓圈</b>轉一轉，三個角對齊就會疊合變透明！");
  } else if (mode === "side") {
    say("把每個三角形<b>拖到下面</b>正確的籃子。看<b>邊</b>：有幾條邊一樣長？");
  } else if (mode === "angle") {
    say("這一關看<b>角</b>：有沒有直角？有沒有比直角大的角？把三角形拖到正確的籃子。");
  } else {
    say("把<b>全等</b>的兩個三角形疊在一起，再看<b>角</b>和<b>邊</b>，放進正確的格子。");
  }
  playing = true;
}

// ================= 版面與畫圖 =================
function measure() {
  W = board.clientWidth; H = board.clientHeight;
  const availW = Math.max(100, W - TOOL_W);
  // 三角形盡量放大：最長邊約是格子的 70%（找對應那關只有兩個，可以更大）
  const f = mode === "corr" ? 0.62 : 0.7;

// 找對應：頂點字母、可以點的邊、答對和題目的記號

function renderAll() {

    g.setAttribute("class", "piece" + (p.state === "pair" ? " pair" : "") + (p.labels ? " corr" : "") + (selected === p ? " sel" : ""));

// 出題擺放後用：把整個三角形（含頂點字母）推回桌面內，右邊留給工具列

// ================= 分類籃 =================

}
function buildBins() {

  if (mode === "both") {
    binsEl.className = "both";
    binsEl.style.gridTemplateColumns = "auto repeat(3, 1fr)";
    let html = `<div></div>` + ["acute", "right", "obtuse"].map((a) => `<div class="grid-head">${NAME_ANGLE[a].replace("三角形", "")}</div>`).join("");
    for (const s of ["iso", "sca"]) {

}

// ================= 判斷 =================

function checkDrop(p, quiet) {
  if (direct || mode === "corr") return;   // 這兩種關卡不用疊合
  const t = nearestFree(p);
  if (!t) return;
  if (congruent(p, t)) {
    // 要對得很齊才算疊合
    if (isAligned(p, t)) return doMatch(p, t);
    if (isAligned(p, t, true)) say("方向對了！再把它<b>對準一點</b>，三個角要剛好疊在一起。");

    setTimeout(finishPage, 1800);

      r: 30 * rand(12), s: k === 1 && Math.random() < 0.5 ? -1 : 1,

  if (a.s === b.s && a.r === b.r) b.r += 90;
  for (const p of pieces) fitIn(p, 52);   // 頂點字母在三角形外面約 50px
  // 對應頂點：角一樣大的那個（不等邊三角形只有一個）
  corr.map = [0, 1, 2].map((i) => [0, 1, 2].find((j) => Math.abs(a.ang[i] - b.ang[j]) < 0.5));
  const [v1, v2] = shuffle([0, 1, 2]);
  corr.qs = shuffle([{ kind: "point", i: v1 }, { kind: "side", i: rand(3) }, { kind: "angle", i: v2 }]);
  corr.q = 0;
  corr.busy = false;
  selected = null;
  renderAll();
  updateTools();
  askCorr();
}

// 名稱：點 A、邊 AB、角 A（邊 k 是第 k 個頂點對面的邊）
function corrName(p, kind, i) {
  if (kind === "side") return "邊 " + [p.labels[(i + 1) % 3], p.labels[(i + 2) % 3]].sort().join("");
  return (kind === "point" ? "點 " : "角 ") + p.labels[i];
}

function askCorr() {
  const q = corr.qs[corr.q], a = pieces[0];
  a.ask = q;
  redraw(a);
  const where = q.kind === "side" ? "在另一個三角形上點一下那條<b>邊</b>。" : "在另一個三角形上點一下那個<b>頂點</b>。";
  const tip = corr.q === 0 ? "<br>可以把三角形<b>轉一轉、翻一翻、疊上去</b>比比看！" : "";
  say(`第 ${corr.round + 1} 組・第 ${corr.q + 1} 題：<b>${corrName(a, q.kind, q.i)}</b> 的<b>${CORR_WORD[q.kind]}</b>是哪一個？${where}${tip}`);
}

function answerCorr(p, tap) {
  if (pageDone || corr.busy) return;
  const q = corr.qs[corr.q], [a, b] = pieces;
  lastAct = Date.now();
  if (p === a) { say("要在<b>另一個三角形</b>（" + b.labels.join("、") + "）上找喔！"); return; }
  const wantSide = q.kind === "side";
  if ((tap.kind === "side") !== wantSide) {
    say(wantSide ? "這一題要找<b>邊</b>，點一下三角形的一條邊。" : "這一題要找<b>頂點</b>，點一下三角形旁邊的字母。");
    return;
  }
  const want = corr.map[q.i];   // 對應邊就是對應頂點對面的邊
  if (tap.i === want) {
    a.ask = null;
    a.ans.push({ kind: q.kind, i: q.i });
    b.ans.push({ kind: q.kind, i: want });
    b.hint = null;
    redraw(a); redraw(b);
    catBounce();
    corr.q++;
    corr.busy = true;
    const same = wantSide ? "對應邊一樣長。" : q.kind === "point" ? "疊合時這兩個點會疊在一起。" : "對應角一樣大。";
    const end = corr.q < 3 ? "" : corr.round + 1 < CORR_ROUNDS ? "<br>這一組都找到了！換下一組。" : "";
    say(`答對了！${corrName(a, q.kind, q.i)} 的${CORR_WORD[q.kind]}是 <b>${corrName(b, q.kind, want)}</b>，${same}${end}`, "good");
    setTimeout(() => {
      corr.busy = false;
      if (corr.q < 3) askCorr();
      else if (corr.round + 1 < CORR_ROUNDS) { corr.round++; startCorrRound(); }
      else finishPage();
    }, corr.q < 3 ? 1600 : 2200);
    return;
  }
  mistakes++;
  flash(b, "shake", 400);
  say(wantSide
    ? `<b>${corrName(a, "side", q.i)}</b> 和 <b>${corrName(b, "side", tap.i)}</b> 不一樣長喔！對應邊會一樣長。疊上去比比看。`
    : q.kind === "point"
      ? `<b>${corrName(a, "point", q.i)}</b> 和 <b>${corrName(b, "point", tap.i)}</b> 的角不一樣大，疊合時不會疊在一起喔！疊上去比比看。`
      : `<b>${corrName(a, "angle", q.i)}</b> 和 <b>${corrName(b, "angle", tap.i)}</b> 不一樣大喔！對應角會一樣大。疊上去比比看。`, "bad");
}

// ================= 操作：拖曳、旋轉把手、雙指旋轉 =================
const pointers = new Map();
let drag = null, rot = null, gesture = null;
const handleEl = $("#handle");

function localPt(e) {
  const r = board.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function twoAngle() {
  const [a, b] = [...pointers.values()];
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}
function ptrAngle(p, pt) { return Math.atan2(pt.y - p.ny * H, pt.x - p.nx * W) * 180 / Math.PI; }

// 選取的三角形旁邊有一個橘色圓圈，拖著它繞圈就能轉
function drawHandle() {
  const p = selected;
  if (!playing || !p || (p.state !== "free" && p.state !== "pair")) { handleEl.innerHTML = ""; return; }
  const cx = p.nx * W, cy = p.ny * H;
  const off = Math.max(...p.v.map(([x, y]) => Math.hypot(x, y))) * S + 34;
  let a;
  if (rot && rot.p === p) a = rot.ang;
  else a = cy - off > 30 ? -90 : 90;   // 平常在上面，太靠上就放下面
  const rad = a * Math.PI / 180, hx = cx + off * Math.cos(rad), hy = cy + off * Math.sin(rad);
  handleEl.innerHTML =
    `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#ff8f00" stroke-width="3" stroke-dasharray="6 5"/>` +
    `<g data-handle="1" transform="translate(${hx.toFixed(1)},${hy.toFixed(1)})">` +
    `<circle r="40" fill="#000" fill-opacity="0"/>` +
    `<circle r="27" fill="#ff8f00" stroke="#fff" stroke-width="4"/>` +
    `<text text-anchor="middle" dominant-baseline="central" fill="#fff">↻</text></g>`;
}
function select(p) {
  selected = p;
  for (const q of pieces) if (q.el) q.el.classList.toggle("sel", q === p);
  updateTools();
  drawHandle();
}
function updateTools() {
  const ok = !!selected && (selected.state === "free" || selected.state === "pair");
  for (const id of ["rotL", "rotR", "flip"]) $("#" + id).disabled = !ok;
}

svg.addEventListener("pointerdown", (e) => {
  if (!playing) return;
  const pt = localPt(e);
  // 第二根手指：兩指旋轉選取的三角形（拖圓圈時不算）
  if (pointers.size === 1 && !rot && !gesture && selected && (selected.state === "free" || selected.state === "pair")) {
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, pt);
    if (drag) drag.p.el && drag.p.el.classList.add("dragging");
    gesture = { p: selected, last: twoAngle() };
    drag = null;
    lastAct = Date.now();
    return;
  }
  if (pointers.size) return;   // 再多的手指就不理
  pointers.set(e.pointerId, pt);
  lastAct = Date.now();
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  if (selected && e.target.closest && e.target.closest("[data-handle]")) {
    const a = ptrAngle(selected, pt);
    rot = { p: selected, pid: e.pointerId, r0: selected.r, last: a, total: 0, ang: a };
    return;
  }
  const g = e.target.closest && e.target.closest("[data-id]");
  const p = g && byId(g.dataset.id);
  if (p) {
    select(p);
    layer.appendChild(p.el);
    p.el.classList.add("dragging");
    // 找對應：記下點到的是哪個頂點或哪條邊（沒有拖動才算點一下）
    const hit = e.target.closest && e.target.closest("[data-vtx],[data-side]");
    const tap = hit && (hit.dataset.vtx != null ? { kind: "vtx", i: +hit.dataset.vtx } : { kind: "side", i: +hit.dataset.side });
    drag = { p, pid: e.pointerId, dx: p.nx * W - pt.x, dy: p.ny * H - pt.y, x0: pt.x, y0: pt.y, moved: false, tap };
    if (mode === "tutorial" && p.state === "free") say("拖到另一個上面疊疊看。要轉方向，可以拖著<b>橘色圓圈</b>繞圈圈、用<b>兩根手指</b>轉，或按右邊的 <b>↻</b>。");
  } else {
    select(null);
  }
});

svg.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const pt = localPt(e);
  pointers.set(e.pointerId, pt);
  if (gesture) {
    if (pointers.size >= 2) {
      const a = twoAngle();
      let d = a - gesture.last;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      gesture.last = a;
      gesture.p.r += d;
      updT(gesture.p);
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const a = ptrAngle(rot.p, pt);
    let d = a - rot.last;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rot.last = a; rot.total += d; rot.ang = a;
    // 每 15° 一格，比較容易轉到剛好的方向
    rot.p.r = Math.round((rot.r0 + rot.total) / 15) * 15;
    updT(rot.p);
    drawHandle();
    return;
  }
  if (drag && e.pointerId === drag.pid) {
    const p = drag.p;
    p.nx = (pt.x + drag.dx) / W;
    p.ny = (pt.y + drag.dy) / H;
    if (Math.hypot(pt.x - drag.x0, pt.y - drag.y0) > 8) drag.moved = true;
    if (p.state === "free") clampIn(p);
    updT(p);
    const over = binAt(e.clientX, e.clientY);
    for (const b of binsEl.querySelectorAll(".bin")) b.classList.toggle("over", b === over);
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture) {
    if (pointers.size < 2) {
      // 放開後吸附到 15° 的倍數
      const p = gesture.p;
      gesture = null;
      p.el && p.el.classList.remove("dragging");
      lastAct = Date.now();
      tween(p, { r: Math.round(p.r / 15) * 15 }, 120, () => { if (p.state === "free") checkDrop(p, true); });
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const p = rot.p;
    rot = null;
    drawHandle();
    lastAct = Date.now();
    if (p.state === "free") checkDrop(p, true);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const p = drag.p, dragMoved = drag.moved, tap = drag.tap;
  drag = null;
  p.el && p.el.classList.remove("dragging");
  for (const b of binsEl.querySelectorAll(".bin")) b.classList.remove("over");
  if (mode === "corr") {
    if (!dragMoved && tap) answerCorr(p, tap);
    return;
  }
  const bin = binAt(e.clientX, e.clientY);
  // 第 1、2 關直接分類；其他關要先疊好一組
  if (p.state === "pair" || (direct && p.state === "free")) {
    if (bin && classify(p, bin)) return;
    const tmp = { ...p }; clampIn(tmp);
    tween(p, { nx: tmp.nx, ny: tmp.ny }, 220);
    return;
  }
  if (!dragMoved) return;
  if (bin) say("先找到<b>全等</b>的朋友疊在一起，才能放進籃子喔！");
  checkDrop(p, false);
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

function turn(deg) {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { r: Math.round(p.r / 15) * 15 + deg }, 180, () => { if (p.state === "free") checkDrop(p, true); });
}
$("#rotL").addEventListener("click", () => turn(-30));
$("#rotR").addEventListener("click", () => turn(30));
$("#flip").addEventListener("click", () => {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { s: -Math.sign(p.s || 1) }, 260, () => { if (p.state === "free") checkDrop(p, true); });
});

// ================= 提示 =================
function giveHint() {
  if (!playing || pageDone) return;
  lastAct = Date.now();
  if (mode === "corr") {
    if (corr.busy) return;
    const q = corr.qs[corr.q], b = pieces[1];
    b.hint = { kind: q.kind, i: corr.map[q.i] };
    redraw(b);
    setTimeout(() => { b.hint = null; redraw(b); }, 4300);
    say("看看<b>閃黃光</b>的地方！也可以把兩個三角形<b>疊在一起</b>比比看。");
    catBounce();
    return;
  }
  if (direct) {
    const p = selected && selected.state === "free" ? selected : pieces.find((q) => q.state === "free");
    if (!p) return;
    layer.appendChild(p.el);
    flash(p, "pulse", 4300);
    showMarks(p, mode);
    say("看看閃黃光的三角形：" + markLegend(mode) + "它要放哪一籃？");
    catBounce();
    return;
  }
  const free = pieces.filter((p) => p.state === "free" && !p.distractor);
  // 有選取的三角形就優先找它的全等朋友
  if (selected && free.includes(selected)) free.unshift(...free.splice(free.indexOf(selected), 1));
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) {
    if (congruent(free[i], free[j])) {
      // 拿到最上層，才不會被別的三角形蓋住
      layer.appendChild(free[j].el); layer.appendChild(free[i].el);
      flash(free[i], "pulse", 4300); flash(free[j], "pulse", 4300);
      say("看看這兩個<b>閃黃光</b>的，是不是一樣大？拖過去<b>疊疊看</b>！");
      catBounce();
      return;
    }
  }
  const pair = pieces.find((p) => p.state === "pair");
  if (pair) {
    layer.appendChild(pair.el);
    flash(pair, "pulse", 4300);
    showMarks(pair, mode === "tutorial" ? "both" : mode);
    say("閃黃光的這一組，看看記號：" + markLegend(mode === "tutorial" ? "both" : mode));
    catBounce();
  }
}
$("#hintBtn").addEventListener("click", giveHint);
setInterval(() => { if (playing && !pageDone && Date.now() - lastAct > 30000) giveHint(); }, 1000);

// ================= 對話 =================
function say(html, tone) {
  const el = $("#say");
  el.innerHTML = `<span>${html}</span>`;
  el.className = tone || "";
}
function catBounce() { const c = $("#cat"); c.classList.remove("bounce"); void c.offsetWidth; c.classList.add("bounce"); }

// ================= 關卡結束與畫面 =================
function starsFor(m) { return m <= 1 ? 3 : m <= 4 ? 2 : 1; }
function starHtml(n) { return [0, 1, 2].map((i) => `<span class="${i < n ? "" : "off"}">⭐</span>`).join(""); }
function fmtTime(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)} 分 ${s % 60} 秒`; }

function finishPage() {
  if (pageDone) return;
  pageDone = true;
  const time = Date.now() - pageStart;
  const stars = starsFor(mistakes);
  if (mode !== "tutorial") results.push({ title: PAGES[pageIdx].title, stars, mistakes, time });
  catBounce();
  const d = pieces.find((p) => p.distractor && p.state === "free");
  let extra = "";
  if (d) {
    showMarks(d, mode, 6000);
    flash(d, "pulse", 2900);
    say("全部分類完成！剩下閃閃的這一個呢？" + d.reason, "good");
    extra = `<p>剩下的那個三角形：${d.reason}</p>`;
  }
  const last = pageIdx === PAGES.length - 1;
  setTimeout(() => {
    if (mode === "tutorial") {
      showPanel(`<div class="big-cat">😺</div><h2>練習完成！</h2>
        <p>兩個三角形經過<b>滑動、旋轉、翻面</b>以後，可以<b>完全疊合</b>，它們就是<b>全等</b>。</p>
        <p>接下來，疊好的全等三角形還要<b>分類</b>喔！</p>
        <button class="btn" id="nextBtn">開始${PAGES[pageIdx + 1].title.split("：")[0]}</button>`);
    } else {
      showPanel(`<div class="big-cat">😸</div><h2>${PAGES[pageIdx].title.split("：")[0]} 完成！</h2>
        <div class="stars">${starHtml(stars)}</div>
        <p>錯誤 ${mistakes} 次・用了 ${fmtTime(time)}</p>${extra}
        <button class="btn" id="nextBtn">${last ? "看成績" : "下一關"}</button>`);
    }
    $("#nextBtn").addEventListener("click", () => {
      hidePanel();
      if (last) return showFinal();
      let n = pageIdx + 1;
      if (replay && PAGES[n].mode === "tutorial") n++;   // 再玩一次就跳過練習
      startPage(n);
    });
  }, d ? 3200 : 1400);
}

function showPanel(html) { playing = false; drawHandle(); $("#panel").innerHTML = html; $("#overlay").classList.add("show"); }
function hidePanel() { $("#overlay").classList.remove("show"); }

function showFinal() {
  const total = Date.now() - gameStart;
  const allStars = results.reduce((s, r) => s + r.stars, 0);
  const rows = results.map((r) => `<tr><td>${r.title.split("：")[0]}</td><td>${starHtml(r.stars)}</td><td>錯 ${r.mistakes} 次</td></tr>`).join("");
  const max = results.length * 3;
  const msg = allStars >= max - 1 ? "太厲害了！你是三角形大師！" : allStars >= max * 0.66 ? "很棒！分類、全等和對應都學會了！" : "完成了！再玩一次會更熟練喔！";
  showPanel(`<div class="big-cat">🏆</div><h1>全部完成！</h1>
    ${seatNo ? `<p><b>座號 ${escapeHtml(seatNo)}</b></p>` : ""}
    <table class="result">${rows}</table>
    <p>總共 ${allStars} 顆星・${fmtTime(total)}</p>
    <p>${msg}</p>
    <button class="btn" id="againBtn">再玩一次</button>
    <button class="btn ghost" id="homeBtn">回首頁</button>
    <p class="note">每次的題目都不一樣，可以多挑戰幾次！</p>`);
  $("#againBtn").addEventListener("click", () => { hidePanel(); results = []; gameStart = Date.now(); replay = true; startPage(0); });
  $("#homeBtn").addEventListener("click", showHome);
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function showHome() {
  layer.innerHTML = ""; binsEl.innerHTML = ""; pieces = [];
  $("#pageLabel").textContent = "";
  say("一起來疊疊看！");
  showPanel(`<div class="big-cat">🐱📐</div>
    <h1>疊疊看！三角形分類</h1>
    <div class="howto">
      🧺 第 1、2 關：把三角形拖進正確的<b>分類籃</b><br>
      ✨ 第 3 關：<b>全等</b>的疊上去會變透明，再分類<br>
      🔤 第 4 關：找<b>對應點、對應邊、對應角</b><br>
      ↻ <b>旋轉</b>：拖<b>橘色圓圈</b>、兩指轉或按按鈕<br>
      ⇋ <b>翻面</b>：把三角形翻過來
    </div>
    <div class="seat">座號（可不填）：<input id="seatInput" inputmode="numeric" maxlength="4" value="${escapeHtml(seatNo)}"></div>
    <button class="btn" id="startBtn">開始</button>
    <p class="note">約 10～12 分鐘・4 關</p>`);
  $("#startBtn").addEventListener("click", () => {
    seatNo = $("#seatInput").value.trim();
    replay = false;
    hidePanel();
    results = [];
    gameStart = Date.now();
    startPage(0);
  });
}

// ================= 其他 =================
new ResizeObserver(() => onResize()).observe(board);
function onResize() {
  if (!pieces.length || (W === board.clientWidth && H === board.clientHeight)) return;
  measure();
  for (const p of pieces) if (p.state === "free" || p.state === "pair") clampIn(p);
  renderAll();
}
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

showHome();
</script>
</body>
</html>
