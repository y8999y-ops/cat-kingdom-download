// 讓答案閃一下
function flashHint() {
  if (!playing || pageDone) return;
  lastAct = Date.now();
  if (mode === "corr" && corr.step === "stack") {
    const b = pieces[1];
    layer.appendChild(b.el);
    flash(b, "pulse", 4300);
    say("把一閃一閃的三角形<b>轉一轉、翻一翻</b>，<br>再拖到題目上。");
    catBounce();
    return;
  }
  if (mode === "corr" && corr.step === "guide") {
    say("跟著做：在<b>一閃一閃</b>的地方點。");
    return;
  }
  if (mode === "corr" && corr.step === "mark") {
    // 只閃還沒畫對的那一組（老師說閃已經畫對的地方會干擾）
    const [a, b] = pieces, st = markStatus();
    const x = st.find((s) => s.st === "bad") || st.find((s) => s.st === "miss") || st[0];
    const kind = x.k === "s" ? "side" : "angle";
    a.hint = { kind, i: x.i }; b.hint = { kind, i: corr.map[x.i] };
    redraw(a); redraw(b);
    setTimeout(() => { a.hint = null; b.hint = null; redraw(a); redraw(b); }, 4300);
    say(`一閃一閃的是一組<b>對應${GUIDE_WORD[x.k]}</b>，<br>畫一樣多條。`);
    catBounce();
    return;
  }
  if (mode === "corr") {
    if (corr.busy || corr.step !== "ask") return;
    const q = corr.qs[corr.q], b = pieces[1];
    b.hint = { kind: q.kind, i: corr.map[q.i] };
    redraw(b);
    setTimeout(() => { b.hint = null; redraw(b); }, 4300);
    say("答案在<b>一閃一閃</b>的地方。");
    catBounce();
    return;
  }
  if (direct) {
    const p = selected && selected.state === "free" ? selected : pieces.find((q) => q.state === "free");
    if (!p) return;
    layer.appendChild(p.el);
    flash(p, "pulse", 4300);
    say(classifyHint(p, "一閃一閃的三角形"));
    catBounce();
    return;
  }
  const free = pieces.filter((p) => p.state === "free" && !p.distractor);
  // 有選取的三角形就優先找它的全等朋友
  if (selected && free.includes(selected)) free.unshift(...free.splice(free.indexOf(selected), 1));
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) {
    if (congruent(free[i], free[j])) {
      // 拿到最上層，才不會被別的三角形蓋住
      layer.appendChild(free[j].el); layer.appendChild(free[i].el);
      flash(free[i], "pulse", 4300); flash(free[j], "pulse", 4300);
      say(mode === "tutorial" ? TUT_TEXT[tutStep] : "一閃一閃的兩個三角形<b>全等</b>。<br>把一個拖到另一個上面，疊疊看。");
      catBounce();
      return;
    }
  }
  const pair = pieces.find((p) => p.state === "pair");
  if (pair) {
    layer.appendChild(pair.el);
    flash(pair, "pulse", 4300);
    say(classifyHint(pair, "一閃一閃這一組"));
    catBounce();
  }
}

    const brk = justLost && i === Math.floor(left / 2) ? " break" : "";
    if (h === 1) return `<span class="hh${brk}">${ico("heart", "heart lost")}${ico("heart", "heart halfon")}</span>`;
    return ico("heart", cls + brk);
  }).join("");
}
function loseHeart() {
  mistakes++;
  if (learn) return;   // 學習模式：只記次數，不扣愛心
  const tok = pageToken;
  if (challenge) {
    // 限時挑戰關：答錯一次就結束（老師要求），馬上跳出結束畫面（老師覺得原本停 1.2 秒太慢）
    playing = false;
    drawHandle();
    setTimeout(() => { if (tok === pageToken) endChallenge("wrong"); }, 250);
    return;
  }
  renderHearts(true);
  if (mistakes < LIVES * 2) return;
  // 愛心用完：先停一下（0.7 秒），讓學生看到答錯的說明，再去複習
  playing = false;
  drawHandle();

}

// ================= 愛心用完：複習一下再重來 =================
const REVIEW = {
  side: [["正三角形", "三條邊都一樣長", [60, 60, 60]], ["等腰三角形", "有兩條邊一樣長", [80, 50, 50]], ["不等邊三角形", "三條邊都不一樣長", [50, 60, 70]]],
  angle: [["銳角三角形", "三個角都是銳角", [50, 60, 70]], ["直角三角形", "有一個角是直角", [90, 30, 60]], ["鈍角三角形", "有一個角是鈍角", [120, 35, 25]]],
};
// 畫一個小三角形（含記號），借用 marksSvg，所以暫時把 S 換成小圖的大小
function miniTri(angles, kind, color) {
  const keep = S;
  S = 70;
  const t = makeTri(angles, 1);
  const p = { v: t.v, ang: t.ang, sides: t.sides, size: 1, cat: categorize(t.ang) };
  const body = `<polygon points="${pointsAttr(p)}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` + marksSvg(p, kind);
  const xs = t.v.map((q) => q[0] * S), ys = t.v.map((q) => q[1] * S);
  S = keep;
  const pad = 12, x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return `<svg class="mini-tri" viewBox="${x0} ${y0} ${Math.max(...xs) - x0 + pad} ${Math.max(...ys) - y0 + pad}">${body}</svg>`;
}
// 對應的示意圖：A↔D 粉紅圈、AB↔DE 藍線、角 C↔角 F 綠色扇形
function corrReviewSvg() {
  const keep = S;
  S = 70;
  const t = makeTri([50, 60, 70], 1);
  const v = t.v.map(([x, y]) => [x * S, y * S]);
  S = keep;
  const draw = (labels, rot, color) => {
    let g = `<polygon points="${v.map((q) => q.join(",")).join(" ")}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` +
      `<line x1="${v[0][0]}" y1="${v[0][1]}" x2="${v[1][0]}" y2="${v[1][1]}" stroke="${CORR_COL.side}" stroke-width="7" stroke-linecap="round"/>` +
      `<path d="${arcD(v, 2, 18)}" fill="${CORR_COL.angle}" fill-opacity=".5" stroke="${CORR_COL.angle}" stroke-width="3"/>`;
    for (let i = 0; i < 3; i++) {
      const o = norm(v[i]), x = v[i][0] + o[0] * 18, y = v[i][1] + o[1] * 18;
      g += `<g transform="translate(${x},${y}) rotate(${-rot})"><circle r="12" fill="#fff" stroke="${i === 0 ? CORR_COL.point : "#5d4037"}" stroke-width="${i === 0 ? 4 : 2}"/>` +
        `<text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#4e342e">${labels[i]}</text></g>`;
    }
    return `<g transform="rotate(${rot})">${g}</g>`;
  };
  return `<svg class="mini-corr" viewBox="-85 -80 330 160">${draw(["A", "B", "C"], 0, "#ffcc80")}<g transform="translate(160,0)">${draw(["D", "E", "F"], 150, "#b3e5fc")}</g></svg>`;
}
// 複習小卡的內容（愛心用完的複習畫面和提示都用這一份）
function reviewBody() {
  const card = ([name, why, ang], kind, i) =>
    `<div class="rv">${miniTri(ang, kind, COLORS[i])}<b>${name}</b><span>${why}</span></div>`;
  let html = "";
  if (mode === "side" || mode === "both") html += `<div class="review">${REVIEW.side.map((c, i) => card(c, "side", i)).join("")}</div>`;
  if (mode === "angle" || mode === "both") html += `<div class="review">${REVIEW.angle.map((c, i) => card(c, "angle", i + 3)).join("")}</div>`;
  if (mode === "both" && !direct) html += `<p><b>全等三角形</b>：形狀、大小都一樣，可以完全疊合。<br>可以移動、旋轉、翻面來疊疊看。</p>`;
  if (mode === "corr") {
    html += `<div class="review one">${corrReviewSvg()}</div>
      <p>兩個三角形<b>全等</b>時，疊合在一起的點、邊、角，<br>叫做<b>對應點、對應邊、對應角</b>。<br>對應邊一樣長，對應角一樣大。</p>`;
  }
  return html;
}

// ================= 挑戰關：限時 60 秒，綜合題型 =================
// 題目一題接一題，輪流出現：以邊分類、以角分類、以邊和角分類、找全等、找對應。答對一題 1 分。
// 答錯一次就結束（老師要求）；分數就是答對幾題。
const CHAL_SEC = 60;
const CHAL_TYPES = ["side", "angle", "both", "pick", "corr"];

function makePiece(tri, id, color) {
  return {
    id, v: tri.v.map((q) => [...q]), ang: tri.ang, sides: tri.sides, size: tri.size, cat: categorize(tri.ang),
    distractor: false, reason: "", state: "free", partner: null, nx: 0.5, ny: 0.5,
    r: 30 * rand(12), s: Math.random() < 0.5 ? 1 : -1, marks: null, color,
  };
}

function startChallenge() {
  pageToken++;
  challenge = true;
  pageIdx = -1;
  mistakes = 0;
  pageDone = false;
  selected = null;
  lastAct = Date.now();
  $("#pageLabel").textContent = "挑戰關";
  chal = { end: Date.now() + CHAL_SEC * 1000, score: 0, last: null, over: false, busy: false, n: 0 };
  renderHearts();
  playing = true;
  nextChalTask();
  const tok = pageToken;
  const timer = setInterval(() => {
    if (tok !== pageToken || chal.over) return clearInterval(timer);
    renderChalBar();
    if (Date.now() >= chal.end) endChallenge("time");
  }, 200);
}

function renderChalBar() {
  const ms = Math.max(0, chal.end - Date.now()), left = Math.ceil(ms / 1000);
  $("#progress").innerHTML =
    `<span class="chal-time${left <= 10 ? " hurry" : ""}">${ico("clock")} ${left} 秒</span>` +
    `<span class="chal-bar"><i style="width:${(100 * ms / (CHAL_SEC * 1000)).toFixed(1)}%"></i></span>` +
    `<span class="chal-score">答對 ${chal.score} 題</span>`;
}

function nextChalTask() {
  if (chal.over) return;
  const type = pick(CHAL_TYPES.filter((t) => t !== chal.last));   // 不連續出同一種
  chal.last = type;
  chal.busy = false;
  selected = null;
  mode = type;
  direct = type === "side" || type === "angle" || type === "both";
  if (!toolAvail("ruler")) setTool("ruler", false);   // 直角尺只在和角有關的題目
  updateToolButtons();
  buildBins();
  measure();
  if (type === "corr") {
    corr = { round: rand(3) };
    startCorrRound();
  } else if (type === "pick") {
    startPickTask();
  } else {
    // 分類題：一次一個三角形，拖到正確的格子
    const keys = type === "both" ? ALL_KEYS.filter((k) => k !== "equi-acute") : ALL_KEYS;
    grid = { cols: 1, rows: 1 };
    measure();
    const p = makePiece(makeTri(pick(LIB[pick(keys)]), 0.95 + Math.random() * 0.2), "q" + chal.n++, pick(COLORS));
    p.nx = Math.max(100, W - TOOL_W) / 2 / W;
    fitIn(p, 10, 50);
    pieces = [p];
    renderAll();
    updateTools();
    say(`<b>${type === "side" ? "以邊分類" : type === "angle" ? "以角分類" : "以邊和角分類"}</b><br>把三角形拖到下面正確的格子裡。`);
  }
  renderChalBar();
}

// 把三角形等比例放大或縮小（形狀一樣，大小不同）
function scaleTri(t, k) {
  return { v: t.v.map(([x, y]) => [x * k, y * k]), ang: t.ang, sides: t.sides.map((s) => s * k), size: t.size * k };
}

// 找全等：一個虛線框的三角形，另外三個裡只有一個和它全等（另外兩個：大小不同、形狀不同）
// 不是點一下就判斷：要把候選的三角形拖過去疊在虛線框上（可以轉、翻），疊合了才算對（pickDrop()）
function startPickTask() {
  const ang = pick(LIB[pick(ALL_KEYS.filter((k) => k !== "equi-acute"))]);
  const others = ALL_KEYS.flatMap((k) => LIB[k]).filter((a) => angleGap(a, ang) >= 20);   // 形狀要明顯不同
  const size = 0.85 + Math.random() * 0.15, bigger = Math.random() < 0.5;
  const colors = shuffle([...COLORS]);
  // 全等和大小不同的都用同一份形狀，只差旋轉和翻面，才轉得到一樣的方向
  const base = makeTri(ang, size);
  const target = makePiece(base, "k0", colors[0]);
  target.target = true;
  const cands = shuffle([
    Object.assign(makePiece(base, "k1", colors[1]), { answer: true }),
    Object.assign(makePiece(scaleTri(base, bigger ? 1.2 : 0.8), "k2", colors[2]), { why: bigger ? "比較大" : "比較小" }),
    Object.assign(makePiece(makeTri(pick(others), size), "k3", colors[3]), { why: "形狀不一樣" }),
  ]);
  const ans = cands.find((p) => p.answer);
  if (ans.s === target.s && ans.r === target.r) ans.r += 90;   // 一開始不能已經對齊
  pieces = [target, ...cands];
  const availW = Math.max(100, W - TOOL_W);
  const g4 = bestGrid(4), cols = g4.c, rows = g4.r;
  grid = { cols, rows };
  measure();
  pieces.forEach((p, k) => {
    p.nx = ((k % cols) + 0.5) * availW / cols / W;
    p.ny = (Math.floor(k / cols) + 0.5) / rows;
    fitIn(p, 10, 50);
  });
  renderAll();
  updateTools();
  say("哪一個和<b>虛線框</b>的三角形是<b>全等三角形</b>？<br>把它拖過去疊疊看。");
}

// 找全等：放下或轉完時檢查有沒有疊在虛線框上
function pickDrop(p, quiet) {
  if (!playing || chal.over || chal.busy) return;
  const target = pieces.find((q) => q.target);
  // 拖的是虛線框那個時，改看最近的候選
  const a = p.target
    ? pieces.filter((q) => !q.target).sort((x, y) => Math.hypot(x.nx - p.nx, x.ny - p.ny) - Math.hypot(y.nx - p.nx, y.ny - p.ny))[0]
    : p;
  const near = Math.hypot((a.nx - target.nx) * W, (a.ny - target.ny) * H) < 0.6 * Math.max(lenPx(a), lenPx(target));
  if (!near) return;   // 還沒疊上去，不判斷
  lastAct = Date.now();
  if (congruent(a, target)) {
    if (isAligned(a, target)) { flash(a, "pop", 700); chalRight("完全疊合了！這兩個三角形是全等三角形。"); return; }
    if (isAligned(a, target, true)) say("方向對了！再移動一點，讓三個角剛好疊在一起。");
    else if (!quiet) say("這兩個大小、形狀都一樣。<br>再<b>轉一轉</b>或<b>翻面</b>，讓它們對齊。");
    return;
  }
  if (quiet) return;
  // 疊上去比比看不扣愛心（老師要求）：只說明，再把它推開
  flash(a, "shake", 400);
  say(`這一個${a.why}，疊不起來，不是全等三角形。<br>再比比看別的。`);
  pushAway(a, target);
}

function chalRight(msg) {
  chal.score++;
  chal.busy = true;
  renderChalBar();
  say(msg, "good");
  catBounce();
  const tok = pageToken;

}

new ResizeObserver(() => onResize()).observe(board);
function onResize() {
  fitTools();
  if (!pieces.length || (W === board.clientWidth && H === board.clientHeight)) return;
  W = board.clientWidth; H = board.clientHeight;
  // 平板轉方向：如果「出題時的三角形個數」最適合的排法（幾欄幾列）不一樣了，就重新排列，
  // 三角形才不會為了維持原本的排法而變小。
  // 用出題時的個數（grid.n），不是現在剩下的個數：分類掉幾個以後有空位，三角形也不會突然變大（老師要求）。
  const act = pieces.filter((p) => p.state === "free" || p.state === "pair");
  const best = bestGrid(grid.n || grid.cols * grid.rows);
  if (act.length && (best.c !== grid.cols || best.r !== grid.rows)) relayout(act, best);
  else for (const p of act) clampIn(p);   // 其他大小變化（例如格子變高）：三角形大小不變，只拉回桌面內
  if (mode === "corr" && pieces[1]) pieces[1].home = { nx: pieces[1].nx, ny: pieces[1].ny };
  renderAll();
  // 直角尺跟著對準的頂點走；沒對準就拉回桌面內
  keepRulerIn();
  drawRuler();
}
// n 個三角形，選格子最大的排法
function bestGrid(n) {
  const availW = Math.max(100, W - TOOL_W);
  let best = { c: 1, r: 1, cell: 0 };
  for (let c = 1; c <= Math.max(1, n); c++) {
    const r = Math.ceil(n / c), cell = Math.min(availW / c, layH() / r);
    if (cell > best.cell) best = { c, r, cell };
  }
  return best;
}
// 把還在桌面上的三角形照新的排法重新擺好（保留方向和翻面）
function relayout(act, best) {
  const availW = Math.max(100, W - TOOL_W);
  grid = { cols: best.c, rows: best.r, n: grid.n };
  measure();
  const side = mode === "corr" ? 52 : 10;
  const top = mode === "corr" ? 96 : challenge ? 50 : mode === "both" && !direct ? 40 : 10;
  act.forEach((p, k) => {
    p.nx = ((k % best.c) + 0.5) * availW / best.c / W;
    p.ny = (Math.floor(k / best.c) + 0.5) / best.r * layH() / H;
    fitIn(p, side, top);
  });
}
