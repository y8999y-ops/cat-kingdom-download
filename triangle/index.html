<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4e0">
<title>疊疊看・三角形分類</title>
<link rel="icon" href="../icon.png">
<style>
  :root {
    --bg: #fff4e0;
    --ink: #4e342e;
    --soft: #8d6e63;
    --card: #ffffff;
    --accent: #ff8f00;
    --good: #2e7d32;
    --bad: #c62828;
    --line: #e0c9a6;
    --accent-dk: #c56000;
  }
  /* 三種配色，一眼就看得出來（老師要求）：主畫面暖橘色、學習模式青綠色、挑戰模式粉紅色 */
  body.learn {
    --bg: #e8f5ef; --soft: #4f7a6a; --accent: #00897b; --accent-dk: #00695c; --line: #b4d9c7;
  }
  body.learn .lvl:active, body.learn .mode-btn:active { background: #e0f2f1; }
  body.play {
    --bg: #fdeef4; --soft: #8e5a70; --accent: #e91e63; --accent-dk: #ad1457; --line: #f3bcd0;
  }
  body.play .lvl:active, body.play .mode-btn:active { background: #fce4ec; }
  body.play .lvl.chal { background: #fce4ec; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; touch-action: manipulation; cursor: pointer; }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 18px);   /* 畫面四周留白，看起來不會太靠邊 */
  }

  /* ---------- 上方：小龍和對話 ---------- */
  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  #cat { font-size: 100px; line-height: 1; flex: none; transition: transform .2s; }
  #say {
    flex: 1 1 auto; max-width: 700px; margin-right: auto; background: var(--card); border: 3px solid var(--line); border-radius: 18px;   /* 老師說太長，寬度縮小 */
    padding: 3px 14px; font-size: clamp(20px, 2.7vw, 26px); line-height: 1.28; height: 132px;   /* 老師要對話框小一點，空間留給按鈕 */
    display: flex; align-items: center; position: relative; overflow: hidden;
  }
  @media (max-width: 600px) {
    #say { font-size: 16px; height: 178px; padding: 4px 10px; line-height: 1.28; }
    #cat { font-size: 44px; }
  }
  #say::before {
    content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px;
    border: 9px solid transparent; border-right-color: var(--line); border-left: 0;
  }
  #say.good { border-color: #81c784; background: #f1f8e9; }
  #say.bad { border-color: #ef9a9a; background: #fff3f3; }
  #say.think { border-color: #ffcc80; background: #fffaf0; }   /* 再想一想：溫和的黃色，不用紅色（老師要求不否定學生） */
  /* 「下一步」「下一題」「完成」「檢查」都放在對話框右下角（老師要求：像常見的遊戲，類似的按鈕統一位置） */
  #sayText { flex: 1; min-width: 0; text-wrap: pretty; }   /* 避免最後一行只剩一兩個字（老師說分行有點奇怪） */
  .panel .best-line { font-size: 26px; margin: 6px 0; }
  #sayAct { flex: none; align-self: flex-end; margin: 0 -6px 6px 10px; display: flex; flex-direction: column; gap: 6px; }
  .btn.act { margin: 0; padding: 10px 22px; font-size: 24px; white-space: nowrap; }
  .btn.act[hidden] { display: none; }
  .btn.act::after { content: ""; display: inline-block; margin-left: 8px; border: 8px solid transparent; border-left: 11px solid currentColor; border-right: 0; vertical-align: -1px; }
  #checkBtn.act::after { display: none; }
  /* 跳過教學：在對話框右下角，「下一步」的上面（老師說放在桌面角落很奇怪、不明顯） */
  .btn.act.skip { font-size: 19px; padding: 6px 16px; }
  .btn.act.skip::after { display: none; }
  @media (max-width: 600px) { .btn.act { padding: 6px 12px; font-size: 17px; } #sayAct { margin: 0 -4px 4px 6px; } }
  .topbtns { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  #pageLabel { font-size: 19px; font-weight: bold; color: var(--soft); max-width: 150px; text-align: right; line-height: 1.2; }   /* 可以換行，對話框才夠長 */
  @media (max-width: 600px) {
    #top { padding: 6px 8px; gap: 8px; }
    #pageLabel { font-size: 12px; font-weight: normal; white-space: normal; max-width: 72px; text-align: right; }
    /* 手機：四顆按鈕排成 2×2，說明框才不會被擠得太窄 */
    .topbtns > div:last-child { display: grid; grid-template-columns: repeat(2, auto); }
  }
  .topbtns div { display: flex; gap: 6px; }
  .icon-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--line); background: var(--card);   /* 圓形按鈕維持最一開始的大小（老師喜歡） */
    font-size: 28px; display: grid; place-items: center; padding: 0;
  }
  .icon-btn:active { transform: translateY(2px); background: #fff8e1; }
  /* 平板直放：右上角四顆按鈕排成 2×2，對話框才夠寬（圖示放大以後，一排太佔位置） */
  @media (min-width: 601px) and (max-width: 900px) {
    .topbtns > div:last-child { display: grid; grid-template-columns: repeat(2, auto); }
    .icon-btn { width: 56px; height: 56px; font-size: 29px; }
    #pageLabel { font-size: 16px; white-space: normal; max-width: 118px; text-align: right; line-height: 1.2; }
    #cat { font-size: 80px; }
  }

  /* ---------- 中間：三角形桌面 ---------- */
  #board { flex: 1; position: relative; z-index: 2; min-height: 0; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  .piece polygon.body { stroke: #5d4037; stroke-width: 3; stroke-linejoin: round; fill-opacity: .93; transition: fill-opacity .15s; }
  .piece.sel polygon.body { stroke: var(--accent); stroke-width: 5; }
  .piece.dragging polygon.body { fill-opacity: .5; }
  .piece.pair polygon.body { fill-opacity: .32; }
  /* 配對好的一組：綠色光暈、粗綠框、打勾，和還沒配對的明顯不同 */
  .piece.pair polygon.halo { fill: none; stroke: #66bb6a; stroke-width: 18; stroke-opacity: .45; stroke-linejoin: round; }
  .piece.pair polygon.outline { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: round; }
  .piece.pair polygon.outline2 { fill: none; stroke: #2e7d32; stroke-width: 5; stroke-linejoin: round; }
  .piece .badge circle { fill: #2e7d32; stroke: #fff; stroke-width: 3; }
  .piece .badge path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* 閃爍用一圈外框做（iPad Safari 不支援 SVG 上的 CSS filter） */
  .piece polygon.glow { fill: none; stroke: #00b8d4; stroke-width: 16; stroke-linejoin: round; opacity: 0; pointer-events: none; }
  .piece.pulse polygon.glow { animation: glow .7s ease-in-out 6; }
  .piece.pop polygon.glow { stroke: #fff176; animation: glow .6s ease-out 1; }
  .piece.shake { animation: shake .4s; }
  /* 找對應 */
  .piece.corr polygon.body { fill-opacity: .6; }
  .lbl text { font-size: 25px; font-weight: bold; fill: #4e342e; pointer-events: none; }
  .ask { animation: ask 1s ease-in-out infinite; }
  .ang-guide { fill: #fff; fill-opacity: .45; stroke: #5d4037; stroke-width: 2.5; stroke-dasharray: 6 4; }
  /* 看不見的粗外框：細長的三角形也容易抓 */
  .piece polygon.hit { fill: transparent; stroke: transparent; stroke-width: 28; stroke-linejoin: round; }
  /* 挑戰關「找全等」的題目三角形 */
  .piece polygon.target-ring { fill: none; stroke: #5d4037; stroke-width: 14; stroke-dasharray: 3 9; stroke-linecap: round; opacity: .5; pointer-events: none; }
  /* 愛心 */
  #hearts { display: flex; gap: 2px; font-size: 26px; min-height: 4px; }
  .ico.heart { color: #e53935; }
  .ico.heart.lost { color: #e3d7cc; }
  .ico.heart.break, .ico.star.break { animation: heartbreak .6s; }
  /* 半顆心：灰色的心上面疊一個只露出左半邊的紅心 */
  .hh { position: relative; display: inline-block; width: 1em; height: 1em; }
  .hh .ico { position: absolute; left: 0; top: 0; }
  .ico.heart.halfon { color: #e53935; clip-path: inset(0 50% 0 0); }
  .hh.break { animation: heartbreak .6s; }
  @keyframes heartbreak { 30% { transform: scale(1.5); } 60% { transform: scale(.7); } }
  /* 挑戰關的時間和分數 */
  #progress { align-items: center; }
  #progress .chal-time, #progress .chal-score { font-size: 22px; font-weight: bold; color: var(--ink); white-space: nowrap; }
  #progress .chal-time.hurry { color: #c62828; }
  #progress .chal-bar { width: 180px; height: 14px; border-radius: 8px; background: #efe3d3; overflow: hidden; }
  #progress .chal-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
  /* 找對應的進度點：3 組 × 3 題 */
  /* 第 4 關一輪結束，看完說明再按「下一輪」 */
  #progress { position: absolute; left: 12px; top: 8px; z-index: 3; display: flex; gap: 16px; pointer-events: none; }
  #progress .grp { display: flex; gap: 6px; }
  #progress .dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); }
  #progress .dot.done { background: var(--accent); border-color: var(--accent); }
  #progress .dot.now { border-color: var(--accent); animation: ask 1s ease-in-out infinite; }
  /* 提示：先閃幾下，之後一直留著（老師說閃完就消失看不到） */
  .hintmark { opacity: .85; animation: blink .7s ease-in-out 6; pointer-events: none; }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes ask { 50% { opacity: .35; } }
  .marks path, .marks line { pointer-events: none; }
  #handle line { pointer-events: none; }
  #handle [data-handle] { cursor: grab; }
  #handle .hico path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  @keyframes glow { 50% { opacity: 1; } }
  @keyframes shake { 25% { opacity: .6; } 50% { opacity: 1; } 75% { opacity: .6; } }
  @keyframes bounce { 30% { transform: translateY(-10px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }

  /* 右側工具列 */
  #tools {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 3;
    display: flex; flex-direction: column; gap: 6px;
  }
  /* 放大縮小：桌面右上角、工具列上面（以前在最上面一排，老師要對話框長一點，所以移到這裡） */
  /* 最多 5 個按鈕（左轉、右轉、翻面、直角尺、做記號），桌面最矮約 340px 也放得下 */
  #tools button {
    width: 62px; height: 60px; border-radius: 16px; border: 3px solid var(--line); background: var(--card);
    font-size: 26px; display: grid; place-items: center; padding: 0; color: var(--ink);
    box-shadow: 0 3px 0 var(--line);
  }
  #tools button[hidden] { display: none; }
  #tools button span { font-size: 15px; display: block; margin-top: -4px; }
  #tools.tight button { font-size: 20px; }
  #tools.tight button span { font-size: 12px; margin-top: -2px; }
  #tools button:disabled { opacity: .35; }
  #tools button:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
  #tools button.on { background: #e3f2fd; border-color: #1e88e5; color: #1565c0; box-shadow: 0 3px 0 #90caf9; }
  /* 直角尺 */
  #ruler .rl-body { fill: #546e7a; fill-opacity: .28; stroke: #263238; stroke-width: 3; stroke-linejoin: round; cursor: grab; }
  #ruler .rl-arm { stroke: #263238; stroke-width: 4; stroke-linecap: round; pointer-events: none; }
  #ruler .rl-sq { fill: none; stroke: #263238; stroke-width: 3; pointer-events: none; }
  #ruler .rl-knob circle.k { fill: #455a64; stroke: #fff; stroke-width: 4; }
  #ruler .rl-knob path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* 教做記號：示範點一下的小手指 */
  #guide { pointer-events: none; }
  #guide .finger { transform-box: fill-box; transform-origin: 30% 0; }
  #guide .finger .hand { fill: #ffca28; stroke: #4e342e; stroke-width: .8; stroke-linejoin: round; }   /* 黃色比白色明顯（老師說白色不明顯） */
  #guide .finger .hand-sh { fill: #4e342e; opacity: .18; }
  #guide .finger .knuckle { fill: none; stroke: #4e342e; stroke-width: .55; stroke-linecap: round; }
  #guide .finger.tap { animation: tap .4s ease-in-out; }
  #guide .ripple { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ripple .6s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.6); opacity: .9; } to { transform: scale(3); opacity: 0; } }
  @keyframes tap { 50% { transform: scale(.82); } }
  #guide .finger.wait { animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(8px); } }
  /* 學生自己做的記號（短線、弧線）：深青色，和遊戲給的記號分開 */
  .um line, .um path { stroke: #00695c; stroke-width: 4; stroke-linecap: round; fill: none; pointer-events: none; }
  /* 找對應的題目三角形：固定不動，淺灰色、粗框 */
  .piece.fixed polygon.body { fill: #eceff1; stroke: #455a64; stroke-width: 6; fill-opacity: 1; }
  .piece .fixed-tag { font-size: 18px; font-weight: bold; fill: #607d8b; pointer-events: none; }

  /* ---------- 下方：分類籃 ---------- */
  #bins { display: grid; gap: 10px; padding: 10px 0 0; position: relative; z-index: 1; }
  #bins:empty { display: none; }
  .bin {
    background: var(--card); border: 3px dashed var(--line); border-radius: 16px; min-height: 116px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .bin b { font-size: clamp(20px, 3vw, 28px); }
  .bin small { font-size: clamp(15px, 2.1vw, 19px); color: var(--soft); }
  .bin.over { background: #fff8e1; border-color: var(--accent); border-style: solid; transform: scale(1.04); }
  .bin.ok { animation: binok .6s; }
  .bin.no { animation: binno .4s; }
  .minis { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
  .minis svg { width: 34px; height: 34px; }
  @keyframes binok { 40% { background: #c8e6c9; transform: scale(1.06); } }
  @keyframes binno { 20%, 60% { transform: translateX(-6px); background: #ffcdd2; } 40%, 80% { transform: translateX(6px); } }
  .grid-head { font-size: clamp(18px, 2.8vw, 25px); font-weight: bold; text-align: center; align-self: end; color: var(--soft); }
  .grid-head.row { align-self: center; writing-mode: vertical-rl; letter-spacing: 2px; }
  #bins.both .bin { min-height: 84px; }
  #bins.both .bin b { font-size: clamp(16px, 2.6vw, 24px); }

  /* ---------- 覆蓋畫面 ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(78, 52, 46, .45); z-index: 10;
    display: none; place-items: center; padding: 16px; touch-action: auto;
  }
  #overlay.show { display: grid; }
  .panel {
    background: var(--bg); border-radius: 28px; padding: 24px 28px; max-width: 560px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25); border: 4px solid #fff;
    max-height: 100%; overflow: auto;
  }
  .panel h1 { margin: 4px 0 10px; font-size: clamp(32px, 6vw, 48px); }
  .panel h2 { margin: 4px 0 8px; font-size: clamp(28px, 5vw, 40px); }
  .panel p { font-size: clamp(21px, 3.3vw, 27px); line-height: 1.55; margin: 8px 0; }
  .big-cat { font-size: 76px; line-height: 1; color: var(--ink); }
  .big-cat .ico { display: block; margin: 0 auto; }
  /* 學習模式的過關徽章（靜態，不做動畫） */
  .pass-badge { width: 92px; height: 92px; margin: 0 auto 4px; border-radius: 50%; background: #66bb6a; border: 6px solid #c8e6c9; display: grid; place-items: center; }
  .pass-badge svg { width: 58px; height: 58px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .stars { font-size: 52px; margin: 6px 0; display: flex; justify-content: center; gap: 6px; }
  /* 圖示：同一種線條風格 */
  .ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.16em; }
  .ico .f { fill: currentColor; stroke: none; }
  /* 可愛的小龍（顏色用 --dg、--dg2，可以變裝） */
  .ico .dg-body { fill: var(--dg, #ffd54f); stroke-width: 1.3; }
  .ico .dg-belly { fill: var(--dg2, #fff3c4); stroke: none; }
  .ico .dg-spike { fill: #ff8f00; stroke: #4e342e; stroke-width: .7; stroke-linejoin: round; }   /* 頭頂一排小刺、尾巴尖尖：最像龍的地方 */
  .ico .dg-tail-o { fill: none; stroke: #4e342e; stroke-width: 3.4; stroke-linecap: round; }
  .ico .dg-tail { fill: none; stroke: var(--dg, #ffd54f); stroke-width: 1.8; stroke-linecap: round; }
  .ico .dg-cheek { fill: #ff8a80; stroke: none; opacity: .8; }
  .ico .dg-shine { fill: #fff; stroke: none; }
  .ico .dg-line { stroke-width: 1.2; }
  .ico .dg-scale { fill: none; stroke: rgba(0, 0, 0, .18); stroke-width: .8; stroke-linecap: round; }
  /* 表情：平常會眨眼；開心（眼睛彎彎、張嘴笑）；想一想（嘴巴圓圓、冒汗） */
  .ico .dg-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .ico .dg-eyes-h { fill: none; stroke-width: 1.3; display: none; }
  .ico .dg-m-h { fill: #e57373; stroke-width: 1; display: none; }
  .ico .dg-m-o { fill: #4e342e; stroke: none; display: none; }
  .ico .dg-sweat { fill: #81d4fa; stroke: #0277bd; stroke-width: .5; display: none; }
  .mood-happy .dg-eyes, .mood-happy .dg-m-n, .mood-think .dg-m-n { display: none; }
  .mood-happy .dg-eyes-h, .mood-happy .dg-m-h, .mood-think .dg-m-o, .mood-think .dg-sweat { display: inline; }
  /* 配件 */
  .ico .acc-glass { fill: none; stroke: #4e342e; stroke-width: .9; }
  .ico .acc-band { fill: none; stroke: #e53935; stroke-width: 1.8; stroke-linecap: round; }
  .ico .acc-bstar { fill: #ffeb3b; stroke: #e65100; stroke-width: .5; stroke-linejoin: round; }
  .ico .acc-bow { fill: #f06292; stroke: #4e342e; stroke-width: .7; stroke-linejoin: round; }
  .ico .acc-scarf { fill: #e53935; stroke: #4e342e; stroke-width: .7; stroke-linejoin: round; }
  .ico .acc-hat { fill: #4fc3f7; stroke: #4e342e; stroke-width: .7; stroke-linejoin: round; }
  .ico .acc-hat2 { fill: none; stroke: #fff; stroke-width: .8; }
  .ico .acc-pom { fill: #ffeb3b; stroke: #4e342e; stroke-width: .5; }
  .ico .acc-crown { fill: #ffca28; stroke: #4e342e; stroke-width: .7; stroke-linejoin: round; }
  .ico .acc-gem { fill: #e53935; stroke: none; }
  /* 龍角、龍鬚、眼睛、嘴巴的各種樣子 */
  .ico .dg-hn-o { fill: none; stroke: #4e342e; stroke-width: 2.4; stroke-linecap: round; }
  .ico .dg-hn-i { fill: none; stroke-width: 1.1; stroke-linecap: round; }
  .ico .dg-hn { fill: none; stroke: #ff8f00; stroke-width: 1.4; stroke-linecap: round; }
  .ico .dg-crys { fill: #80deea; stroke: #006064; stroke-width: .7; stroke-linejoin: round; }
  .ico .dg-wh { fill: none; stroke: #4e342e; stroke-width: .75; stroke-linecap: round; }
  .ico .dg-beard { fill: #fff3c4; stroke: #4e342e; stroke-width: .7; }
  .ico .dg-eline { fill: none; stroke-width: 1.3; }
  .ico .dg-eye-star { fill: #ffb300; stroke: #4e342e; stroke-width: .5; stroke-linejoin: round; }

  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

const $ = (s) => document.querySelector(s);
const rand = (n) => Math.floor(Math.random() * n);

const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const sortNum = (a) => [...a].sort((x, y) => x - y);
const sameAngles = (a, b) => { const x = sortNum(a), y = sortNum(b); return x.every((v, i) => Math.abs(v - y[i]) < 0.5); };
// 兩組角度最多差幾度（排序後比較）：差太少的兩個三角形看起來會像全等
const angleGap = (a, b) => { const x = sortNum(a), y = sortNum(b); return Math.max(...x.map((v, i) => Math.abs(v - y[i]))); };
const PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];

// 用三個角和最長邊長度做出三角形（頂點以重心為原點）
function makeTri(angles, size) {
  let a = [...angles];
  const k = rand(3);
  a = [...a.slice(k), ...a.slice(0, k)];
  if (Math.random() < 0.5) a.reverse();
  const [A, B, C] = a.map((d) => d * Math.PI / 180);
  const b = Math.sin(B) / Math.sin(C);
  let v = [[0, 0], [1, 0], [b * Math.cos(A), -b * Math.sin(A)]];
  const sides = [dist(v[1], v[2]), dist(v[0], v[2]), dist(v[0], v[1])];
  const f = size / Math.max(...sides);
  v = v.map((p) => [p[0] * f, p[1] * f]);
  const cx = (v[0][0] + v[1][0] + v[2][0]) / 3, cy = (v[0][1] + v[1][1] + v[2][1]) / 3;
  v = v.map((p) => [p[0] - cx, p[1] - cy]);
  return { v, ang: a, sides: sides.map((s) => s * f), size };
}

function categorize(ang) {
  const m = Math.max(...ang);
  const angle = Math.abs(m - 90) < 0.5 ? "right" : m > 90 ? "obtuse" : "acute";
  const eq = (i, j) => Math.abs(ang[i] - ang[j]) < 0.5;
  const n = (eq(0, 1) ? 1 : 0) + (eq(1, 2) ? 1 : 0) + (eq(0, 2) ? 1 : 0);
  const side = n === 3 ? "equi" : n === 1 ? "iso" : "sca";
  return { angle, side };
}

function pickAngles(key, used) {

function genSpecs(mode, direct) {
  if (direct) {
    // 每個三角形自己分類，每一類兩個
    const two = (ks) => shuffle([...ks]).slice(0, 2);
    const keys = mode === "side"
      ? ["equi-acute", "equi-acute", ...two(["iso-acute", "iso-right", "iso-obtuse"]), ...two(["sca-acute", "sca-right", "sca-obtuse"])]
      : mode === "angle"

        : ["iso-acute", "iso-right", "iso-obtuse", "sca-acute", "sca-right", "sca-obtuse"];
    const sizes = shuffle([1.0, 1.04, 1.08, 1.12, 1.16, 1.2]);   // 不要太小的三角形
    const used = [];
    return keys.map((key, i) => {
      const angles = pickAngles(key, used);
      used.push(angles);
      return { angles, size: sizes[i], role: "single", key };
    });
  }
  let last = [];
  for (let tries = 0; tries < 100; tries++) {
    // 第 4 關每輪 2 組全等 + 1 個干擾題（玩三輪），三角形才夠大
    const keys = shuffle(["iso-acute", "iso-right", "iso-obtuse", "sca-acute", "sca-right", "sca-obtuse"]).slice(0, 2);
    const sizes = shuffle([1.0, 1.15]);
    const used = [];
    const specs = keys.map((key, i) => {
      const angles = pickAngles(key, used);
      used.push(angles);
      return { angles, size: sizes[i], role: "pair", key };
    });
    // 干擾題：看起來很像，但不全等
    const base = pick(specs);
    const alt = LIB[base.key].filter((a) => !used.some((u) => sameAngles(u, a)) && angleGap(a, base.angles) >= 20);   // 角度要差得夠多，看起來才不會像全等
    let d;
    if (Math.random() < 0.5 || !alt.length) {
      const bigger = base.size <= 1.05;   // 大的放大、小的縮小，干擾題才不會太大或太小
      d = { angles: base.angles, size: bigger ? base.size * 1.2 : base.size * 0.8, role: "distractor", key: base.key,
            reason: `它和其中一組形狀一樣，但是${bigger ? "比較大" : "比較小"}，<br>所以沒有和它全等的三角形。` };
    } else {
      d = { angles: pick(alt), size: base.size, role: "distractor", key: base.key,
            reason: "它的角和別的三角形不一樣大，<br>所以沒有和它全等的三角形。" };
    }
    const clash = specs.some((s) => sameAngles(s.angles, d.angles) && Math.abs(s.size - d.size) < 0.05);
    // 同一輪裡，不同形狀之間的角度至少要差 20°，不然學生會以為有三個全等、怎麼疊都疊不起來
    const all = [...specs, d];
    const look = all.some((s, i) => all.some((t, j) => j > i && !sameAngles(s.angles, t.angles) && angleGap(s.angles, t.angles) < 20));
    last = all;
    if (!clash && !look) return all;
  }
  return last;   // 試很多次都不行（幾乎不會發生）就用最後一次
}

let direct = false, replay = false, corr = null, challenge = false, chal = null;
// learn：學習模式（老師上課用：沒有愛心、星星，提示不限次數）；false 是挑戰模式；null 是還沒選
let learn = null;
let rulerOn = false, markOn = false;   // 直角尺、做記號工具有沒有打開
let pageToken = 0;   // 換關或回選單時加 1，舊關卡的計時器就不會再跳出畫面
let W = 0, H = 0, S = 60;
const TOOL_W = 100;
const svg = $("#svg"), layer = $("#layer"), board = $("#board"), binsEl = $("#bins");

function startPage(i) {
  pageToken++;
  pageIdx = i;
  mode = PAGES[i].mode;
  direct = !!PAGES[i].direct;
  challenge = false;
  mistakes = 0;
  combo = 0;
  hintsLeft = HINT_FLASHES;
  nudged = false;
  pageDone = false;
  selected = null;
  pageStart = Date.now();
  lastAct = Date.now();
  $("#pageLabel").textContent = PAGES[i].title;
  $("#progress").innerHTML = "";
  $("#roundBtn").hidden = true; nextAction = null;
  $("#guide").innerHTML = "";
  hideSkip();
  $("#checkBtn").hidden = true;
  setTool("ruler", false);
  setTool("mark", false);
  renderHearts();
  buildBins();
  measure();
  if (mode === "corr") {
    playing = true;
    corr = { round: 0 };
    startCorrRound();
    return;
  }
  if (mode === "tutorial") {
    playing = true;
    renderHearts();   // 練習沒有愛心
    startTutorial(0);
    return;
  }
  if (mode === "both" && !direct) {
    // 第 4 關：分三輪，每輪 2 組全等 + 1 個干擾題，三角形才能放大
    playing = true;
    l4 = { round: 0 };
    startL4Round();
    return;
  }

  dealPieces(genSpecs(mode, direct));
  if (mode === "side") {
    say("<b>以邊分類</b><br>把每個三角形拖到下面正確的格子裡。");
  } else if (mode === "angle") {
    say("<b>以角分類</b><br>把每個三角形拖到下面正確的格子裡。");
  } else {
    say("<b>以邊和角分類</b><br>把每個三角形拖到下面正確的格子裡。");
  }
  playing = true;
  if (mode === "angle" && learn) startRulerDemo();   // 學習模式第 2 關：先教直角尺
}

// ================= 第 4 關：分三輪 =================
const l4Rounds = () => (learn ? 2 : 3);   // 學習模式少一點（老師要求）
let l4 = null;
function startL4Round() {
  selected = null;
  $("#roundBtn").hidden = true;
  // 換新的一輪：清掉格子裡上一輪放的小圖，避免誤導學生
  for (const m of binsEl.querySelectorAll(".minis")) m.innerHTML = "";
  dealPieces(genSpecs(mode, false));
  renderProgress();
  say(l4.round === 0
    ? "找出<b>全等</b>的兩個三角形，疊在一起。<br>再把這一組拖到下面的格子裡。"
    : "下一輪：找出<b>全等</b>的兩個三角形，疊在一起。<br>再把這一組拖到下面的格子裡。");
  playing = true;
  drawHandle();
}
// 全部分好了：先說明剩下的干擾題，學生看完自己按「下一輪」或「完成」（老師覺得自動跳太快，來不及看）
function roundOrFinish() {
  const more = mode === "both" && !direct && l4 && l4.round + 1 < l4Rounds();
  const d = pieces.find((p) => p.distractor && p.state === "free");
  if (!d) return more ? (l4.round++, startL4Round()) : finishPage();
  playing = false;
  drawHandle();
  showMarks(d, mode, 600000);
  say("分好了！剩下的三角形：<br>" + d.reason, "good");
  showNext(more ? "下一輪" : "完成", () => {
    if (!more) return finishPage(true);
    l4.round++;
    startL4Round();
  });
}

// 依照出題結果做出三角形、決定方向、擺到桌面上
function dealPieces(specs) {
  const colors = shuffle([...COLORS]);
  pieces = [];
  let id = 0;
  for (const sp of specs) {
    const tri = makeTri(sp.angles, sp.size);
    const count = sp.role === "pair" ? 2 : 1;
    for (let c = 0; c < count; c++) {
      pieces.push({
        id: "p" + id++, v: tri.v.map((p) => [...p]), ang: tri.ang, sides: tri.sides, size: tri.size,
        cat: categorize(tri.ang), distractor: sp.role === "distractor", reason: sp.reason || "",
        state: "free", partner: null, nx: 0, ny: 0, r: 0, s: 1, marks: null,
      });
    }
  }
  // 方向：每個都轉一個角度、有的翻面；同一組的兩個不能一開始就對齊
  for (const p of pieces) { p.r = 30 * rand(12); p.s = Math.random() < 0.5 ? 1 : -1; }
  for (let k = 0; k + 1 < pieces.length; k++) {
    const a = pieces[k], b = pieces[k + 1];
    if (!a.distractor && !b.distractor && congruent(a, b) && a.s === b.s && (a.r - b.r) % 360 === 0) b.r += 90;
  }
  shuffle(pieces);
  pieces.forEach((p, k) => { p.color = colors[k % colors.length]; });

  // 擺放：選格子最大的排法（幾欄幾列），再加一點亂數
  const n = pieces.length;
  const availW = Math.max(100, W - TOOL_W);
  const best = bestGrid(n);
  const cols = best.c, rows = best.r;
  grid = { cols, rows, n };   // n：出題時的個數，轉方向時用來重新排列
  measure();
  const top = mode === "both" && !direct ? 40 : 10;   // 第 4 關左上角有進度點
  // 三角形很大，偶爾會碰到隔壁的：碰到就換位置重新排，最多試 30 次
  for (let tries = 0; tries < 30; tries++) {
    const slots = shuffle([...Array(cols * rows).keys()]).slice(0, n);
    pieces.forEach((p, k) => {
      const col = slots[k] % cols, row = Math.floor(slots[k] / cols);
      p.nx = ((col + 0.5 + (Math.random() - 0.5) * 0.1) * availW / cols) / W;
      p.ny = ((row + 0.5 + (Math.random() - 0.5) * 0.1) * layH() / rows) / H;
      fitIn(p, 10, top);
    });
    if (!anyOverlap()) break;
  }
  renderAll();
  updateTools();
}

// ================= 練習：先練旋轉，再練翻面 =================
// 第 1 步：等腰直角三角形，方向差 90°，轉一轉就能疊合。
// 第 2 步：不等邊直角三角形，一個翻過面，只轉疊不起來，一定要翻面。
let tutStep = 0;
const TUT_TEXT = [
  "練習 1　<b>轉一轉</b><br>拖<b>橘色圓圈</b>或按「左轉」「右轉」，轉成一樣的方向，再疊上去。",
  "練習 2　<b>翻面</b><br>只轉疊不起來。按「翻面」，再疊上去。",
];
function startTutorial(step) {
  tutStep = step;
  const tri = makeTri(step === 0 ? [90, 45, 45] : [90, 30, 60], 1.1);
  const availW = Math.max(100, W - TOOL_W), wide = bestGrid(2).c === 2;   // 和轉方向時用同一個排法
  grid = wide ? { cols: 2, rows: 1 } : { cols: 1, rows: 2 };
  measure();
  const colors = shuffle([...COLORS]);
  pieces = [0, 1].map((k) => ({
    id: "t" + step + k, v: tri.v.map((p) => [...p]), ang: tri.ang, sides: tri.sides, size: tri.size,
    cat: categorize(tri.ang), distractor: false, reason: "", state: "free", partner: null, marks: null,
    nx: (wide ? (k + 0.5) * availW / 2 : availW / 2) / W, ny: wide ? 0.5 : (k + 0.5) / 2,
    r: step === 0 ? k * 90 : 0, s: step === 1 && k === 1 ? -1 : 1, color: colors[k],
  }));
  for (const p of pieces) fitIn(p, 10);
  selected = null;
  renderAll();
  updateTools();
  say(TUT_TEXT[step]);
}

// ================= 版面與畫圖 =================
// 以前會出現「下一題」「檢查」按鈕的關卡，桌面底部留給按鈕；按鈕移到對話框以後不用了（ACT_H = 0），保留 layH() 方便以後調整
const ACT_H = 0;   // 按鈕移到對話框以後，桌面底部不用再留空間（以前 84px）
function layH() { return H - (!challenge && (mode === "corr" || (mode === "both" && !direct) || (learn && mode === "angle")) ? ACT_H : 0); }
function measure() {
  W = board.clientWidth; H = board.clientHeight;
  const availW = Math.max(100, W - TOOL_W);
  // 三角形盡量放大：最長邊約是格子的 75%（找對應那關只有兩個，可以更大）
  const f = mode === "corr" ? 0.62 : mode === "both" && !challenge ? 0.8 : 0.75;
  S = f * Math.min(availW / grid.cols, layH() / grid.rows);
  S = Math.max(50, Math.min(S, mode === "corr" ? 300 : 230)) * ZOOMS[zoomIdx];   // 放大縮小按鈕
}

const byId = (id) => pieces.find((p) => p.id === id);
const lenPx = (p) => p.size * S;

function worldVerts(p) {
  const rad = p.r * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
  const x0 = p.nx * W, y0 = p.ny * H;
  return p.v.map(([x, y]) => {
    const xs = x * p.s * S, ys = y * S;
    return [x0 + xs * c - ys * s, y0 + xs * s + ys * c];
  });
}

function pointsAttr(p) { return p.v.map(([x, y]) => `${(x * S).toFixed(1)},${(y * S).toFixed(1)}`).join(" "); }

function marksSvg(p, kind) {
  const v = p.v.map(([x, y]) => [x * S, y * S]);
  const L = lenPx(p);
  let out = "";
  if (kind === "angle" || kind === "both") {
    const cat = p.cat.angle;
    for (let i = 0; i < 3; i++) {
      const P = v[i], Q = v[(i + 1) % 3], R = v[(i + 2) % 3];
      const u = norm([Q[0] - P[0], Q[1] - P[1]]), w = norm([R[0] - P[0], R[1] - P[1]]);
      const a = p.ang[i];
      const k = Math.max(14, L * 0.16);
      if (Math.abs(a - 90) < 0.5) {
        const A = [P[0] + u[0] * k, P[1] + u[1] * k], B = [A[0] + w[0] * k, A[1] + w[1] * k], C = [P[0] + w[0] * k, P[1] + w[1] * k];
        out += `<path d="M${A} L${B} L${C}" fill="none" stroke="#1565c0" stroke-width="4"/>`;
      } else if (a > 90 || cat === "acute") {
        const col = a > 90 ? "#d32f2f" : "#2e7d32";
        const cross = u[0] * w[1] - u[1] * w[0];
        const A = [P[0] + u[0] * k, P[1] + u[1] * k], C = [P[0] + w[0] * k, P[1] + w[1] * k];
        out += `<path d="M${P} L${A} A${k},${k} 0 0 ${cross > 0 ? 1 : 0} ${C} Z" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="3"/>`;
      }
    }
  }
  if (kind === "side" || kind === "both") {
    const sides = [[1, 2], [0, 2], [0, 1]];
    for (let i = 0; i < 3; i++) {
      const same = [0, 1, 2].filter((j) => j !== i && Math.abs(p.sides[i] - p.sides[j]) < p.size * 0.01).length;
      if (!same) continue;
      const [a, b] = sides[i];
      const M = [(v[a][0] + v[b][0]) / 2, (v[a][1] + v[b][1]) / 2];
      const d = norm([v[b][0] - v[a][0], v[b][1] - v[a][1]]), nrm = [-d[1], d[0]];
      const t = Math.max(5, Math.min(10, L * 0.07));   // 小圖上短線也跟著變短，才不會連在一起
      out += `<line x1="${M[0] - nrm[0] * t}" y1="${M[1] - nrm[1] * t}" x2="${M[0] + nrm[0] * t}" y2="${M[1] + nrm[1] * t}" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round"/>`;
    }
  }
  return `<g class="marks">${out}</g>`;
}
function norm(d) { const l = Math.hypot(d[0], d[1]) || 1; return [d[0] / l, d[1] / l]; }

function pieceMarkup(p) {
  const pts = pointsAttr(p);
  // hit：看不見的粗外框，讓很尖、很細的三角形也容易用手指抓到
  let inner = `<polygon class="hit" points="${pts}"/><polygon class="glow" points="${pts}"/>`;
  if (p.target) inner += `<polygon class="target-ring" points="${pts}"/>`;
  if (p.state === "pair") {
    inner += `<polygon class="halo" points="${pts}"/>` +
             `<polygon class="outline" points="${pts}"/>` +
             `<polygon class="body" points="${pts}" fill="${p.color}"/>` +
             `<polygon class="body" points="${pts}" fill="${p.partner.color}"/>` +
             `<polygon class="outline2" points="${pts}"/>`;
  } else {
    inner += `<polygon class="body" points="${pts}" fill="${p.color}"/>`;
  }
  if (p.marks) inner += marksSvg(p, p.marks);
  inner += userMarksSvg(p);
  if (p.fixed) inner += `<text class="fixed-tag" text-anchor="middle" dominant-baseline="central" transform="${badgeT(p)}">題目</text>`;
  if (p.labels) inner += corrSvg(p);
  // 打勾放在重心，反向轉回來，才不會跟著轉歪或翻面
  if (p.state === "pair" && !p.marks) inner += `<g class="badge" transform="${badgeT(p)}"><circle r="16"/><g transform="translate(-10,-10) scale(.84)">${ICONS.check}</g></g>`;
  return inner;
}
function badgeT(p) { return `scale(${p.s.toFixed(3)},1) rotate(${(-p.r).toFixed(2)})`; }
function lblT(p, x, y) { return `translate(${x.toFixed(1)},${y.toFixed(1)}) ` + badgeT(p); }

// 角的扇形（第 i 個頂點，半徑 k）
function arcD(v, i, k) {
  const P = v[i], Q = v[(i + 1) % 3], R = v[(i + 2) % 3];
  const u = norm([Q[0] - P[0], Q[1] - P[1]]), w = norm([R[0] - P[0], R[1] - P[1]]);
  const cross = u[0] * w[1] - u[1] * w[0];
  const A = [P[0] + u[0] * k, P[1] + u[1] * k], C = [P[0] + w[0] * k, P[1] + w[1] * k];
  return `M${P} L${A} A${k},${k} 0 0 ${cross > 0 ? 1 : 0} ${C} Z`;
}

// 找對應：頂點字母、可以點的邊、答對和題目的記號
function corrSvg(p) {
  const v = p.v.map(([x, y]) => [x * S, y * S]);
  const k = Math.max(26, lenPx(p) * 0.15);
  const marks = p.ans.map((m) => ({ ...m, col: CORR_COL[m.kind], cls: "" }));
  if (p.ask) marks.push({ ...p.ask, col: "#ab47bc", cls: "ask" });   // 題目用紫色閃，和提示的青色分開（老師要求）
  for (const h of [].concat(p.hint || [])) marks.push({ ...h, col: "#00b8d4", cls: "hintmark" });   // 提示可以是好幾個地方
  if (p.guide) marks.push({ ...p.guide, col: "#00b8d4", cls: "ask" });   // 教做記號：一閃一閃的邊或角
  let out = "";
  for (const m of marks) {
    if (m.kind === "side") {
      const A = v[(m.i + 1) % 3], B = v[(m.i + 2) % 3];
      out += `<line class="${m.cls}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${m.col}" stroke-width="10" stroke-linecap="round" pointer-events="none"/>`;
    } else if (m.kind === "angle") {
      out += `<path class="${m.cls}" d="${arcD(v, m.i, k)}" fill="${m.col}" fill-opacity=".5" stroke="${m.col}" stroke-width="4" pointer-events="none"/>`;
    }
  }
  // 點邊用：看不見的粗線（不要太粗，學生點三角形中間選取時才不會被當成作答）
  for (let s = 0; s < 3; s++) {
    const A = v[(s + 1) % 3], B = v[(s + 2) % 3];
    out += `<line data-side="${s}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#000" stroke-opacity="0" stroke-width="26" stroke-linecap="round"/>`;
  }
  // 問角的時候：另一個三角形的三個角畫成虛線扇形，點扇形作答（不是點頂點的字母，避免和「點」搞混）
  if (p.angleTap) {
    const minSide = Math.min(...p.sides) * S;
    const kA = Math.min(Math.max(40, lenPx(p) * 0.24), minSide * 0.42);
    for (let i = 0; i < 3; i++) {
      out += `<path class="ang-guide" data-ang="${i}" d="${arcD(v, i, kA)}"/>`;
    }
  }
  // 頂點字母：放在頂點外側，反向旋轉保持正立
  for (let i = 0; i < 3; i++) {
    const o = norm(v[i]), x = v[i][0] + o[0] * 26, y = v[i][1] + o[1] * 26;
    const pt = marks.find((m) => m.kind === "point" && m.i === i);
    const ring = pt ? `stroke="${pt.col}" stroke-width="6"` : `stroke="#5d4037" stroke-width="3"`;
    out += `<g class="lbl" data-vtx="${i}" data-x="${x}" data-y="${y}" transform="${lblT(p, x, y)}">` +
      `<circle r="32" fill="#000" fill-opacity="0"/>` +
      (pt && pt.cls === "hintmark" ? `<circle class="hintmark" r="30" fill="none" stroke="#00b8d4" stroke-width="8"/>` : "") +
      `<circle class="${pt && pt.cls === "ask" ? "ask" : ""}" r="22" fill="#fff" ${ring}/>` +
      `<text text-anchor="middle" dominant-baseline="central">${p.labels[i]}</text></g>`;
  }
  return out;
}

function renderAll() {
  layer.innerHTML = "";
  for (const p of pieces) {
    if (p.state !== "free" && p.state !== "pair") continue;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "piece" + (p.state === "pair" ? " pair" : "") + (p.labels ? " corr" : "") + (p.fixed ? " fixed" : "") + (selected === p ? " sel" : ""));
    g.dataset.id = p.id;
    g.innerHTML = pieceMarkup(p);
    p.el = g;
    updT(p);
    layer.appendChild(g);
  }
  drawHandle();
}
function redraw(p) { if (p.el) p.el.innerHTML = pieceMarkup(p); }
function updT(p) {
  if (!p.el) return;
  p.el.setAttribute("transform", `translate(${(p.nx * W).toFixed(1)},${(p.ny * H).toFixed(1)}) rotate(${p.r.toFixed(2)}) scale(${p.s.toFixed(3)},1)`);
  const b = p.el.querySelector(".badge");
  if (b) b.setAttribute("transform", badgeT(p));
  for (const l of p.el.querySelectorAll(".lbl")) l.setAttribute("transform", lblT(p, +l.dataset.x, +l.dataset.y));
  if (p === selected) drawHandle();
}
function flash(p, cls, ms = 700) {
  if (!p.el) return;
  const el = p.el;
  el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
  clearTimeout(p["t_" + cls]);
  p["t_" + cls] = setTimeout(() => el.classList.remove(cls), ms);
}

// 兩個三角形有沒有重疊（分離軸判斷，多留 6px 間隔）
function trisOverlap(A, B) {
  for (const P of [A, B]) for (let i = 0; i < 3; i++) {
    const p = P[i], q = P[(i + 1) % 3], n = norm([q[1] - p[1], p[0] - q[0]]);
    const pa = A.map((v) => v[0] * n[0] + v[1] * n[1]), pb = B.map((v) => v[0] * n[0] + v[1] * n[1]);
    if (Math.max(...pa) + 6 < Math.min(...pb) || Math.max(...pb) + 6 < Math.min(...pa)) return false;
  }
  return true;
}
function anyOverlap() {
  const ws = pieces.map(worldVerts);
  for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) if (trisOverlap(ws[i], ws[j])) return true;
  return false;
}

// 出題擺放後用：把整個三角形（含頂點字母）推回桌面內，右邊留給工具列
function fitIn(p, margin, top = margin) {
  const ws = worldVerts(p), xs = ws.map((v) => v[0]), ys = ws.map((v) => v[1]);
  const right = Math.max(100, W - TOOL_W);
  let dx = 0, dy = 0;
  if (Math.min(...xs) - margin < 0) dx = margin - Math.min(...xs);
  else if (Math.max(...xs) + margin > right) dx = right - margin - Math.max(...xs);
  if (Math.min(...ys) - top < 0) dy = top - Math.min(...ys);
  else if (Math.max(...ys) + margin > layH()) dy = layH() - margin - Math.max(...ys);
  p.nx += dx / W; p.ny += dy / H;
}

function clampIn(p) {
  const r = lenPx(p) * 0.45;
  p.nx = Math.min(Math.max(p.nx * W, r), Math.max(r, W - r)) / W;
  p.ny = Math.min(Math.max(p.ny * H, r), Math.max(r, H - r)) / H;
}

function tween(p, to, ms = 200, done) {
  const from = {}; for (const k in to) from[k] = p[k];
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - (1 - k) ** 3;
    for (const key in to) p[key] = from[key] + (to[key] - from[key]) * e;

// ================= 分類籃 =================
function binsFor(m) {
  if (m === "angle") return ["acute", "right", "obtuse"].map((k) => ({ key: k, label: NAME_ANGLE[k], sub: WHY_ANGLE[k] }));
  if (m === "side") return ["equi", "iso", "sca"].map((k) => ({ key: k, label: NAME_SIDE[k], sub: WHY_SIDE[k] }));

}
function buildBins() {

    for (const s of ["iso", "sca"]) {

      for (const a of ["acute", "right", "obtuse"]) {

  }
}
function comboName(s, a) {
  return (s === "iso" ? "等腰" : "不等邊") + NAME_ANGLE[a];
}
function keyOf(p) {
  if (mode === "angle") return p.cat.angle;
  if (mode === "side") return p.cat.side;
  return p.cat.side + "-" + p.cat.angle;
}
function binAt(cx, cy) {
  for (const b of binsEl.querySelectorAll(".bin")) {
    const r = b.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return b;
  }
  return null;
}
function explain(p) {
  if (mode === "angle") return `${WHY_ANGLE[p.cat.angle]}，是<b>${NAME_ANGLE[p.cat.angle]}</b>`;
  if (mode === "side") return `${WHY_SIDE[p.cat.side]}，是<b>${NAME_SIDE[p.cat.side]}</b>`;

}
function addMini(bin, p) {
  const vs = p.v;
  const xs = vs.map((q) => q[0] * p.s), ys = vs.map((q) => q[1]);
  const pad = 0.08;
  const minx = Math.min(...xs) - pad, maxx = Math.max(...xs) + pad, miny = Math.min(...ys) - pad, maxy = Math.max(...ys) + pad;
  const pts = vs.map((q) => `${(q[0] * p.s).toFixed(3)},${q[1].toFixed(3)}`).join(" ");
  const box = bin.querySelector(".minis");
  box.insertAdjacentHTML("beforeend",
    `<svg viewBox="${minx} ${miny} ${maxx - minx} ${maxy - miny}"><polygon points="${pts}" fill="${p.color}" stroke="#5d4037" stroke-width="0.05" stroke-linejoin="round"/></svg>`);

// ================= 判斷 =================
function congruent(a, b) {
  const x = sortNum(a.sides), y = sortNum(b.sides);
  return x.every((v, i) => Math.abs(v - y[i]) < 0.02 * Math.max(x[2], y[2]));
}
// 疊得多準：只看「對應頂點」（對應的角要一樣大），回傳頂點最大誤差（px）和方向差（度）。
// 不等邊三角形翻面不對時，對應頂點不可能重疊，所以一定要翻面才能疊合；
// 等腰、正三角形左右對稱，翻不翻面都一樣，本來就能疊合。
// centered：先把兩個的中心重合，只比較方向
function alignInfo(a, b, centered) {
  let wa = worldVerts(a);
  const wb = worldVerts(b);
  if (centered) {
    const dx = (b.nx - a.nx) * W, dy = (b.ny - a.ny) * H;
    wa = wa.map(([x, y]) => [x + dx, y + dy]);
  }
  let best = { err: Infinity, rot: 180 };
  for (const pm of PERMS) {
    if (!pm.every((j, i) => Math.abs(a.ang[i] - b.ang[j]) < 0.5)) continue;
    const err = Math.max(...pm.map((j, i) => dist(wa[i], wb[j])));
    if (err >= best.err) continue;
    const ea = Math.atan2(wa[1][1] - wa[0][1], wa[1][0] - wa[0][0]);
    const eb = Math.atan2(wb[pm[1]][1] - wb[pm[0]][1], wb[pm[1]][0] - wb[pm[0]][0]);
    let rot = Math.abs(ea - eb) * 180 / Math.PI % 360;

}

}
function nearestFree(p) {
  let best = null, bd = Infinity;
  for (const q of pieces) {
    if (q === p || q.state !== "free") continue;
    const d = Math.hypot((q.nx - p.nx) * W, (q.ny - p.ny) * H);
    if (d < 0.6 * Math.max(lenPx(p), lenPx(q)) && d < bd) { bd = d; best = q; }
  }
  return best;
}

function checkDrop(p, quiet) {
  if (mode === "pick") return pickDrop(p, quiet);   // 挑戰關的找全等
  if (mode === "corr") return corrStack(p, quiet);   // 找對應的第 1 步：疊疊看
  if (direct || mode === "corr") return;   // 這些關卡不用疊合
  const t = nearestFree(p);
  if (!t) return;
  if (congruent(p, t)) {
    // 要對得很齊才算疊合
    if (isAligned(p, t)) return doMatch(p, t);
    if (isAligned(p, t, true)) say("方向對了！再移動一點，讓三個角剛好疊在一起。");
    else if (!quiet) say("這兩個大小、形狀都一樣。<br>再<b>轉一轉</b>或<b>翻面</b>，讓它們對齊。");
    return;
  }
  if (quiet) return;
  // 只是放在旁邊（沒有真的疊上去）不算錯：以前移開三角形時剛好靠近別的也被扣，老師覺得錯誤次數算錯了
  const dd = Math.hypot((t.nx - p.nx) * W, (t.ny - p.ny) * H);
  if (dd > 0.35 * Math.max(lenPx(p), lenPx(t))) return;
  loseHeart();
  const msg = sameAngles(p.ang, t.ang)
    ? "再比比看：這兩個三角形的<b>大小</b>一樣嗎？"
    : "再比比看：這兩個三角形的<b>形狀</b>一樣嗎？";
  say(msg, "think");
  flash(p, "shake", 400);

}

// 疊錯了：把 p 從 t 上面輕輕推開
function pushAway(p, t) {
  let dx = (p.nx - t.nx) * W, dy = (p.ny - t.ny) * H;
  if (Math.hypot(dx, dy) < 1) { dx = 1; dy = 0; }
  const d = norm([dx, dy]), push = 0.75 * Math.max(lenPx(p), lenPx(t));
  const target = { nx: p.nx + d[0] * push / W, ny: p.ny + d[1] * push / H };
  const tmp = { ...p, ...target }; clampIn(tmp);

// ================= 第 4 關：找對應 =================
// 兩個全等的不等邊三角形：題目 A B C 固定不動（淺灰色、粗框），彩色的 D E F 可以拖、轉、翻。

  const [a, b] = pieces, at = guidePoint(a, g.kind, g.i), bt = guidePoint(b, g.kind, corr.map[g.i]);
  setGuideFlash(true, false);
  say(`看小手指：在題目的${w}上點 <b>${g.n}</b> 下，<br>畫 ${g.n} 條${g.kind === "s" ? "短線" : "弧線"}。`);
  drawFinger(at, false);
  let n = 0;
  const tapOnce = () => {
    if (!live()) return;
    drawFinger(at, true);
    addMark(a, g.kind, g.i);
    setGuideFlash(true, false);
    if (++n < g.n) { setTimeout(() => { if (live()) drawFinger(at, false); }, 700); setTimeout(tapOnce, 1800); return; }
    setTimeout(() => {
      if (!live()) return;
      setGuideFlash(true, true);
      say(`這兩個一閃一閃的${w}是一組<b>對應${w}</b>，<br>要畫一樣多條。`);
      const path = [bt, at, bt];   // 來回兩次：A→B→A→B
      let k = 0, from = at;
      const step = () => {
        if (!live()) return;
        if (k >= path.length) {
          setGuideFlash(false, true);
          drawFinger(bt, false, true);
          say(`換你：在另一個三角形一閃一閃的${w}上，<br>也點 <b>${g.n}</b> 下。`);
          G.turn = true;
          return;
        }
        const to = path[k++];
        moveFinger(from, to, 900, () => { from = to; setTimeout(step, 500); });
      };
      setTimeout(step, 800);
    }, 1500);
  };
  setTimeout(tapOnce, 2200);
}
// 小手指從一個地方慢慢移到另一個地方
function moveFinger(from, to, ms, done) {
  const t0 = performance.now(), tok = pageToken;
  const f = (t) => {
    if (tok !== pageToken) return;
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    drawFinger([from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e], false);
    if (k < 1) requestAnimationFrame(f); else done && done();
  };
  requestAnimationFrame(f);
}
// 學生在教學時點三角形：只接受一閃一閃的那個邊或角
function guideTap(p, pt) {
  const G = corr.guide, g = guideStep();
  if (!G.turn) return;
  const [a, b] = pieces, h = markHit(p, pt);
  const want = p === b ? corr.map[g.i] : g.i;
  const ok = h && h.kind === g.kind && h.i === want && (p === b || !g.demo);
  if (!ok) { say(`點<b>一閃一閃</b>的那個${GUIDE_WORD[g.kind]}。`); return; }
  addMark(p, g.kind, want);
  $("#guide").innerHTML = "";   // 學生點了，小手指才離開
  const arr = (q) => (q.um ? (g.kind === "s" ? q.um.s : q.um.a) : [0, 0, 0]);
  const ca = arr(a)[g.i], cb = arr(b)[corr.map[g.i]];
  setGuideFlash(!g.demo, true);
  if (g.demo) {
    if (cb === g.n) { G.turn = false; say("對了！兩個三角形畫一樣多條。", "good"); catBounce(); setTimeout(nextGuide, 2400); }
    else if (cb === 0) say(`點到第 4 下，記號就不見了。<br>再點 <b>${g.n}</b> 下。`);
    else say(`現在是 ${cb} 條，再點一下。`);
    return;
  }
  // 第三組：兩個三角形都要畫 3 條
  if (ca === 3 && cb === 3) {
    G.turn = false;
    say("對了！這一組畫 <b>3</b> 條。<br>不同組畫不一樣多條，才分得出來。", "good");
    catBounce();
    setTimeout(nextGuide, 3200);
    return;
  }
  if (ca && cb && ca === cb) say(`${ca} 條已經用過了。<br>不同組要畫<b>不一樣多條</b>。`);
  else say(`題目上畫了 ${ca} 條，另一個畫了 ${cb} 條。<br>兩個要畫一樣多條。`);
}
// 跳過教學：清掉閃爍和小手指，直接自己做記號
function skipGuide() {
  corr.step = "busy";
  $("#guide").innerHTML = "";
  for (const p of pieces) p.guide = null;
  renderAll();
  startCorrMark();
}
function endGuide() {
  hideSkip();
  const [a, b] = pieces;
  a.guide = b.guide = null;
  redraw(a); redraw(b);
  showPanel(`<h2>${ico("mark")} 做記號</h2>
    <div class="review one">${markDemoSvg()}</div>
    <p>一組<b>對應邊</b>畫一樣多條<b>短線</b>，<br>一組<b>對應角</b>畫一樣多條<b>弧線</b>。</p>
    <p class="pass-cap oops">點錯了？在同一個地方繼續點，<br>點到記號不見，再重新畫。</p>
    <button class="btn" id="gotItBtn">知道了</button>`, "wide");
  $("#gotItBtn").addEventListener("click", () => { hidePanel(); playing = true; corrMarksDone(); });
}
// 教學圖卡：兩個全等三角形，三組對應邊、三組對應角都畫好記號
function markDemoSvg() {
  const keep = S;
  S = 140;
  const t = makeTri([50, 60, 70], 1);
  const p = { v: t.v, um: { s: [1, 2, 3], a: [1, 2, 3] }, size: 1 };
  const pts = pointsAttr(p), um = userMarksSvg(p);
  S = keep;
  const tri = (col) => `<polygon points="${pts}" fill="${col}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>${um}`;
  return `<svg class="mini-corr" viewBox="-105 -95 450 190"><g>${tri("#eceff1")}</g><g transform="translate(240,0) rotate(150) scale(-1,1)">${tri("#b3e5fc")}</g></svg>`;
}
// 小手指：白色手套、深咖啡色線條（和其他圖示同一種線條），指尖對準要點的地方；點下去時指尖有一圈波紋
function drawFinger(at, tap, wait) {   // wait：停在那裡上下輕輕動，等學生點
  $("#guide").innerHTML = `<g transform="translate(${at[0].toFixed(1)},${at[1].toFixed(1)})">` +
    (tap ? `<circle class="ripple" r="10"/>` : "") +
    `<g class="finger${tap ? " tap" : ""}${wait ? " wait" : ""}"><g transform="translate(-24,-6) scale(3)">${ICONS.finger}</g></g></g>`;
}
// 邊的中點，或角裡面靠近頂點的一點（桌面座標）
function guidePoint(p, kind, i) {
  const w = worldVerts(p);
  if (kind === "s") { const A = w[(i + 1) % 3], B = w[(i + 2) % 3]; return [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]; }
  const P = w[i], u = norm([w[(i + 1) % 3][0] - P[0], w[(i + 1) % 3][1] - P[1]]), v = norm([w[(i + 2) % 3][0] - P[0], w[(i + 2) % 3][1] - P[1]]);
  const d = norm([u[0] + v[0], u[1] + v[1]]);
  return [P[0] + d[0] * 24, P[1] + d[1] * 24];
}

// ---------- 第 2 步（之後）：自己做記號，三組對應邊、三組對應角都要畫 ----------
function startCorrMark() {
  corr.step = "mark";
  setTool("mark", true);
  $("#checkBtn").hidden = false;
  say(corr.still
    ? "最後一組：三角形<b>不能動</b>。<br>比比看邊的長短、角的大小，三組都做記號，再按「檢查」。"
    : "第 2 步　<b>做記號</b><br>三組對應邊、三組對應角都畫上記號，再按「檢查」。");
  playing = true;
  drawHandle();
}
// 檢查每一組：ok（兩邊一樣多條）、bad（畫在不對應的地方，或條數不同）、miss（還沒畫）
function markStatus() {
  const [a, b] = pieces, m = corr.map, inv = [0, 1, 2].map((j) => m.indexOf(j));
  const ua = a.um || { s: [0, 0, 0], a: [0, 0, 0] }, ub = b.um || { s: [0, 0, 0], a: [0, 0, 0] };
  const out = [];
  for (const k of ["s", "a"]) for (let i = 0; i < 3; i++) {
    const ca = ua[k][i], cb = ub[k][m[i]];
    let st = "miss";
    if (ca && ca === cb) st = "ok";
    else if (ca && cb) st = "bad";
    else if (ca && ub[k].some((c, j) => c === ca && inv[j] !== i)) st = "bad";
    else if (cb && ua[k].some((c, j) => c === cb && m[j] !== m[i])) st = "bad";
    out.push({ k, i, st, n: ca || cb });
  }
  return out;
}
function checkCorrMarks() {
  if (!corr || corr.step !== "mark" || !playing) return;
  lastAct = Date.now();
  if (pieces[0].hint || pieces[1].hint) { pieces[0].hint = pieces[1].hint = null; redraw(pieces[0]); redraw(pieces[1]); }
  const st = markStatus();
  if (st.some((x) => x.st === "bad")) {
    loseHeart();
    flash(pieces[1], "shake", 400);
    // 畫錯的那幾組在兩個三角形上一閃一閃（留到下次按「檢查」），並說有幾組錯（老師說以前全錯也只說一組）
    const bad = st.filter((x) => x.st === "bad"), [a, b] = pieces, kd = (x) => (x.k === "s" ? "side" : "angle");
    a.hint = bad.map((x) => ({ kind: kd(x), i: x.i }));
    b.hint = bad.map((x) => ({ kind: kd(x), i: corr.map[x.i] }));
    redraw(a); redraw(b);
    say(`${bad.length === 6 ? "記號再看看" : `有 <b>${bad.length}</b> 組記號再看看`}：<br>一閃一閃的地方，兩邊畫的條數一樣嗎？`, "think");
    return;
  }
  if (st.some((x) => x.st === "miss")) {
    say("還有<b>沒畫</b>的邊或角。<br>三組對應邊、三組對應角都要畫。");
    return;
  }
  // 不同組要畫不一樣多條，才分得出來
  for (const k of ["s", "a"]) {
    const ns = st.filter((x) => x.k === k).map((x) => x.n);
    if (new Set(ns).size < 3) { say(`不同組的${GUIDE_WORD[k]}，要畫<b>不一樣多條</b>：<br>1 條、2 條、3 條。`); return; }
  }
  corrMarksDone();
}
// 記號都對了：開始第 3 步。D E F 轉到新的方向（記號跟著轉）；作答時先不能動，點錯了才可以轉（老師要求）
function corrMarksDone() {
  const b = pieces[1];
  corr.step = "busy";
  $("#checkBtn").hidden = true;
  setTool("mark", false);
  catBounce();
  say("記號都畫對了！<br>對應邊一樣長，對應角一樣大。", "good");
  const tok = pageToken;
  const go = () => { if (tok === pageToken) { corr.step = "ask"; askCorr(); } };
  if (corr.still) { setTimeout(go, 900); return; }   // 最後一組：三角形不動
  // 記號畫對了：馬上轉方向、出題（老師說等太久）
  setTimeout(() => { if (tok === pageToken) tween(b, { r: b.r + 30 * (2 + rand(8)) }, 700, go); }, 300);
}
$("#checkBtn").addEventListener("click", checkCorrMarks);

// 名稱：點 A、邊 AB、角 A（邊 k 是第 k 個頂點對面的邊）
function corrName(p, kind, i) {
  if (kind === "side") return "邊 " + [p.labels[(i + 1) % 3], p.labels[(i + 2) % 3]].sort().join("");
  return (kind === "point" ? "點 " : "角 ") + p.labels[i];
}

// 進度點：第 5 關 3 組 × 3 題、第 4 關 3 輪 × 2 組，取代「第幾組第幾題」的文字
function renderProgress() {
  const el = $("#progress");
  if (challenge) return;   // 挑戰關這裡顯示的是時間
  if (mode === "both" && !direct && l4) {
    const doneNow = pieces.filter((p) => p.state === "done" && !p.distractor).length;
    let html = "";
    for (let r = 0; r < l4Rounds(); r++) {
      html += `<span class="grp">`;
      for (let k = 0; k < 2; k++) {
        const done = r < l4.round || (r === l4.round && k < doneNow);
        const now = r === l4.round && k === doneNow;
        html += `<span class="dot${done ? " done" : now ? " now" : ""}"></span>`;
      }
      html += `</span>`;
    }
    el.innerHTML = html;
    return;
  }
  if (mode !== "corr" || !corr || !corr.qs) { el.innerHTML = ""; return; }
  let html = "";
  for (let r = 0; r < corrRounds(); r++) {
    html += `<span class="grp">`;
    for (let k = 0; k < 3; k++) {
      const done = r < corr.round || (r === corr.round && k < corr.q);
      const now = r === corr.round && k === corr.q && !corr.busy;
      html += `<span class="dot${done ? " done" : now ? " now" : ""}"></span>`;
    }
    html += `</span>`;
  }
  el.innerHTML = html;
}

const CORR_HOW = { point: "點另一個三角形上的<b>字母</b>。", side: "點另一個三角形上的<b>邊</b>。", angle: "點另一個三角形裡的<b>角</b>。" };
const CORR_WRONG_KIND = {
  point: "這一題要找<b>點</b>，請點字母。",
  side: "這一題要找<b>邊</b>，請點一條邊。",
  angle: "這一題要找<b>角</b>，請點虛線圍起來的角。",
};

function askCorr() {
  const q = corr.qs[corr.q], [a, b] = pieces;
  // 每一題開始時清掉上一題的記號，避免干擾
  a.ans = []; b.ans = []; b.hint = null;
  a.ask = q;
  b.angleTap = q.kind === "angle";
  redraw(a); redraw(b);
  renderProgress();
  updateToolButtons();
  say(`找出 <b>${corrName(a, q.kind, q.i)}</b> 的<b>${CORR_WORD[q.kind]}</b>。<br>${CORR_HOW[q.kind]}`);
}

function answerCorr(p, tap) {
  if (pageDone || corr.busy) return;
  const q = corr.qs[corr.q], [a, b] = pieces;
  lastAct = Date.now();
  if (p === a) { say("在<b>另一個三角形</b>上找。"); return; }
  const need = { point: "vtx", side: "side", angle: "ang" }[q.kind];
  if (tap.kind !== need) { say(CORR_WRONG_KIND[q.kind]); return; }
  const want = corr.map[q.i];   // 對應邊就是對應頂點對面的邊
  const A = corrName(a, q.kind, q.i), B = corrName(b, q.kind, tap.i);
  if (tap.i === want) {
    a.ask = null;
    a.ans.push({ kind: q.kind, i: q.i });
    b.ans.push({ kind: q.kind, i: want });
    b.hint = null;
    b.angleTap = false;
    redraw(a); redraw(b);
    if (challenge) { corr.busy = true; chalRight(`對了！${A} 和 ${B} 是${CORR_WORD[q.kind]}。`); return; }
    catBounce();
    corr.q++;
    corr.busy = true;
    renderProgress();
    goodStreak();
    say(`對了！疊合時，${A} 和 <b>${B}</b> 會疊在一起，<br>是${CORR_WORD[q.kind]}。`, "good");
    const more = corr.q < 3, moreRound = corr.round + 1 < corrRounds();
    showNext(more ? "下一題" : moreRound ? "下一組" : "完成", () => {
      corr.busy = false;
      if (more) askCorr();
      else if (moreRound) { corr.round++; startCorrRound(); }
      else finishPage(true);
    });
    return;
  }
  loseHeart();
  flash(b, "shake", 400);
  const why = q.kind === "side" ? `再想一想：${A} 和 ${B} 一樣長嗎？` : q.kind === "angle" ? `再想一想：${A} 和 ${B} 一樣大嗎？` : `再想一想：疊合時，${A} 會疊到哪一點？`;
  // 點錯了：作答時本來不能動，點錯後才可以轉（不能移動），提示轉轉看（老師要求）；最後一組三角形一直不能動
  if (!challenge && !corr.still && b.lock) { b.lock = false; b.noMove = true; updateToolButtons(); }
  // 不說「不是」，請學生看自己做的記號（老師要求）
  say(`${why}<br>看看你<b>做的記號</b>，記號一樣的就是對應的。` + (corr.still ? "" : "也可以<b>轉轉看</b>。"), "think");
}

// ================= 操作：拖曳、旋轉把手、雙指旋轉 =================
const pointers = new Map();
let drag = null, rot = null, gesture = null;
const handleEl = $("#handle");

function localPt(e) {
  const r = board.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function twoAngle() {
  const [a, b] = [...pointers.values()];
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}
function ptrAngle(p, pt) { return Math.atan2(pt.y - p.ny * H, pt.x - p.nx * W) * 180 / Math.PI; }

// 選取的三角形旁邊有一個橘色圓圈，拖著它繞圈就能轉
function drawHandle() {
  const p = selected;
  if (!playing || !p || (p.state !== "free" && p.state !== "pair")) { handleEl.innerHTML = ""; return; }
  const cx = p.nx * W, cy = p.ny * H;
  const off = Math.max(...p.v.map(([x, y]) => Math.hypot(x, y))) * S + 34;
  let a;
  if (rot && rot.p === p) a = rot.ang;
  else a = cy - off > 30 ? -90 : 90;   // 平常在上面，太靠上就放下面
  const rad = a * Math.PI / 180, hx = cx + off * Math.cos(rad), hy = cy + off * Math.sin(rad);
  handleEl.innerHTML =
    `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#ff8f00" stroke-width="3" stroke-dasharray="6 5"/>` +
    `<g data-handle="1" transform="translate(${hx.toFixed(1)},${hy.toFixed(1)})">` +
    `<circle r="40" fill="#000" fill-opacity="0"/>` +
    `<circle r="27" fill="#ff8f00" stroke="#fff" stroke-width="4"/>` +
    `<g class="hico" transform="translate(-14,-14) scale(1.17)">${ICONS.rotR}</g></g>`;
}
function select(p) {
  selected = p;
  for (const q of pieces) if (q.el) q.el.classList.toggle("sel", q === p);
  updateTools();
  drawHandle();
}
function updateTools() {
  const ok = !!selected && (selected.state === "free" || selected.state === "pair");
  for (const id of ["rotL", "rotR", "flip"]) $("#" + id).disabled = !ok;
}

svg.addEventListener("pointerdown", (e) => {
  if (!playing) return;
  const pt = localPt(e);
  // 第二根手指：兩指旋轉選取的三角形（拖圓圈時不算）
  if (pointers.size === 1 && !rot && !gesture && !rdrag && selected && (selected.state === "free" || selected.state === "pair")) {
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, pt);
    if (drag) drag.p.el && drag.p.el.classList.add("dragging");
    gesture = { p: selected, last: twoAngle() };
    drag = null;
    lastAct = Date.now();
    return;
  }
  if (pointers.size) return;   // 再多的手指就不理
  pointers.set(e.pointerId, pt);
  lastAct = Date.now();
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  // 直角尺在最上層：拖本體是移動，拖灰色圓圈是轉動
  if (rulerOn && e.target.closest && e.target.closest("[data-ruler],[data-ruler-knob]")) {
    const knob = !!e.target.closest("[data-ruler-knob]");
    rdrag = { pid: e.pointerId, knob, dx: ruler.x - pt.x, dy: ruler.y - pt.y };
    return;
  }
  if (selected && e.target.closest && e.target.closest("[data-handle]")) {
    const a = ptrAngle(selected, pt);
    rot = { p: selected, pid: e.pointerId, r0: selected.r, last: a, total: 0, ang: a };
    return;
  }
  const g = e.target.closest && e.target.closest("[data-id]");
  const p = g && byId(g.dataset.id);
  if (p) {
    // 找對應的題目三角形固定不動：不能選、不能拖，只能點（作答或做記號）
    select(p.fixed || p.lock ? null : p);
    layer.appendChild(p.el);
    if (!p.fixed && !p.lock && !p.noMove) p.el.classList.add("dragging");
    // 找對應：記下點到的是哪個頂點或哪條邊（沒有拖動才算點一下）
    const hit = e.target.closest && e.target.closest("[data-vtx],[data-side],[data-ang]");
    const tap = hit && (hit.dataset.vtx != null ? { kind: "vtx", i: +hit.dataset.vtx }
      : hit.dataset.ang != null ? { kind: "ang", i: +hit.dataset.ang } : { kind: "side", i: +hit.dataset.side });
    // lift：用手指拖時，三角形稍微浮到手指上方，才不會被手指整個蓋住（滑鼠不用）。老師覺得太高會怪，所以只浮一點點
    const lift = e.pointerType === "touch" ? Math.min(36, lenPx(p) * 0.18 + 12) : 0;
    drag = { p, pid: e.pointerId, dx: p.nx * W - pt.x, dy: p.ny * H - pt.y, x0: pt.x, y0: pt.y, moved: false, tap, lift, tm: 0 };
    if (mode === "tutorial" && p.state === "free") say(TUT_TEXT[tutStep]);
  } else {
    select(null);
  }
});

svg.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const pt = localPt(e);
  pointers.set(e.pointerId, pt);
  if (gesture) {
    if (pointers.size >= 2) {
      const a = twoAngle();
      let d = a - gesture.last;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      gesture.last = a;
      gesture.p.r += d;
      updT(gesture.p);
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const a = ptrAngle(rot.p, pt);
    let d = a - rot.last;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rot.last = a; rot.total += d; rot.ang = a;
    // 每 5° 一格（老師要求從 15° 改成 5°）
    rot.p.r = Math.round((rot.r0 + rot.total) / 5) * 5;
    updT(rot.p);
    drawHandle();
    return;
  }
  if (rdrag && e.pointerId === rdrag.pid) {
    if (rdrag.knob) { turnRulerTo(pt); return; }
    ruler.x = Math.max(0, Math.min(W, pt.x + rdrag.dx));
    ruler.y = Math.max(0, Math.min(H, pt.y + rdrag.dy));
    drawRuler();
    return;
  }
  if (drag && e.pointerId === drag.pid) {
    const p = drag.p;
    if (!drag.moved && Math.hypot(pt.x - drag.x0, pt.y - drag.y0) > 8) { drag.moved = true; drag.tm = performance.now(); }
    if (p.fixed || p.lock || p.noMove) return;   // 題目三角形不動；做記號、作答時不動（作答點錯後只能轉，不能移動）
    // 開始拖了才浮起來，0.15 秒內慢慢升上去；只點一下不會動
    const up = drag.moved ? drag.lift * Math.min(1, (performance.now() - drag.tm) / 150) : 0;
    p.nx = (pt.x + drag.dx) / W;
    p.ny = (pt.y + drag.dy - up) / H;
    if (p.state === "free" && !direct && mode !== "both") clampIn(p);   // 第 1～4 關可以拖到下面的格子，不要被桌面邊緣擋住
    updT(p);
    const over = dropBin(e, p);
    for (const b of binsEl.querySelectorAll(".bin")) b.classList.toggle("over", b === over);
  }
});

// 放到哪一格：看三角形在哪裡（學生看到的是三角形），三角形不在格子上時再看手指
function dropBin(e, p) {
  const r = board.getBoundingClientRect();
  return binAt(r.left + p.nx * W, r.top + p.ny * H) || binAt(e.clientX, e.clientY);
}

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture) {
    if (pointers.size < 2) {
      // 放開後吸附到 5° 的倍數
      const p = gesture.p;
      gesture = null;
      p.el && p.el.classList.remove("dragging");
      lastAct = Date.now();
      tween(p, { r: Math.round(p.r / 5) * 5 }, 120, () => { if (p.state === "free") checkDrop(p, true); });
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const p = rot.p;
    rot = null;
    drawHandle();
    lastAct = Date.now();
    if (p.state === "free") checkDrop(p, true);
    return;
  }
  if (rdrag && e.pointerId === rdrag.pid) {
    rdrag = null;
    lastAct = Date.now();
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const p = drag.p, dragMoved = drag.moved, tap = drag.tap;
  drag = null;
  p.el && p.el.classList.remove("dragging");
  for (const b of binsEl.querySelectorAll(".bin")) b.classList.remove("over");
  // 做記號：點一下（沒有拖動）就在邊或角上畫記號
  if (mode === "corr" && corr && corr.step === "guide") { if (!dragMoved) guideTap(p, localPt(e)); return; }
  if (markOn && !dragMoved && toolAvail("mark") && toggleMark(p, localPt(e))) return;
  if (mode === "corr") {
    if (corr.step === "stack") { if (dragMoved) checkDrop(p, false); }
    else if (corr.step === "ask" && !dragMoved && tap) answerCorr(p, tap);
    return;
  }
  if (mode === "pick") {
    if (dragMoved) pickDrop(p, false);   // 點一下只是選取，疊上去才判斷
    return;
  }
  const bin = dropBin(e, p);
  // 第 1、2 關直接分類；其他關要先疊好一組
  if (p.state === "pair" || (direct && p.state === "free")) {
    if (bin && classify(p, bin)) return;
    const tmp = { ...p }; clampIn(tmp);
    tween(p, { nx: tmp.nx, ny: tmp.ny }, 220);
    return;
  }
  if (!dragMoved) return;
  // 第 4 關：還沒疊合就拖到格子 → 提醒要先疊合，再彈回桌面（不扣愛心，也不會拖不下去卡住）
  const back = { ...p }; clampIn(back);
  if (bin || back.nx !== p.nx || back.ny !== p.ny) {
    if (bin) { say("要先把<b>全等</b>的兩個三角形<b>疊在一起</b>，<br>才能放進格子喔。", "think"); flash(p, "shake", 400); }
    tween(p, { nx: back.nx, ny: back.ny }, 260);
    return;
  }
  checkDrop(p, false);
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

function turn(deg) {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { r: Math.round(p.r / 5) * 5 + deg }, 180, () => { if (p.state === "free") checkDrop(p, true); });
}
$("#rotL").addEventListener("click", () => turn(-15));
$("#rotR").addEventListener("click", () => turn(15));
$("#flip").addEventListener("click", () => {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { s: -Math.sign(p.s || 1) }, 260, () => { if (p.state === "free") checkDrop(p, true); });
});

// ================= 工具：直角尺、做記號 =================
// 按鈕依需要放（2026-11-06 老師要求，兩種模式一樣）：
//   左轉、右轉、翻面：要疊合的關卡（練習、找對應、第 5 關、挑戰關的找全等）。第 1～3 關只要拖進格子，不放。
//   直角尺：和角有關的關卡（以角分類、以邊和角分類、第 5 關，含挑戰關的這些題目）。只給學生自己量，遊戲不判斷。
//   做記號：只在找對應。
function toolAvail(name) {
  if (name === "turn") return mode === "tutorial" || mode === "pick" || (mode === "both" && !direct)
    || (mode === "corr" && !!corr && (challenge || corr.step === "stack" || (corr.step === "ask" && !!pieces[1] && !!pieces[1].noMove)));   // 找對應：疊疊看時，和作答點錯後才要轉
  if (name === "ruler") return mode === "angle" || mode === "both";
  if (name === "mark") return mode === "corr";
  return false;
}
function updateToolButtons() {
  for (const [name, id, on] of [["ruler", "#rulerBtn", rulerOn], ["mark", "#markBtn", markOn]]) {
    $(id).hidden = !toolAvail(name);
    $(id).classList.toggle("on", on);
  }
  for (const id of ["#rotL", "#rotR", "#flip"]) $(id).hidden = !toolAvail("turn");
  fitTools();
}
// 桌面比較矮時（例如平板橫放、瀏覽器網址列佔掉高度），工具列的按鈕跟著變矮，才不會撞到上面的按鈕和下面的格子
function fitTools() {
  const btns = [...document.querySelectorAll("#tools button")].filter((b) => !b.hidden);
  const h = board.clientHeight - 8, n = btns.length || 1;
  const bh = Math.max(36, Math.min(60, Math.floor((h - 6 * (n - 1)) / n)));
  $("#tools").classList.toggle("tight", bh < 50);
  for (const b of btns) b.style.height = bh + "px";
}
function setTool(name, on) {

    if (on) placeRuler();
    drawRuler();
  } else markOn = on;
  updateToolButtons();
}
$("#rulerBtn").addEventListener("click", () => {
  if (!playing) return;
  lastAct = Date.now();
  setTool("ruler", !rulerOn);
  if (rulerOn) say("把<b>直角尺</b>移到角上量量看。<br>拖<b>灰色圓圈</b>可以轉直角尺。");
});
$("#markBtn").addEventListener("click", () => {
  if (!playing) return;
  lastAct = Date.now();
  setTool("mark", !markOn);
  if (markOn && !(mode === "corr" && corr && corr.step === "mark")) {
    say("點<b>邊</b>畫短線，點<b>角</b>畫弧線。<br>多點幾下會變 2 條、3 條，再點就不見。");
  }
});

// ---------- 直角尺 ----------
// 學生自己移動、自己轉（老師要求：不要自動對準，也可以移動三角形去對直角尺，順便複習量角）。
// 拖直角尺本體是移動；拖尾端的灰色圓圈是以直角的頂點為中心轉動，每 5° 一格。
let ruler = { x: 0, y: 0, a: 0, m: -1 }, rdrag = null;
const rulerEl = $("#ruler");
function rulerLen() { return Math.max(90, S * 0.7); }
const RULER_W = 24, KNOB_GAP = 30;
function placeRuler() {
  // 一開始放在桌面左下角，兩條邊往右、往上
  ruler = { x: 24, y: H - 24, a: 0, m: -1 };
}
function rulerPt(a, b) {
  const rad = ruler.a * Math.PI / 180, u = [Math.cos(rad), Math.sin(rad)], v = [-u[1] * ruler.m, u[0] * ruler.m];
  return [ruler.x + u[0] * a + v[0] * b, ruler.y + u[1] * a + v[1] * b];
}
function drawRuler() {
  if (!rulerOn) { rulerEl.innerHTML = ""; return; }
  const L = rulerLen(), wd = RULER_W;
  const P = (a, b) => rulerPt(a, b).map((n) => n.toFixed(1)).join(",");
  const [kx, ky] = rulerPt(L + KNOB_GAP, wd / 2), [ex, ey] = rulerPt(L, wd / 2);
  rulerEl.innerHTML =
    `<polygon class="rl-body" data-ruler="1" points="${P(0, 0)} ${P(L, 0)} ${P(L, wd)} ${P(wd, wd)} ${P(wd, L)} ${P(0, L)}"/>` +
    `<line class="rl-arm" x1="${ruler.x}" y1="${ruler.y}" x2="${P(L, 0).split(",")[0]}" y2="${P(L, 0).split(",")[1]}"/>` +
    `<line class="rl-arm" x1="${ruler.x}" y1="${ruler.y}" x2="${P(0, L).split(",")[0]}" y2="${P(0, L).split(",")[1]}"/>` +
    `<path class="rl-sq" d="M${P(14, 0)} L${P(14, 14)} L${P(0, 14)}"/>` +
    `<line x1="${ex.toFixed(1)}" y1="${ey.toFixed(1)}" x2="${kx.toFixed(1)}" y2="${ky.toFixed(1)}" stroke="#455a64" stroke-width="3" stroke-dasharray="5 4" pointer-events="none"/>` +
    `<g class="rl-knob" data-ruler-knob="1" transform="translate(${kx.toFixed(1)},${ky.toFixed(1)})">` +
    `<circle r="34" fill="#000" fill-opacity="0"/><circle class="k" r="20"/>` +
    `<g transform="translate(-11,-11) scale(.92)">${ICONS.rotR}</g></g>`;
}
// 拖灰色圓圈時：直角尺轉到手指的方向（扣掉圓圈本來偏的一點角度），每 5° 一格
function turnRulerTo(pt) {
  const off = Math.atan2(RULER_W / 2 * ruler.m, rulerLen() + KNOB_GAP) * 180 / Math.PI;
  const a = Math.atan2(pt.y - ruler.y, pt.x - ruler.x) * 180 / Math.PI - off;
  ruler.a = Math.round(a / 5) * 5;
  drawRuler();
}
// 直角尺拉回桌面內（轉方向、放大縮小時）
function keepRulerIn() { ruler.x = Math.max(0, Math.min(W, ruler.x)); ruler.y = Math.max(0, Math.min(H, ruler.y)); }

// ---------- 學習模式第 2 關：先教直角尺怎麼用（老師要求） ----------
// 直角尺依序移到直角、銳角、鈍角上，每一步學生（或老師）按「下一步」才繼續。
// 直角尺對準 p 的第 i 個頂點：直角的頂點放在三角形的頂點，一條邊貼著三角形的一條邊，另一條邊朝三角形那一側
function rulerTarget(p, i) {
  const w = worldVerts(p), P = w[i], j1 = (i + 1) % 3, j2 = (i + 2) % 3;
  const u = norm([w[j1][0] - P[0], w[j1][1] - P[1]]), d2 = [w[j2][0] - P[0], w[j2][1] - P[1]];
  return { x: P[0], y: P[1], a: Math.atan2(u[1], u[0]) * 180 / Math.PI, m: -u[1] * d2[0] + u[0] * d2[1] >= 0 ? 1 : -1 };
}
function moveRuler(to, ms, done) {
  const from = { ...ruler };
  let da = (to.a - from.a) % 360;
  if (da > 180) da -= 360; if (da < -180) da += 360;
  ruler.m = to.m;
  const t0 = performance.now(), tok = pageToken;
  const step = (t) => {
    if (tok !== pageToken || !rulerOn) return;
    const k = Math.min(1, (t - t0) / ms), e = 1 - (1 - k) ** 3;
    ruler.x = from.x + (to.x - from.x) * e;
    ruler.y = from.y + (to.y - from.y) * e;
    ruler.a = from.a + da * e;
    drawRuler();
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  };
  requestAnimationFrame(step);
}
function startRulerDemo() {
  const byCat = (c) => pieces.find((p) => p.cat.angle === c);
  const big = (p) => p.ang.indexOf(Math.max(...p.ang));   // 最大的角
  const right = byCat("right"), acute = byCat("acute"), obtuse = byCat("obtuse");
  if (!right || !acute || !obtuse) return;
  const steps = [
    [right, big(right), "量<b>直角</b>：另一條邊<b>剛好貼齊</b>直角尺。"],
    [acute, big(acute), "量<b>銳角</b>：另一條邊在直角尺<b>裡面</b>，<br>比直角小。"],
    [obtuse, big(obtuse), "量<b>鈍角</b>：另一條邊跑到直角尺<b>外面</b>，<br>比直角大。"],
  ];
  playing = false;
  drawHandle();
  setTool("ruler", true);
  say("先學怎麼用<b>直角尺</b>。<br>直角尺的角是<b>直角</b>，可以用來量角。");
  const go = (k) => {
    if (over) return;
    if (k >= steps.length) {
      over = true;
      hideSkip();
      placeRuler();
      drawRuler();
      playing = true;
      lastAct = Date.now();
      say("換你：用<b>直角尺</b>量量看，拖<b>灰色圓圈</b>可以轉。<br>再把三角形拖到格子裡。");
      return;
    }
    const [p, i, text] = steps[k];
    layer.appendChild(p.el);
    flash(p, "pulse", 2800);
    moveRuler(rulerTarget(p, i), 1200, () => { say(text); showNext(k === steps.length - 1 ? "換我試試" : "下一步", () => go(k + 1)); });
  };
  let over = false;
  showSkip(() => go(steps.length));
  showNext("下一步", () => go(0));
}

// ---------- 做記號 ----------
// 點一下邊加短線、點一下角加弧線（1 → 2 → 3 → 沒有）。記號存在三角形上（p.um），跟著三角形移動、旋轉
function localOf(p, pt) {   // 桌面座標 → 三角形自己的座標（還沒乘 S）
  const dx = pt.x - p.nx * W, dy = pt.y - p.ny * H, r = -p.r * Math.PI / 180;
  const x = dx * Math.cos(r) - dy * Math.sin(r), y = dx * Math.sin(r) + dy * Math.cos(r);
  return [x / (p.s || 1) / S, y / S];
}
function insideTri(P, v) {
  const sg = (a, b, c) => (a[0] - c[0]) * (b[1] - c[1]) - (b[0] - c[0]) * (a[1] - c[1]);
  const d1 = sg(P, v[0], v[1]), d2 = sg(P, v[1], v[2]), d3 = sg(P, v[2], v[0]);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}
function segDist(P, A, B) {
  const ab = [B[0] - A[0], B[1] - A[1]];
  const t = Math.max(0, Math.min(1, ((P[0] - A[0]) * ab[0] + (P[1] - A[1]) * ab[1]) / (ab[0] ** 2 + ab[1] ** 2)));
  return Math.hypot(P[0] - A[0] - ab[0] * t, P[1] - A[1] - ab[1] * t);
}
// 點到哪裡：點在三角形裡面、靠近頂點 → 角；不然看最近的邊（30px 內）。回傳 { kind: "s" 或 "a", i }
function markHit(p, pt) {
  const q = localOf(p, pt), P = [q[0] * S, q[1] * S], v = p.v.map(([x, y]) => [x * S, y * S]);
  // 先看是不是點在邊上（20px 內）：老師說想點邊常常點到角，所以邊優先；角只算三角形裡面、靠近頂點、又離邊有一段距離的地方
  let side = null;
  for (let s = 0; s < 3; s++) {
    const d = segDist(P, v[(s + 1) % 3], v[(s + 2) % 3]);
    if (d < 30 && (!side || d < side.d)) side = { kind: "s", i: s, d };
  }
  const kA = Math.max(30, lenPx(p) * 0.22);
  let ang = null;
  if (insideTri(P, v)) v.forEach((V, i) => { const d = dist(P, V); if (d < kA && (!ang || d < ang.d)) ang = { kind: "a", i, d }; });
  if (ang && ang.d < kA * 0.85) return ang;   // 很靠近頂點：角（尖角離邊很近，也要點得到）
  if (side && (side.d < 12 || !ang)) return side;
  return ang || side;
}
function addMark(p, kind, i) {
  if (!p.um) p.um = { s: [0, 0, 0], a: [0, 0, 0] };
  const arr = kind === "a" ? p.um.a : p.um.s;
  arr[i] = (arr[i] + 1) % 4;
  redraw(p);
  lastAct = Date.now();
}
function toggleMark(p, pt) {
  const h = markHit(p, pt);
  if (!h) return false;
  addMark(p, h.kind, h.i);
  return true;
}
// 弧線（不畫到頂點的那兩條半徑）
function arcLine(v, i, k) {
  const P = v[i], Q = v[(i + 1) % 3], R = v[(i + 2) % 3];
  const u = norm([Q[0] - P[0], Q[1] - P[1]]), w = norm([R[0] - P[0], R[1] - P[1]]);
  const cross = u[0] * w[1] - u[1] * w[0];
  return `M${P[0] + u[0] * k},${P[1] + u[1] * k} A${k},${k} 0 0 ${cross > 0 ? 1 : 0} ${P[0] + w[0] * k},${P[1] + w[1] * k}`;
}
function userMarksSvg(p) {
  if (!p.um) return "";
  const v = p.v.map(([x, y]) => [x * S, y * S]);
  let out = "";
  for (let s = 0; s < 3; s++) {
    const n = p.um.s[s];
    if (!n) continue;
    const A = v[(s + 1) % 3], B = v[(s + 2) % 3], d = norm([B[0] - A[0], B[1] - A[1]]), nr = [-d[1], d[0]];
    for (let j = 0; j < n; j++) {
      const off = (j - (n - 1) / 2) * 8, c = [(A[0] + B[0]) / 2 + d[0] * off, (A[1] + B[1]) / 2 + d[1] * off];
      out += `<line x1="${c[0] - nr[0] * 10}" y1="${c[1] - nr[1] * 10}" x2="${c[0] + nr[0] * 10}" y2="${c[1] + nr[1] * 10}"/>`;
    }
  }
  for (let i = 0; i < 3; i++) for (let j = 0; j < p.um.a[i]; j++) out += `<path d="${arcLine(v, i, 22 + j * 7)}"/>`;
  return `<g class="um">${out}</g>`;
}

// ---------- 放大縮小 ----------
// 兩種模式都有。倍率存在這台平板上，下次打開也一樣
const ZOOMS = [0.8, 0.9, 1, 1.12, 1.25];
let zoomIdx = 2;
try { const z = +localStorage.getItem("triangle-zoom"); if (z >= 0 && z < ZOOMS.length && localStorage.getItem("triangle-zoom") !== null) zoomIdx = z; } catch (_) {}
function setZoom(d) {
  zoomIdx = Math.max(0, Math.min(ZOOMS.length - 1, zoomIdx + d));
  try { localStorage.setItem("triangle-zoom", zoomIdx); } catch (_) {}
  if (!pieces.length) return;
  measure();
  for (const p of pieces) if (p.state === "free" || p.state === "pair") fitIn(p, mode === "corr" ? 52 : 10, mode === "corr" ? 96 : challenge ? 50 : 10);
  renderAll();
  keepRulerIn();

}
$("#zoomIn").addEventListener("click", () => setZoom(1));

// ================= 提示 =================
// 按燈泡先看「複習小卡」（只複習觀念，不給答案）；真的不會，每關可以讓答案閃一次（HINT_FLASHES）。
// 老師擔心直接閃答案會讓學生一直按提示，所以練習以外都改成這樣。
const HINT_FLASHES = 1;
let hintsLeft = HINT_FLASHES, nudged = false;
function giveHint() {
  if (!playing || pageDone) return;
  lastAct = Date.now();
  if (challenge) { say("挑戰關不能用提示，加油！"); return; }
  if (mode === "tutorial") return flashHint();   // 練習不限次數
  showHintCard();
}
function showHintCard() {
  const left = learn ? `<button class="btn ghost" id="flashBtn">讓答案閃一下</button>`   // 學習模式不限次數
    : hintsLeft > 0
    ? `<button class="btn ghost" id="flashBtn">讓答案閃一下（剩 ${hintsLeft} 次）</button>`
    : `<p class="note">這一關「讓答案閃一下」已經用完了。</p>`;
  showPanel(`<div class="big-cat">${ico("bulb")}</div><h2>提示：複習一下</h2>${reviewBody()}
    <button class="btn" id="backBtn">回去作答</button>${left}`, "wide");
  const back = () => { hidePanel(); playing = true; lastAct = Date.now(); drawHandle(); };
  $("#backBtn").addEventListener("click", back);
  const f = $("#flashBtn");
  if (f) f.addEventListener("click", () => { if (!learn) hintsLeft--; back(); flashHint(); });
}
// 讓答案閃一下
function flashHint() {
  if (!playing || pageDone) return;
  lastAct = Date.now();
  if (mode === "corr" && corr.step === "stack") {
    const b = pieces[1];
    layer.appendChild(b.el);
    flash(b, "pulse", 4300);
    say("把一閃一閃的三角形<b>轉一轉、翻一翻</b>，<br>再拖到題目上。");
    catBounce();
    return;
  }
  if (mode === "corr" && corr.step === "guide") {
    say("跟著做：在<b>一閃一閃</b>的地方點。");
    return;
  }
  if (mode === "corr" && corr.step === "mark") {
    // 只閃還沒畫對的那一組（老師說閃已經畫對的地方會干擾）
    const [a, b] = pieces, st = markStatus();
    const x = st.find((s) => s.st === "bad") || st.find((s) => s.st === "miss") || st[0];
    const kind = x.k === "s" ? "side" : "angle";
    a.hint = { kind, i: x.i }; b.hint = { kind, i: corr.map[x.i] };
    redraw(a); redraw(b);
    // 提示的記號留著，到下次按「檢查」才拿掉（老師要求）
    say(`一閃一閃的是一組<b>對應${GUIDE_WORD[x.k]}</b>，<br>畫一樣多條。`);
    catBounce();
    return;
  }
  if (mode === "corr") {
    if (corr.busy || corr.step !== "ask") return;
    const q = corr.qs[corr.q], b = pieces[1];
    b.hint = { kind: q.kind, i: corr.map[q.i] };
    redraw(b);
    // 提示的記號留著，答對才拿掉（老師要求）
    say("答案在<b>一閃一閃</b>的地方。");
    catBounce();
    return;
  }
  if (direct) {
    const p = selected && selected.state === "free" ? selected : pieces.find((q) => q.state === "free");
    if (!p) return;
    layer.appendChild(p.el);
    flash(p, "pulse", 4300);
    say(classifyHint(p, "一閃一閃的三角形"));
    catBounce();
    return;
  }
  const free = pieces.filter((p) => p.state === "free" && !p.distractor);
  // 有選取的三角形就優先找它的全等朋友
  if (selected && free.includes(selected)) free.unshift(...free.splice(free.indexOf(selected), 1));
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) {
    if (congruent(free[i], free[j])) {
      // 拿到最上層，才不會被別的三角形蓋住
      layer.appendChild(free[j].el); layer.appendChild(free[i].el);
      flash(free[i], "pulse", 4300); flash(free[j], "pulse", 4300);
      say(mode === "tutorial" ? TUT_TEXT[tutStep] : "一閃一閃的兩個三角形<b>全等</b>。<br>把一個拖到另一個上面，疊疊看。");
      catBounce();
      return;
    }
  }
  const pair = pieces.find((p) => p.state === "pair");
  if (pair) {
    layer.appendChild(pair.el);
    flash(pair, "pulse", 4300);
    say(classifyHint(pair, "一閃一閃這一組"));
    catBounce();
  }
}
// 分類題的提示：邊 → 畫出一樣長的邊；角 → 請學生用直角尺量量看（不直接說什麼顏色是什麼角，老師要求）
function classifyHint(p, who) {
  const side = mode === "side" || mode === "both", ang = mode === "angle" || mode === "both";
  if (side) showMarks(p, "side", 600000);   // 提示的記號留著，不要閃完就消失（老師要求）
  if (ang && toolAvail("ruler") && !rulerOn) setTool("ruler", true);
  if (side && ang) return `${who}：有幾條邊一樣長？<br>再用<b>直角尺</b>量量看它的角。`;
  if (side) return `${who}：<br>有幾條邊一樣長？`;
  return `用<b>直角尺</b>量量看${who}的角，<br>和直角比，是比較小、一樣，還是比較大？`;
}

// 30 秒沒有動作：練習直接閃提示；其他關卡只提醒可以按燈泡看複習小卡（不自動給答案）
setInterval(() => {
  if (!playing || pageDone || challenge) return;
  const idle = Date.now() - lastAct;
  // 做記號（教學、自己畫）：15 秒沒動作，直接告訴學生怎麼點（老師說一直停在「需要幫忙嗎」，看了燈泡也不會）
  if (mode === "corr" && corr && (corr.step === "guide" || corr.step === "mark") && idle > 15000) {
    lastAct = Date.now();
    if (corr.step === "guide" && corr.guide && corr.guide.turn) {
      const g = guideStep(), w = GUIDE_WORD[g.kind];
      say(`在<b>一閃一閃</b>的${w}上點 <b>${g.n}</b> 下，<br>每點一下，多一條${g.kind === "s" ? "短線" : "弧線"}。`);
    } else say("點一下<b>邊</b>，會畫一條<b>短線</b>；點一下<b>角</b>，會畫一條<b>弧線</b>。<br>多點幾下，會變 2 條、3 條。");
    return;
  }
  if (idle < 30000) return;
  lastAct = Date.now();
  if (mode === "tutorial") flashHint();
  else if (!nudged) { nudged = true; say("需要幫忙嗎？<br>按右上角的燈泡，可以看複習小卡。"); }
}, 1000);

function say(html, tone) {
  $("#sayText").innerHTML = html;   // 對話框右下角的按鈕（#sayAct）不會被蓋掉
  $("#say").className = tone || "";
  fitSay();
