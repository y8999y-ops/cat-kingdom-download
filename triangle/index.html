  p.markTimer = setTimeout(() => { p.marks = null; redraw(p); }, ms);
}

// ================= 第 4 關：找對應 =================
// 兩個全等的不等邊三角形，左邊（或上面）標 A B C，另一個標 D E F。
// 每組問 3 題：對應點、對應邊、對應角；學生可以拖、轉、翻，疊上去比比看。
const CORR_ROUNDS = 3;
const CORR_LETTERS = [["A", "B", "C"], ["D", "E", "F"]];
const CORR_COL = { point: "#d81b60", side: "#1e88e5", angle: "#43a047" };
const CORR_WORD = { point: "對應點", side: "對應邊", angle: "對應角" };

function startCorrRound() {
  const angles = pick(LIB[["sca-acute", "sca-right", "sca-obtuse"][corr.round % 3]]);
  const availW = Math.max(100, W - TOOL_W);
  const wide = availW > H;
  grid = wide ? { cols: 2, rows: 1 } : { cols: 1, rows: 2 };
  measure();
  const colors = shuffle([...COLORS]);
  // 兩個用同一份形狀（只差旋轉 30° 的倍數和翻面），學生才轉得到一樣的方向；
  // 以前各自 makeTri，底邊不同，相差的角度不是 15° 的倍數，怎麼轉都對不齊。
  // D E F 隨機放在頂點上，對應關係才不會每次都是 A↔D、B↔E、C↔F。
  const t = makeTri(angles, 1.0);
  pieces = [0, 1].map((k) => ({
    id: "c" + k, v: t.v.map((q) => [...q]), ang: t.ang, sides: t.sides, size: 1.0, cat: categorize(t.ang),
    distractor: false, reason: "", state: "free", partner: null, marks: null,
    nx: (wide ? (k + 0.5) * availW / 2 : availW / 2) / W, ny: wide ? 0.5 : (k + 0.5) / 2,
    r: 30 * rand(12), s: k === 1 && Math.random() < 0.5 ? -1 : 1,
    color: colors[k], labels: k === 0 ? CORR_LETTERS[0] : shuffle([...CORR_LETTERS[1]]), ans: [], ask: null, hint: null,
  }));
  const [a, b] = pieces;
  if (a.s === b.s && a.r === b.r) b.r += 90;
  for (const p of pieces) fitIn(p, 52, 96);   // 頂點字母在三角形外面約 50px；上面再留給進度點或挑戰關的時間條
  // 對應頂點：角一樣大的那個（不等邊三角形只有一個）
  corr.map = [0, 1, 2].map((i) => [0, 1, 2].find((j) => Math.abs(a.ang[i] - b.ang[j]) < 0.5));
  const [v1, v2] = shuffle([0, 1, 2]);
  corr.qs = shuffle([{ kind: "point", i: v1 }, { kind: "side", i: rand(3) }, { kind: "angle", i: v2 }]);
  if (challenge) corr.qs = corr.qs.slice(0, 1);   // 挑戰關每次只問一題
  corr.q = 0;
  corr.busy = false;
  selected = null;
  renderAll();
  updateTools();
  askCorr();
}

// 名稱：點 A、邊 AB、角 A（邊 k 是第 k 個頂點對面的邊）
function corrName(p, kind, i) {
  if (kind === "side") return "邊 " + [p.labels[(i + 1) % 3], p.labels[(i + 2) % 3]].sort().join("");
  return (kind === "point" ? "點 " : "角 ") + p.labels[i];
}

// 進度點：第 5 關 3 組 × 3 題、第 4 關 3 輪 × 2 組，取代「第幾組第幾題」的文字
function renderProgress() {
  const el = $("#progress");
  if (challenge) return;   // 挑戰關這裡顯示的是時間
  if (mode === "both" && !direct && l4) {
    const doneNow = pieces.filter((p) => p.state === "done" && !p.distractor).length;
    let html = "";
    for (let r = 0; r < L4_ROUNDS; r++) {
      html += `<span class="grp">`;
      for (let k = 0; k < 2; k++) {
        const done = r < l4.round || (r === l4.round && k < doneNow);
        const now = r === l4.round && k === doneNow;
        html += `<span class="dot${done ? " done" : now ? " now" : ""}"></span>`;
      }
      html += `</span>`;
    }
    el.innerHTML = html;
    return;
  }
  if (mode !== "corr" || !corr || !corr.qs) { el.innerHTML = ""; return; }
  let html = "";
  for (let r = 0; r < CORR_ROUNDS; r++) {
    html += `<span class="grp">`;
    for (let k = 0; k < 3; k++) {
      const done = r < corr.round || (r === corr.round && k < corr.q);
      const now = r === corr.round && k === corr.q && !corr.busy;
      html += `<span class="dot${done ? " done" : now ? " now" : ""}"></span>`;
    }
    html += `</span>`;
  }
  el.innerHTML = html;
}

const CORR_HOW = { point: "點一下另一個三角形上的<b>點</b>。", side: "點一下另一個三角形上的<b>邊</b>。", angle: "點一下另一個三角形裡的<b>角</b>。" };
const CORR_WRONG_KIND = {
  point: "這一題要找<b>點</b>：點一下頂點旁邊的字母。",
  side: "這一題要找<b>邊</b>：點一下三角形的一條邊。",
  angle: "這一題要找<b>角</b>：點一下三角形裡面虛線圍起來的角。",
};

function askCorr() {
  const q = corr.qs[corr.q], [a, b] = pieces;
  // 每一題開始時清掉上一題的記號，避免干擾
  a.ans = []; b.ans = []; b.hint = null;
  a.ask = q;
  b.angleTap = q.kind === "angle";
  redraw(a); redraw(b);
  renderProgress();
  // 每組第一題先說明這兩個三角形全等
  const intro = corr.q === 0 ? "這兩個三角形是<b>全等三角形</b>。<br>" : "";
  say(`${intro}找出 <b>${corrName(a, q.kind, q.i)}</b> 的<b>${CORR_WORD[q.kind]}</b>，${CORR_HOW[q.kind]}`);
}

function answerCorr(p, tap) {
  if (pageDone || corr.busy) return;
  const q = corr.qs[corr.q], [a, b] = pieces;
  lastAct = Date.now();
  if (p === a) { say("請在<b>另一個三角形</b>（" + b.labels.join("、") + "）上找。"); return; }
  const need = { point: "vtx", side: "side", angle: "ang" }[q.kind];
  if (tap.kind !== need) { say(CORR_WRONG_KIND[q.kind]); return; }
  const want = corr.map[q.i];   // 對應邊就是對應頂點對面的邊
  const A = corrName(a, q.kind, q.i), B = corrName(b, q.kind, tap.i);
  if (tap.i === want) {
    a.ask = null;
    a.ans.push({ kind: q.kind, i: q.i });
    b.ans.push({ kind: q.kind, i: want });
    b.hint = null;
    b.angleTap = false;
    redraw(a); redraw(b);
    if (challenge) { corr.busy = true; chalRight(`對了！${A} 和 ${B} 是${CORR_WORD[q.kind]}。`); return; }
    catBounce();
    corr.q++;
    corr.busy = true;
    renderProgress();
    say(`對了！疊合時，${A} 和 <b>${B}</b> 會疊在一起，<br>它們是${CORR_WORD[q.kind]}。`, "good");
    const tok = pageToken;
    setTimeout(() => {
      if (tok !== pageToken) return;
      corr.busy = false;
      if (corr.q < 3) askCorr();
      else if (corr.round + 1 < CORR_ROUNDS) { corr.round++; startCorrRound(); }
      else finishPage();
    }, corr.q < 3 ? 1400 : 1000);
    return;
  }
  loseHeart();
  flash(b, "shake", 400);
  const why = q.kind === "side" ? `${A} 和 ${B} 不一樣長` : q.kind === "angle" ? `${A} 和 ${B} 不一樣大` : `疊合時，${A} 和 ${B} 不會疊在一起`;
  say(`${why}，不是${CORR_WORD[q.kind]}。<br>再試一次，也可以疊起來比比看。`, "bad");
}

// ================= 操作：拖曳、旋轉把手、雙指旋轉 =================
const pointers = new Map();
let drag = null, rot = null, gesture = null;
const handleEl = $("#handle");

function localPt(e) {
  const r = board.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function twoAngle() {
  const [a, b] = [...pointers.values()];
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}
function ptrAngle(p, pt) { return Math.atan2(pt.y - p.ny * H, pt.x - p.nx * W) * 180 / Math.PI; }

// 選取的三角形旁邊有一個橘色圓圈，拖著它繞圈就能轉
function drawHandle() {
  const p = selected;
  if (!playing || !p || (p.state !== "free" && p.state !== "pair")) { handleEl.innerHTML = ""; return; }
  const cx = p.nx * W, cy = p.ny * H;
  const off = Math.max(...p.v.map(([x, y]) => Math.hypot(x, y))) * S + 34;
  let a;
  if (rot && rot.p === p) a = rot.ang;
  else a = cy - off > 30 ? -90 : 90;   // 平常在上面，太靠上就放下面
  const rad = a * Math.PI / 180, hx = cx + off * Math.cos(rad), hy = cy + off * Math.sin(rad);
  handleEl.innerHTML =
    `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#ff8f00" stroke-width="3" stroke-dasharray="6 5"/>` +
    `<g data-handle="1" transform="translate(${hx.toFixed(1)},${hy.toFixed(1)})">` +
    `<circle r="40" fill="#000" fill-opacity="0"/>` +
    `<circle r="27" fill="#ff8f00" stroke="#fff" stroke-width="4"/>` +
    `<g class="hico" transform="translate(-14,-14) scale(1.17)">${ICONS.rotR}</g></g>`;
}
function select(p) {
  selected = p;
  for (const q of pieces) if (q.el) q.el.classList.toggle("sel", q === p);
  updateTools();
  drawHandle();
}
function updateTools() {
  const ok = !!selected && (selected.state === "free" || selected.state === "pair");
  for (const id of ["rotL", "rotR", "flip"]) $("#" + id).disabled = !ok;
}

svg.addEventListener("pointerdown", (e) => {
  if (!playing) return;
  const pt = localPt(e);
  // 第二根手指：兩指旋轉選取的三角形（拖圓圈時不算）
  if (pointers.size === 1 && !rot && !gesture && selected && (selected.state === "free" || selected.state === "pair")) {
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, pt);
    if (drag) drag.p.el && drag.p.el.classList.add("dragging");
    gesture = { p: selected, last: twoAngle() };
    drag = null;
    lastAct = Date.now();
    return;
  }
  if (pointers.size) return;   // 再多的手指就不理
  pointers.set(e.pointerId, pt);
  lastAct = Date.now();
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  if (selected && e.target.closest && e.target.closest("[data-handle]")) {
    const a = ptrAngle(selected, pt);
    rot = { p: selected, pid: e.pointerId, r0: selected.r, last: a, total: 0, ang: a };
    return;
  }
  const g = e.target.closest && e.target.closest("[data-id]");
  const p = g && byId(g.dataset.id);
  if (p) {
    select(p);
    layer.appendChild(p.el);
    p.el.classList.add("dragging");
    // 找對應：記下點到的是哪個頂點或哪條邊（沒有拖動才算點一下）
    const hit = e.target.closest && e.target.closest("[data-vtx],[data-side],[data-ang]");
    const tap = hit && (hit.dataset.vtx != null ? { kind: "vtx", i: +hit.dataset.vtx }
      : hit.dataset.ang != null ? { kind: "ang", i: +hit.dataset.ang } : { kind: "side", i: +hit.dataset.side });
    // lift：用手指拖時，三角形稍微浮到手指上方，才不會被手指整個蓋住（滑鼠不用）。老師覺得太高會怪，所以只浮一點點
    const lift = e.pointerType === "touch" ? Math.min(36, lenPx(p) * 0.18 + 12) : 0;
    drag = { p, pid: e.pointerId, dx: p.nx * W - pt.x, dy: p.ny * H - pt.y, x0: pt.x, y0: pt.y, moved: false, tap, lift, tm: 0 };
    if (mode === "tutorial" && p.state === "free") say(TUT_TEXT[tutStep]);
  } else {
    select(null);
  }
});

svg.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const pt = localPt(e);
  pointers.set(e.pointerId, pt);
  if (gesture) {
    if (pointers.size >= 2) {
      const a = twoAngle();
      let d = a - gesture.last;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      gesture.last = a;
      gesture.p.r += d;
      updT(gesture.p);
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const a = ptrAngle(rot.p, pt);
    let d = a - rot.last;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rot.last = a; rot.total += d; rot.ang = a;
    // 每 15° 一格，比較容易轉到剛好的方向
    rot.p.r = Math.round((rot.r0 + rot.total) / 15) * 15;
    updT(rot.p);
    drawHandle();
    return;
  }
  if (drag && e.pointerId === drag.pid) {
    const p = drag.p;
    if (!drag.moved && Math.hypot(pt.x - drag.x0, pt.y - drag.y0) > 8) { drag.moved = true; drag.tm = performance.now(); }
    // 開始拖了才浮起來，0.15 秒內慢慢升上去；只點一下不會動
    const up = drag.moved ? drag.lift * Math.min(1, (performance.now() - drag.tm) / 150) : 0;
    p.nx = (pt.x + drag.dx) / W;
    p.ny = (pt.y + drag.dy - up) / H;
    if (p.state === "free" && !direct) clampIn(p);   // 第 1～3 關可以直接拖到下面的格子，不要被桌面邊緣擋住
    updT(p);
    const over = dropBin(e, p);
    for (const b of binsEl.querySelectorAll(".bin")) b.classList.toggle("over", b === over);
  }
});

// 放到哪一格：看三角形在哪裡（學生看到的是三角形），三角形不在格子上時再看手指
function dropBin(e, p) {
  const r = board.getBoundingClientRect();
  return binAt(r.left + p.nx * W, r.top + p.ny * H) || binAt(e.clientX, e.clientY);
}

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture) {
    if (pointers.size < 2) {
      // 放開後吸附到 15° 的倍數
      const p = gesture.p;
      gesture = null;
      p.el && p.el.classList.remove("dragging");
      lastAct = Date.now();
      tween(p, { r: Math.round(p.r / 15) * 15 }, 120, () => { if (p.state === "free") checkDrop(p, true); });
    }
    return;
  }
  if (rot && e.pointerId === rot.pid) {
    const p = rot.p;
    rot = null;
    drawHandle();
    lastAct = Date.now();
    if (p.state === "free") checkDrop(p, true);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const p = drag.p, dragMoved = drag.moved, tap = drag.tap;
  drag = null;
  p.el && p.el.classList.remove("dragging");
  for (const b of binsEl.querySelectorAll(".bin")) b.classList.remove("over");
  if (mode === "corr") {
    if (!dragMoved && tap) answerCorr(p, tap);
    return;
  }
  if (mode === "pick") {
    if (dragMoved) pickDrop(p, false);   // 點一下只是選取，疊上去才判斷
    return;
  }
  const bin = dropBin(e, p);
  // 第 1、2 關直接分類；其他關要先疊好一組
  if (p.state === "pair" || (direct && p.state === "free")) {
    if (bin && classify(p, bin)) return;
    const tmp = { ...p }; clampIn(tmp);
    tween(p, { nx: tmp.nx, ny: tmp.ny }, 220);
    return;
  }
  if (!dragMoved) return;
  if (bin) say("這一關要先把<b>全等</b>的兩個三角形疊在一起，才能放進格子。");
  checkDrop(p, false);
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

function turn(deg) {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { r: Math.round(p.r / 15) * 15 + deg }, 180, () => { if (p.state === "free") checkDrop(p, true); });
}
$("#rotL").addEventListener("click", () => turn(-30));
$("#rotR").addEventListener("click", () => turn(30));
$("#flip").addEventListener("click", () => {
  const p = selected;
  if (!p) return;
  lastAct = Date.now();
  tween(p, { s: -Math.sign(p.s || 1) }, 260, () => { if (p.state === "free") checkDrop(p, true); });
});

// ================= 提示 =================
function giveHint() {
  if (!playing || pageDone) return;
  lastAct = Date.now();
  if (challenge) { say("挑戰關不能用提示，加油！"); return; }
  if (mode === "corr") {
    if (corr.busy) return;
    const q = corr.qs[corr.q], b = pieces[1];
    b.hint = { kind: q.kind, i: corr.map[q.i] };
    redraw(b);
    setTimeout(() => { b.hint = null; redraw(b); }, 4300);
    say("答案在<b>一閃一閃</b>的地方。<br>也可以把兩個三角形疊起來比比看。");
    catBounce();
    return;
  }
  if (direct) {
    const p = selected && selected.state === "free" ? selected : pieces.find((q) => q.state === "free");
    if (!p) return;
    layer.appendChild(p.el);
    flash(p, "pulse", 4300);
    showMarks(p, mode);
    say("看看一閃一閃的三角形上的記號：" + markLegend(mode) + "<br>它要放哪一格？");
    catBounce();
    return;
  }
  const free = pieces.filter((p) => p.state === "free" && !p.distractor);
  // 有選取的三角形就優先找它的全等朋友
  if (selected && free.includes(selected)) free.unshift(...free.splice(free.indexOf(selected), 1));
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) {
    if (congruent(free[i], free[j])) {
      // 拿到最上層，才不會被別的三角形蓋住
      layer.appendChild(free[j].el); layer.appendChild(free[i].el);
      flash(free[i], "pulse", 4300); flash(free[j], "pulse", 4300);
      say(mode === "tutorial" ? TUT_TEXT[tutStep] : "一閃一閃的兩個三角形<b>全等</b>。<br>把一個拖到另一個上面，疊疊看。");
      catBounce();
      return;
    }
  }
  const pair = pieces.find((p) => p.state === "pair");
  if (pair) {
    layer.appendChild(pair.el);
    flash(pair, "pulse", 4300);
    showMarks(pair, mode === "tutorial" ? "both" : mode);
    say("看看一閃一閃這一組的記號：" + markLegend(mode === "tutorial" ? "both" : mode));
    catBounce();
  }
}
$("#hintBtn").addEventListener("click", giveHint);
setInterval(() => { if (playing && !pageDone && !challenge && Date.now() - lastAct > 30000) giveHint(); }, 1000);

// ================= 對話 =================
function say(html, tone) {
  const el = $("#say");
  el.innerHTML = `<span>${html}</span>`;
  el.className = tone || "";
}
function catBounce() { const c = $("#cat"); c.classList.remove("bounce"); void c.offsetWidth; c.classList.add("bounce"); }

// ================= 關卡結束與畫面 =================
// 錯 0～1 次 3 顆星、錯 2 次 2 顆星（錯第 3 次愛心就用完了，要複習後重來）
function starsFor(m) { return m <= 1 ? 3 : m === 2 ? 2 : 1; }
function starHtml(n) { return [0, 1, 2].map((i) => ico("star", "star" + (i < n ? "" : " off"))).join(""); }
function fmtTime(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)} 分 ${s % 60} 秒`; }

function finishPage() {
  if (pageDone) return;
  pageDone = true;
  const time = Date.now() - pageStart;
  const stars = starsFor(mistakes);
  if (mode !== "tutorial") {
    results.push({ title: PAGES[pageIdx].title, stars, mistakes, time });
    saveBest(PAGES[pageIdx].id, stars);
  }
  catBounce();
  const d = pieces.find((p) => p.distractor && p.state === "free");
  let extra = "";
  if (d) {
    showMarks(d, mode, 6000);
    flash(d, "pulse", 2900);
    say("全部分好了！還剩下一閃一閃的這一個：<br>" + d.reason, "good");
    extra = `<p>剩下的那個三角形：${d.reason}</p>`;
  }
  const last = pageIdx === PAGES.length - 1;
  const tok = pageToken;
  setTimeout(() => {
    if (tok !== pageToken) return;
    if (mode === "tutorial") {
      showPanel(`<div class="big-cat">${ico("cat")}</div><h2>練習完成！</h2>
        <p>一個三角形經過<b>移動、旋轉、翻面</b>，如果能和另一個<b>完全疊合</b>，這兩個三角形就是<b>全等三角形</b>。</p>
        <p>下一關：先疊合，再分類。</p>
        <button class="btn" id="nextBtn">開始${PAGES[pageIdx + 1].title.split("：")[0]}</button>`);
    } else {
      showPanel(`<div class="big-cat">${ico("cat")}</div><h2>${PAGES[pageIdx].title.split("：")[0]} 完成！</h2>
        <div class="stars">${starHtml(stars)}</div>
        <p>錯誤 ${mistakes} 次・用了 ${fmtTime(time)}</p>${extra}
        <button class="btn" id="nextBtn">${last ? "看成績" : "下一關"}</button>
        <button class="btn ghost" id="toMenuBtn">回選單</button>`);
    }
    const toMenu = $("#toMenuBtn");
    if (toMenu) toMenu.addEventListener("click", showHome);
    $("#nextBtn").addEventListener("click", () => {
      hidePanel();
      if (last) return showFinal();
      let n = pageIdx + 1;
      if (replay && PAGES[n].mode === "tutorial") n++;   // 再玩一次就跳過練習
      startPage(n);
    });
  }, d ? 2400 : 500);
}

function showPanel(html, cls) { playing = false; drawHandle(); $("#panel").className = "panel" + (cls ? " " + cls : ""); $("#panel").innerHTML = html; $("#overlay").classList.add("show"); }
function hidePanel() { $("#overlay").classList.remove("show"); }

function showFinal() {
  const total = Date.now() - gameStart;
  const allStars = results.reduce((s, r) => s + r.stars, 0);
  const rows = results.map((r) => `<tr><td>${r.title.split("：")[0]}</td><td>${starHtml(r.stars)}</td><td>錯 ${r.mistakes} 次</td></tr>`).join("");
  const max = results.length * 3;
  const msg = allStars >= max - 1 ? "太厲害了！" : allStars >= max * 0.66 ? "做得很好！" : "完成了！再玩一次會更熟練。";
  const all = results.length === PAGES.filter((p) => p.mode !== "tutorial").length;
  showPanel(`<div class="big-cat">${ico("trophy")}</div><h1>${all ? "全部完成！" : "完成了！"}</h1>
    ${seatNo ? `<p><b>座號 ${escapeHtml(seatNo)}</b></p>` : ""}
    <table class="result">${rows}</table>
    <p>總共 ${allStars} 顆星・${fmtTime(total)}</p>
    <p>${msg}</p>
    ${challengeUnlocked() ? `<p><b>挑戰關已經解鎖了！</b>回選單就能挑戰。</p>` : ""}
    <button class="btn" id="againBtn">再玩一次</button>
    <button class="btn ghost" id="homeBtn">回選單</button>
    <p class="note">每次的題目都不一樣，可以多挑戰幾次！</p>`);
  $("#againBtn").addEventListener("click", () => { hidePanel(); results = []; gameStart = Date.now(); replay = true; startPage(0); });
  $("#homeBtn").addEventListener("click", showHome);
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// 首頁兼選關：可以從第 1 關開始，也可以直接選一關，玩完會接著下一關
function showHome() {
  pageToken++;
  challenge = false;
  layer.innerHTML = ""; binsEl.innerHTML = ""; pieces = []; selected = null;
  $("#pageLabel").textContent = "";
  $("#progress").innerHTML = "";
  $("#hearts").innerHTML = "";
  say("從第 1 關開始，或選一關。");
  const best = loadBest();
  const levels = PAGES.map((pg, i) => {
    const [num, name] = pg.title.split("：");
    const stars = pg.mode === "tutorial" ? "" : `<i class="lvl-stars">${starHtml(best[pg.id] || 0)}</i>`;
    return `<button class="lvl" data-i="${i}"><b>${num}</b><span>${name}</span>${stars}</button>`;
  }).join("");
  // 挑戰關：第 1～5 關都拿到 3 顆星才打開；不會從「下一關」接過去
  const open = challengeUnlocked();
  const chalNote = !open ? "第 1～5 關都拿到 3 顆星，就能挑戰"
    : best.challenge != null ? `最佳成績 ${best.challenge} 分` : "可以挑戰了！";
  const chalBtn = `<button class="lvl chal${open ? "" : " locked"}" id="chalBtn"><b>${ico(open ? "clock" : "lock")} 挑戰關：限時 90 秒</b><span>${chalNote}</span></button>`;
  // 每一關的內容都寫在選關按鈕上，首頁就不再另外列說明，平板橫放才不用捲動
  showPanel(`<h1 id="homeTitle">${ico("cat")} 疊疊看！三角形分類</h1>
    <div class="seat">座號（可不填）：<input id="seatInput" inputmode="numeric" maxlength="4" value="${escapeHtml(seatNo)}"></div>
    <button class="btn" id="startBtn">從第 1 關開始</button>
    <button class="btn ghost" id="scoreBtn">${ico("trophy")} 看成績</button>
    <p class="pick">或選一關：</p>
    <div class="levels">${levels}${chalBtn}</div>
    <p class="note">全部約 12 分鐘・<button class="linkbtn" id="clearBtn">清除這台平板的紀錄</button></p>`, "wide");
  $("#homeTitle").addEventListener("click", onTitleTap);
  $("#chalBtn").addEventListener("click", () => {
    if (!challengeUnlocked()) {   // 還沒解鎖：搖一下，提醒看下面那行字
      const b = $("#chalBtn"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge");
      return;
    }
    seatNo = $("#seatInput").value.trim();
    hidePanel();
    startChallenge();
  });
  // 清除紀錄要按兩次，避免不小心按到
  $("#clearBtn").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "再按一次就會清除"; return; }
    clearBest();
    showHome();
  });
  const go = (i) => {
    seatNo = $("#seatInput").value.trim();
    replay = false;
    hidePanel();
    results = [];
    gameStart = Date.now();
    startPage(i);
  };
  $("#startBtn").addEventListener("click", () => go(0));
  $("#scoreBtn").addEventListener("click", () => { seatNo = $("#seatInput").value.trim(); showScores(); });
  for (const b of document.querySelectorAll(".lvl[data-i]")) b.addEventListener("click", () => go(+b.dataset.i));
}

// ================= 愛心：每關 3 顆，答錯扣一顆 =================
function renderHearts(justLost) {
  const el = $("#hearts");
  if (!challenge && mode === "tutorial") { el.innerHTML = ""; return; }   // 練習沒有愛心
  const left = Math.max(0, LIVES - mistakes);
  el.innerHTML = Array.from({ length: LIVES }, (_, i) =>
    ico("heart", "heart" + (i < left ? "" : " lost") + (justLost && i === left ? " break" : ""))).join("");
}
function loseHeart() {
  mistakes++;
  renderHearts(true);
  if (mistakes < LIVES) return;
  // 愛心用完：先停一下（0.7 秒），讓學生看到答錯的說明，再去複習（挑戰關就直接結束）
  playing = false;
  drawHandle();
  const tok = pageToken;
  setTimeout(() => {
    if (tok !== pageToken) return;
    if (challenge) endChallenge("lives"); else showReview();
  }, 700);
}

// ================= 愛心用完：複習一下再重來 =================
const REVIEW = {
  side: [["正三角形", "三條邊都一樣長", [60, 60, 60]], ["等腰三角形", "有兩條邊一樣長", [40, 70, 70]], ["不等邊三角形", "三條邊都不一樣長", [50, 60, 70]]],
  angle: [["銳角三角形", "三個角都是銳角", [50, 60, 70]], ["直角三角形", "有一個角是直角", [90, 30, 60]], ["鈍角三角形", "有一個角是鈍角", [120, 35, 25]]],
};
// 畫一個小三角形（含記號），借用 marksSvg，所以暫時把 S 換成小圖的大小
function miniTri(angles, kind, color) {
  const keep = S;
  S = 60;
  const t = makeTri(angles, 1);
  const p = { v: t.v, ang: t.ang, sides: t.sides, size: 1, cat: categorize(t.ang) };
  const body = `<polygon points="${pointsAttr(p)}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` + marksSvg(p, kind);
  const xs = t.v.map((q) => q[0] * S), ys = t.v.map((q) => q[1] * S);
  S = keep;
  const pad = 12, x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return `<svg class="mini-tri" viewBox="${x0} ${y0} ${Math.max(...xs) - x0 + pad} ${Math.max(...ys) - y0 + pad}">${body}</svg>`;
}
// 對應的示意圖：A↔D 粉紅圈、AB↔DE 藍線、角 C↔角 F 綠色扇形
function corrReviewSvg() {
  const keep = S;
  S = 70;
  const t = makeTri([50, 60, 70], 1);
  const v = t.v.map(([x, y]) => [x * S, y * S]);
  S = keep;
  const draw = (labels, rot, color) => {
    let g = `<polygon points="${v.map((q) => q.join(",")).join(" ")}" fill="${color}" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/>` +
      `<line x1="${v[0][0]}" y1="${v[0][1]}" x2="${v[1][0]}" y2="${v[1][1]}" stroke="${CORR_COL.side}" stroke-width="7" stroke-linecap="round"/>` +
      `<path d="${arcD(v, 2, 18)}" fill="${CORR_COL.angle}" fill-opacity=".5" stroke="${CORR_COL.angle}" stroke-width="3"/>`;
    for (let i = 0; i < 3; i++) {
      const o = norm(v[i]), x = v[i][0] + o[0] * 18, y = v[i][1] + o[1] * 18;
      g += `<g transform="translate(${x},${y}) rotate(${-rot})"><circle r="12" fill="#fff" stroke="${i === 0 ? CORR_COL.point : "#5d4037"}" stroke-width="${i === 0 ? 4 : 2}"/>` +
        `<text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#4e342e">${labels[i]}</text></g>`;
    }
    return `<g transform="rotate(${rot})">${g}</g>`;
  };
  return `<svg class="mini-corr" viewBox="-85 -80 330 160">${draw(["A", "B", "C"], 0, "#ffcc80")}<g transform="translate(160,0)">${draw(["D", "E", "F"], 150, "#b3e5fc")}</g></svg>`;
}
function showReview() {
  const card = ([name, why, ang], kind, i) =>
    `<div class="rv">${miniTri(ang, kind, COLORS[i])}<b>${name}</b><span>${why}</span></div>`;
  let html = `<div class="big-cat">${ico("book")}</div><h2>愛心用完了，先複習一下</h2>`;
  if (mode === "side" || mode === "both") html += `<div class="review">${REVIEW.side.map((c, i) => card(c, "side", i)).join("")}</div>`;
  if (mode === "angle" || mode === "both") html += `<div class="review">${REVIEW.angle.map((c, i) => card(c, "angle", i + 3)).join("")}</div>`;
  if (mode === "both" && !direct) html += `<p><b>全等</b>：形狀、大小都一樣，可以完全疊合。<br>可以移動、旋轉、翻面來疊疊看。</p>`;
  if (mode === "corr") {
    html += `<div class="review one">${corrReviewSvg()}</div>
      <p>兩個三角形<b>全等</b>時，疊合在一起的點、邊、角，<br>叫做<b>對應點、對應邊、對應角</b>。<br>對應邊一樣長，對應角一樣大。</p>`;
  }
  html += `<button class="btn" id="retryBtn">我懂了，重新開始這一關</button>
    <button class="btn ghost" id="toMenuBtn">回選單</button>`;
  showPanel(html, "wide");
  $("#retryBtn").addEventListener("click", () => { hidePanel(); startPage(pageIdx); });
  $("#toMenuBtn").addEventListener("click", showHome);
}

// ================= 紀錄：每關最佳星星、挑戰關最佳分數（存在這台平板上） =================
const BEST_KEY = "triangle-best-v1";
const SCORED = PAGES.filter((p) => p.mode !== "tutorial");
function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (_) { return {}; }
}
// 比原本好才存；有存就回傳 true
function saveBest(key, val) {
  try {
    const b = loadBest();
    if (b[key] >= val) return false;
    b[key] = val;
    localStorage.setItem(BEST_KEY, JSON.stringify(b));
    return true;
  } catch (_) { return false; }
}
function clearBest() { try { localStorage.removeItem(BEST_KEY); } catch (_) {} }
function challengeUnlocked() { const b = loadBest(); return !!b.teacher || SCORED.every((p) => b[p.id] === 3); }

// 老師解鎖：在首頁連點標題 5 下（3 秒內），輸入老師密碼，就能直接打開挑戰關（存在這台平板上，清除紀錄會一起清掉）
const TEACHER_CODE = "1207";
let titleTaps = [];
function onTitleTap() {
  const now = Date.now();
  titleTaps = titleTaps.filter((t) => now - t < 3000);
  titleTaps.push(now);
  if (titleTaps.length < 5) return;
  titleTaps = [];
  showPanel(`<h2>老師解鎖</h2>
    <p>輸入老師密碼，就能直接打開挑戰關。</p>
    <div class="seat"><input id="codeInput" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <p id="codeMsg" class="note"></p>
    <button class="btn" id="codeBtn">解鎖</button>
    <button class="btn ghost" id="codeCancel">取消</button>`);
  $("#codeBtn").addEventListener("click", () => {
    if ($("#codeInput").value.trim() !== TEACHER_CODE) { $("#codeMsg").textContent = "密碼不對，再試一次。"; return; }
    try { const b = loadBest(); b.teacher = true; localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (_) {}
    showHome();
    say("挑戰關已經打開了。");
  });
  $("#codeCancel").addEventListener("click", showHome);
}

// ================= 挑戰關：限時 90 秒，綜合題型 =================
// 題目一題接一題，輪流出現：以邊分類、以角分類、以邊和角分類、找全等、找對應。答對一題 1 分。
// 3 顆愛心，答錯 3 次就結束；時間到時，剩幾顆愛心就再加幾分。
const CHAL_SEC = 90;
const CHAL_TYPES = ["side", "angle", "both", "pick", "corr"];

function makePiece(tri, id, color) {
  return {
    id, v: tri.v.map((q) => [...q]), ang: tri.ang, sides: tri.sides, size: tri.size, cat: categorize(tri.ang),
    distractor: false, reason: "", state: "free", partner: null, nx: 0.5, ny: 0.5,
    r: 30 * rand(12), s: Math.random() < 0.5 ? 1 : -1, marks: null, color,
  };
}

function startChallenge() {
  pageToken++;
  challenge = true;
  pageIdx = -1;
  mistakes = 0;
  pageDone = false;
  selected = null;
  lastAct = Date.now();
  $("#pageLabel").textContent = "挑戰關";
  chal = { end: Date.now() + CHAL_SEC * 1000, score: 0, last: null, over: false, busy: false, n: 0 };
  renderHearts();
  playing = true;
  nextChalTask();
  const tok = pageToken;
  const timer = setInterval(() => {
    if (tok !== pageToken || chal.over) return clearInterval(timer);
    renderChalBar();
    if (Date.now() >= chal.end) endChallenge("time");
  }, 200);
}

function renderChalBar() {
  const ms = Math.max(0, chal.end - Date.now()), left = Math.ceil(ms / 1000);
  $("#progress").innerHTML =
    `<span class="chal-time${left <= 10 ? " hurry" : ""}">${ico("clock")} ${left} 秒</span>` +
    `<span class="chal-bar"><i style="width:${(100 * ms / (CHAL_SEC * 1000)).toFixed(1)}%"></i></span>` +
    `<span class="chal-score">${chal.score} 分</span>`;
}

function nextChalTask() {
  if (chal.over) return;
  const type = pick(CHAL_TYPES.filter((t) => t !== chal.last));   // 不連續出同一種
  chal.last = type;
  chal.busy = false;
  selected = null;
  mode = type;
  direct = type === "side" || type === "angle" || type === "both";
  buildBins();
  measure();
  if (type === "corr") {
    corr = { round: rand(3) };
    startCorrRound();
  } else if (type === "pick") {
    startPickTask();
  } else {
    // 分類題：一次一個三角形，拖到正確的格子
    const keys = type === "both" ? ALL_KEYS.filter((k) => k !== "equi-acute") : ALL_KEYS;
    grid = { cols: 1, rows: 1 };
    measure();
    const p = makePiece(makeTri(pick(LIB[pick(keys)]), 0.85 + Math.random() * 0.25), "q" + chal.n++, pick(COLORS));
    p.nx = Math.max(100, W - TOOL_W) / 2 / W;
    fitIn(p, 10, 50);
    pieces = [p];
    renderAll();
    updateTools();
    say(`<b>${type === "side" ? "以邊分類" : type === "angle" ? "以角分類" : "以邊和角分類"}</b><br>把三角形拖到下面正確的格子裡。`);
  }
  renderChalBar();
}

// 把三角形等比例放大或縮小（形狀一樣，大小不同）
function scaleTri(t, k) {
  return { v: t.v.map(([x, y]) => [x * k, y * k]), ang: t.ang, sides: t.sides.map((s) => s * k), size: t.size * k };
}

// 找全等：一個虛線框的三角形，另外三個裡只有一個和它全等（另外兩個：大小不同、形狀不同）
// 不是點一下就判斷：要把候選的三角形拖過去疊在虛線框上（可以轉、翻），疊合了才算對（pickDrop()）
function startPickTask() {
  const ang = pick(LIB[pick(ALL_KEYS.filter((k) => k !== "equi-acute"))]);
  const others = ALL_KEYS.flatMap((k) => LIB[k]).filter((a) => !sameAngles(a, ang));
  const size = 0.8 + Math.random() * 0.15, bigger = Math.random() < 0.5;
  const colors = shuffle([...COLORS]);
  // 全等和大小不同的都用同一份形狀，只差旋轉和翻面，才轉得到一樣的方向
  const base = makeTri(ang, size);
  const target = makePiece(base, "k0", colors[0]);
  target.target = true;
  const cands = shuffle([
    Object.assign(makePiece(base, "k1", colors[1]), { answer: true }),
    Object.assign(makePiece(scaleTri(base, bigger ? 1.25 : 0.75), "k2", colors[2]), { why: bigger ? "比較大" : "比較小" }),
    Object.assign(makePiece(makeTri(pick(others), size), "k3", colors[3]), { why: "形狀不一樣" }),
  ]);
  const ans = cands.find((p) => p.answer);
  if (ans.s === target.s && ans.r === target.r) ans.r += 90;   // 一開始不能已經對齊
  pieces = [target, ...cands];
  const availW = Math.max(100, W - TOOL_W);
  const cols = availW > H * 1.6 ? 4 : 2, rows = 4 / cols;
  grid = { cols, rows };
  measure();
  pieces.forEach((p, k) => {
    p.nx = ((k % cols) + 0.5) * availW / cols / W;
    p.ny = (Math.floor(k / cols) + 0.5) / rows;
    fitIn(p, 10, 50);
  });
  renderAll();
  updateTools();
  say("哪一個和<b>虛線框</b>的三角形是<b>全等三角形</b>？<br>把它拖過去疊疊看。");
}

// 找全等：放下或轉完時檢查有沒有疊在虛線框上
function pickDrop(p, quiet) {
  if (!playing || chal.over || chal.busy) return;
  const target = pieces.find((q) => q.target);
  // 拖的是虛線框那個時，改看最近的候選
  const a = p.target
    ? pieces.filter((q) => !q.target).sort((x, y) => Math.hypot(x.nx - p.nx, x.ny - p.ny) - Math.hypot(y.nx - p.nx, y.ny - p.ny))[0]
    : p;
  const near = Math.hypot((a.nx - target.nx) * W, (a.ny - target.ny) * H) < 0.6 * Math.max(lenPx(a), lenPx(target));
  if (!near) return;   // 還沒疊上去，不判斷
  lastAct = Date.now();
  if (congruent(a, target)) {
    if (isAligned(a, target)) { flash(a, "pop", 700); chalRight("完全疊合了！這兩個三角形是全等三角形。"); return; }
    if (isAligned(a, target, true)) say("方向對了！再移動一點，讓三個角剛好疊在一起。");
    else if (!quiet) say("這兩個大小、形狀都一樣。<br>再<b>轉一轉</b>或<b>翻面</b>，讓它們對齊。");
    return;
  }
  if (quiet) return;
  // 疊上去比比看不扣愛心（老師要求）：只說明，再把它推開
  flash(a, "shake", 400);
  say(`這一個${a.why}，疊不起來，不是全等三角形。<br>再比比看別的。`);
  pushAway(a, target);
}

function chalRight(msg) {
  chal.score++;
  chal.busy = true;
  renderChalBar();
  say(msg, "good");
  catBounce();
  const tok = pageToken;
  setTimeout(() => { if (tok === pageToken && !chal.over) nextChalTask(); }, 700);
}

function endChallenge(reason) {
  if (chal.over) return;
  chal.over = true;
  pageToken++;   // 停掉計時器和還沒跑完的動作
  playing = false;
  const bonus = reason === "time" ? Math.max(0, LIVES - mistakes) : 0;
  const total = chal.score + bonus;
  const before = loadBest().challenge;
  const isNew = saveBest("challenge", total);
  showPanel(`<div class="big-cat">${ico("clock")}</div><h2>${reason === "time" ? "時間到！" : "愛心用完了！"}</h2>
    <p>答對 ${chal.score} 題${bonus ? `，還剩 ${bonus} 顆愛心，加 ${bonus} 分` : ""}</p>
    <p class="big-score">${total} 分</p>
    <p>${isNew ? (before == null ? "這是你的第一個成績！" : "新紀錄！") : `最佳成績：${before} 分`}</p>
    <button class="btn" id="chalAgainBtn">再挑戰一次</button>
    <button class="btn ghost" id="toMenuBtn">回選單</button>`);
  $("#chalAgainBtn").addEventListener("click", () => { hidePanel(); startChallenge(); });
  $("#toMenuBtn").addEventListener("click", showHome);
}

// 看成績：選單上隨時可以看，不用等第 5 關玩完（顯示這台平板上的最佳紀錄）
function showScores() {
  const best = loadBest();
  const rows = SCORED.map((p) => {
    const [num, name] = p.title.split("：");
    return `<tr><td>${num}</td><td>${name}</td><td>${best[p.id] ? starHtml(best[p.id]) : "還沒玩"}</td></tr>`;
  }).join("");
  const got = SCORED.reduce((s, p) => s + (best[p.id] || 0), 0);
  const chal = best.challenge != null ? `${best.challenge} 分` : challengeUnlocked() ? "還沒挑戰" : "還沒解鎖";
  showPanel(`<div class="big-cat">${ico("trophy")}</div><h2>我的成績</h2>
    ${seatNo ? `<p><b>座號 ${escapeHtml(seatNo)}</b></p>` : ""}
    <table class="result">${rows}</table>
    <p>一共 ${got} 顆星（最多 ${SCORED.length * 3} 顆）・挑戰關最佳成績：${chal}</p>
    <p class="note">這是這台平板上每一關最好的成績。</p>
    <button class="btn" id="toMenuBtn">回選單</button>`, "wide");
  $("#toMenuBtn").addEventListener("click", showHome);
}

// 遊戲中按選單按鈕：先確認，避免學生不小心按到
$("#menuBtn").addEventListener("click", () => {
  if (!playing || pageDone) return;   // 關卡完成時，完成畫面本身就有「回選單」
  showPanel(`<div class="big-cat">${ico("cat")}</div><h2>要回到選關畫面嗎？</h2>
    <p>這一關還沒做完的部分不會保留。</p>
    <button class="btn" id="keepBtn">繼續玩</button>
    <button class="btn ghost" id="leaveBtn">回選單</button>`);
  $("#keepBtn").addEventListener("click", () => { hidePanel(); playing = true; lastAct = Date.now(); drawHandle(); });
  $("#leaveBtn").addEventListener("click", showHome);
});

// ================= 其他 =================
new ResizeObserver(() => onResize()).observe(board);
function onResize() {
  if (!pieces.length || (W === board.clientWidth && H === board.clientHeight)) return;
  measure();
  for (const p of pieces) if (p.state === "free" || p.state === "pair") clampIn(p);
  renderAll();
}
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 放上圖示
$("#cat").innerHTML = ico("cat");
$("#menuBtn").innerHTML = ico("menu");
$("#hintBtn").innerHTML = ico("bulb");
$("#rotL").innerHTML = ico("rotL") + "<span>左轉</span>";
$("#rotR").innerHTML = ico("rotR") + "<span>右轉</span>";
$("#flip").innerHTML = ico("flip") + "<span>翻面</span>";

showHome();
</script>
